odos, a quantidade de horas extras acumuladas era muito alta, e a sociedade empresária não estava conseguindo conceder as folgas compensatórias dentro do prazo estabelecido. Diante dessa situação, os empregados procuraram você, como advogado(a), para saber a validade desse banco de horas e seus direitos. Sobre a hipótese, considerando a legislação de regência, assinale a opção que apresenta a correta orientação a ser dada.", "o": ["O banco de horas pode ser instituído por acordo individual escrito, desde que a compensação ocorra no período máximo de seis meses. Ultrapassado esse prazo, as horas não compensadas devem ser pagas como extras, acrescidas do adicional.", "O banco de horas implementado por acordo individual é totalmente inválido, pois a Constituição Federal exige uma negociação coletiva para a instituição de qualquer regime de compensação de jornada.", "O banco de horas é válido, mesmo por acordo individual, desde que a compensação ocorra no prazo máximo de um ano, sendo o prazo de seis meses estabelecido pela sociedade empresária uma liberalidade.", "O banco de horas é válido apenas se a compensação for feita integralmente no mesmo mês, caso contrário, as horas extras devem ser pagas com o adicional legal."], "c": 0, "e": "Art. 59, §5º, da CLT: banco de horas por acordo individual escrito é válido com compensação em até seis meses; o que não for compensado é pago como hora extra."}, {"id": "q72", "n": {"1": 72, "2": 73, "3": 75, "4": 74}, "p": "Joana e Paula foram contratadas para o cargo de Engenheiro Civil Júnior por uma sociedade empresária de engenharia, em 1º de janeiro de 2020, com as mesmas atribuições e responsabilidades. Em 1º de julho de 2021, Joana foi promovida a Engenheira Civil Plena, com aumento salarial e novas responsabilidades, enquanto Paula permaneceu no cargo de Júnior, realizando as mesmas tarefas e com a mesma remuneração. Em 1º de janeiro de 2022, a sociedade empresária contratou uma nova funcionária, Carla, também para o cargo de Engenheiro Civil Júnior, com salário superior, mas com as mesmas funções de Paula, igual produtividade e perfeição técnica. Inconformada com a diferença salarial em relação a Carla, Paula pediu à sociedade empresária que equiparasse o seu salário ao de Carla. A sociedade indeferiu o pedido, com base em quadro de carreira que entrará em vigor em pouco tempo. Em razão disso, Paula buscou a sua orientação jurídica, como advogado(a), para saber se tem direito à equiparação salarial. Sobre a orientação a ser dada, considerando a legislação aplicável, assinale a afirmativa correta.", "o": ["Paula tem direito à equiparação do seu salário ao de Joana, pois ambas foram contratadas na mesma data e para o mesmo cargo, e a diferença salarial sem justificativa é discriminatória.", "Paula não tem direito à equiparação do seu salário ao de Carla, pois a contratação de uma nova empregada com salário superior não configura equiparação, e sim política salarial da sociedade empresária.", "Paula não tem direito à equiparação do seu salário ao de Carla, pois a diferença salarial se justifica pela existência de um quadro de carreira na sociedade empresária que entrará em vigor, o que afasta a presunção de discriminação.", "Paula tem direito à equiparação do seu salário ao de Carla, porque ambas exercem as mesmas funções, com a mesma produtividade e perfeição técnica, considerando, ainda, que a diferença de tempo na função não é superior a dois anos."], "c": 3, "e": "Art. 461 da CLT: Paula e Carla têm mesma função, produtividade e perfeição técnica, e a diferença na função é inferior a dois anos. Quadro de carreira futuro não afasta a equiparação."}, {"id": "q73", "n": {"1": 73, "2": 74, "3": 71, "4": 75}, "p": "Mariana, empregada gestante, foi dispensada sem justa causa por seu empregador, uma pequena sociedade empresária de consultoria, quando, sem saber, estava no terceiro mês de gravidez. Após a dispensa, ela procurou saber sobre os seus direitos e descobriu que estava grávida no momento da rescisão. Imediatamente, comunicou o fato ao empregador, que se recusou a reintegrá-la, alegando desconhecimento da gravidez no momento da dispensa e que a gravidez só foi confirmada após o término do contrato. Em razão disso, Mariana buscou a sua orientação jurídica para saber se tem direito à estabilidade provisória da gestante e se o desconhecimento do empregador, a respeito de sua condição, afasta esse direito. Sobre a hipótese, assinale a opção que apresenta a correta orientação jurídica a ser dada.", "o": ["Mariana tem direito à estabilidade da gestante, mas não à reintegração; a garantia restringe-se aos salários e demais direitos correspondentes ao período de estabilidade.", "Mariana tem direito à estabilidade provisória da gestante desde a confirmação da gravidez, e tem direito à reintegração ou à indenização substitutiva correspondente ao período.", "Mariana tem direito à estabilidade da gestante, mas o empregador só seria obrigado a reintegrá-la se a gravidez tivesse sido comunicada por meio de atestado médico antes da dispensa.", "Mariana não tem direito à estabilidade da gestante, pois o empregador desconhecia a condição dela no momento da dispensa, e a lei exige a comunicação formal da gravidez antes da rescisão."], "c": 1, "e": "Súmula 244 do TST: o desconhecimento da gravidez pelo empregador não afasta a estabilidade, com direito à reintegração ou à indenização substitutiva."}, {"id": "q74", "n": {"1": 74, "2": 75, "3": 72, "4": 71}, "p": "Mário, empregado da sociedade empresária Carga Pesada, foi envolvido em um acidente de trânsito enquanto dirigia o caminhão da sociedade empresária, que causou danos significativos ao veículo e a uma carga de alto valor. A sociedade empresária, alegando culpa exclusiva de Mário pela imprudência na direção, descontou o valor correspondente ao prejuízo sofrido com o conserto do caminhão e a reposição da carga de seu salário mensal. Mário, inconformado, procurou você, como advogado(a), para saber se esse desconto era legal, considerando que não havia em seu contrato de trabalho uma cláusula expressa permitindo tais descontos, e ele não agiu com dolo. Sobre a hipótese, considerando a legislação aplicável, assinale a opção que apresenta a correta orientação a ser dada.", "o": ["O desconto salarial é ilícito, porque o dano não foi causado por dolo do empregado.", "O desconto salarial é ilícito, pois a CLT veda qualquer tipo de desconto salarial, salvo por determinação judicial ou contribuição previdenciária.", "O desconto salarial é lícito, caso Mário tivesse agido com dolo, pois a culpa não autoriza o empregador a efetuar descontos sem a prévia autorização judicial.", "O desconto salarial é lícito, pois o empregado é responsável pelos danos que causar ao patrimônio do empregador, independentemente de previsão contratual ou culpa."], "c": 0, "e": "Art. 462, §1º, da CLT: dano causado por culpa só pode ser descontado se houver acordo; sem cláusula e sem dolo, o desconto é ilícito."}, {"id": "q75", "n": {"1": 75, "2": 71, "3": 73, "4": 72}, "p": "O proprietário de uma rede de farmácias, irritado com reiterados atrasos de um farmacêutico que já havia recebido advertências verbais e escritas, decide aplicar uma suspensão disciplinar de 45 dias como medida educativa severa, visando evitar a dispensa por justa causa. O empregado recusa-se a assinar a suspensão e informa que ingressará com medida judicial. Diante da situação, o empresário consultou você, responsável pela assessoria jurídica, sobre a validade da penalidade aplicada. Assinale a afirmativa correta quanto à orientação a ser dada.", "o": ["A penalidade é válida e está inserida no poder diretivo e regulamentar do empregador, que possui autonomia para fixar o tempo de suspensão conforme a gravidade da falta.", "A suspensão é legítima, mas o empregador deve obrigatoriamente pagar os salários do período, sob pena de configurar alteração contratual lesiva.", "O empregador agiu corretamente ao evitar a justa causa, podendo suspender o contrato por até 90 dias antes de optar pela rescisão definitiva.", "A suspensão do empregado por mais de 30 dias consecutivos importa na rescisão injusta do contrato de trabalho, sendo a penalidade considerada ilegal."], "c": 3, "e": "Art. 474 da CLT: suspensão de mais de 30 dias consecutivos importa rescisão injusta do contrato."}]}, {"id": "ptrab", "nome": "Direito Processual do Trabalho", "lei": "CLT e Súmulas do TST", "peso": 5, "texto": "<p><strong>Homologação de acordo extrajudicial.</strong> Processo de jurisdição voluntária iniciado por <mark>petição conjunta</mark>, com as partes <mark>representadas por advogados distintos</mark> <span class=\"art\">arts. 855-B</span>. O juiz analisa o acordo em 15 dias, <mark>designa audiência se entender necessário</mark> e profere sentença <span class=\"art\">art. 855-D</span>. Ele pode recusar a homologação.</p>\n<p><strong>Competência.</strong> A Justiça do Trabalho julga as ações oriundas da relação de trabalho, inclusive <mark>dano moral ou patrimonial</mark> decorrente dela <span class=\"art\">CF, art. 114, I e VI</span>. Isso abrange assédio no trabalho e disputas sobre PLR.</p>\n<p><strong>Preparo do recurso ordinário.</strong> O empregador deve recolher <mark>custas e depósito recursal</mark>, de forma integral e no prazo do recurso <span class=\"art\">art. 789, §1º; art. 899</span>. Há redução do depósito pela metade para microempresas, entidades sem fins lucrativos e empregadores domésticos, e isenção para beneficiários da justiça gratuita e empresas em recuperação judicial <span class=\"art\">art. 899, §§9º e 10</span>. Sem preparo correto, o recurso é <mark>deserto</mark>.</p>\n<p><strong>Recurso adesivo.</strong> Compatível com o processo do trabalho <span class=\"art\">Súmula 283 TST</span>. Interpõe-se no <mark>prazo das contrarrazões</mark>, seguindo a sorte do recurso principal, e não precisa que a matéria esteja relacionada à do principal.</p>\n<p><strong>Ação de cumprimento.</strong> Se a sentença normativa não for cumprida, <mark>os empregados ou o sindicato</mark> podem ajuizar ação de cumprimento <span class=\"art\">art. 872, parágrafo único</span>. Não é exclusiva do sindicato.</p>", "qs": [{"id": "q76", "n": {"1": 76, "2": 77, "3": 78, "4": 79}, "p": "Após um longo período de negociação, o empregado Antônio e a sociedade empresária Construção Forte Ltda. chegaram a um acordo extrajudicial para pôr fim à relação de emprego e às controvérsias decorrentes, incluindo verbas rescisórias e indenizações. As partes, assistidas por seus respectivos advogados, desejam que esse acordo seja homologado pela Justiça do Trabalho para que tenha força de título executivo judicial e confira segurança jurídica plena. O advogado da sociedade empresária procurou seu escritório para saber qual a providência judicial que você considera necessária para a homologação. Quanto à sua orientação sobre o procedimento adequado para a homologação de acordo extrajudicial na Justiça do Trabalho, assinale a afirmativa correta.", "o": ["As partes devem apresentar, em conjunto, o acordo extrajudicial ao Juízo competente, que designará audiência se entender necessário e proferirá sentença.", "A homologação de acordo extrajudicial não é mais possível na Justiça do Trabalho, devendo as partes ajuizar uma reclamação trabalhista e buscar a conciliação em Juízo.", "As partes devem requerer a homologação por meio de petição conjunta ao Juízo competente, que analisará a validade e a conformidade do acordo com a lei, sem a previsão legal para a audiência.", "As partes podem requerer a homologação, mas o Juiz é obrigado a homologar o acordo, desde que as partes estejam assistidas por advogados distintos, não cabendo a ele analisar o mérito."], "c": 0, "e": "Arts. 855-B e 855-D da CLT: as partes apresentam petição conjunta; o juiz analisa o acordo, designa audiência se entender necessário e profere sentença."}, {"id": "q77", "n": {"1": 77, "2": 78, "3": 79, "4": 80}, "p": "Joana, ex-empregada da sociedade empresária de tecnologia Inovação Digital Ltda. ajuizou uma reclamação trabalhista pleiteando o pagamento de verbas rescisórias e indenização por danos morais decorrentes de assédio sexual sofrido no ambiente de trabalho. Além disso, Joana também pretende discutir a validade de um contrato de participação nos lucros e resultados (PLR) firmado com a sociedade empresária, alegando que as regras de distribuição foram alteradas unilateralmente e a prejudicaram. Joana consultou você, como advogado(a), para saber da competência da Justiça do Trabalho para julgar todos os pedidos. Quanto à orientação a ser dada, assinale a afirmativa correta.", "o": ["É competente apenas para julgar os pedidos de verbas rescisórias, sendo os demais pedidos de competência da Justiça Comum.", "É competente para julgar todos os pedidos formulados por Joana, uma vez que decorrem da relação de trabalho, inclusive a questão da PLR.", "É competente para julgar os pedidos de verbas rescisórias e danos morais, mas a questão da PLR deve ser discutida na Justiça Comum, pois se trata de direito societário.", "É competente para julgar a totalidade dos pedidos, mas a indenização por danos morais deve ser remetida à Justiça Comum, por não ter natureza exclusivamente trabalhista."], "c": 1, "e": "Art. 114, I e VI, da CF: a Justiça do Trabalho é competente para todos os pedidos, inclusive dano moral por assédio e PLR, pois decorrem da relação de trabalho."}, {"id": "q78", "n": {"1": 78, "2": 79, "3": 80, "4": 76}, "p": "A sociedade empresária Viação Cruzeiro Ltda. foi condenada em primeira instância ao pagamento de diversas verbas trabalhistas a um ex-empregado, totalizando o valor de R$ 80.000,00. A reclamada, inconformada com a decisão, deseja interpor Recurso Ordinário. A sociedade empresária, que não se encontra em situação de recuperação judicial, nem falência, nem é beneficiária da justiça gratuita, consultou você, como advogado(a), para conhecer as condições necessárias para o regular processamento do Recurso Ordinário, bem como as consequências se as condições não forem observadas. Quanto à orientação a ser dada, assinale a afirmativa correta.", "o": ["Ela deverá recolher apenas o valor das custas processuais, pois o depósito recursal só é exigível em fase de execução, após a liquidação da sentença.", "Ela está isenta do recolhimento do depósito recursal, pois o valor da condenação é inferior a 100 salários mínimos, devendo recolher apenas as custas processuais.", "Ela tem o direito de parcelar o valor do depósito recursal em até seis vezes, mediante comprovação de dificuldade financeira, mas o recolhimento das custas deve ser integral.", "Ela deverá efetuar o pagamento das custas processuais e do depósito recursal de forma integral, no prazo e nos valores corretos, sob pena de não conhecimento do recurso por deserção."], "c": 3, "e": "Arts. 789, §1º, e 899 da CLT: a empresa sem benefício de isenção deve recolher integralmente custas e depósito recursal no prazo, sob pena de deserção."}, {"id": "q79", "n": {"1": 79, "2": 80, "3": 76, "4": 77}, "p": "Paulo, empregado de uma microempresa, ajuizou reclamação trabalhista pleiteando o pagamento de horas extras e adicional de insalubridade. A sentença de primeira instância julgou parcialmente procedentes os pedidos, condenando a microempresa apenas ao pagamento das horas extras, mas indeferindo o adicional de insalubridade. A microempresa, inconformada com a condenação, interpôs Recurso Ordinário dentro do prazo legal. Paulo, embora insatisfeito com o indeferimento do adicional de insalubridade, não interpôs Recurso Ordinário no prazo. Após a notificação para contrarrazoar o recurso da microempresa, Paulo manifestou o desejo de também recorrer da decisão para pleitear o adicional de insalubridade. Você é consultado, como advogado(a) do reclamante, sobre a possibilidade de Paulo apresentar o recurso neste momento processual. Quanto à orientação a ser dada, assinale a afirmativa correta.", "o": ["Paulo poderá interpor Embargos de Declaração, pois ainda não houve o trânsito em julgado da decisão, e essa medida permitirá a rediscussão da matéria relativa ao adicional de insalubridade.", "Paulo poderá interpor Recurso de Revista, pois a decisão de primeiro grau já foi proferida e a microempresa já recorreu, o que garante a abertura da instância superior para a análise de todas as matérias controvertidas.", "Paulo poderá interpor Recurso Ordinário na modalidade adesiva, dentro do prazo das contrarrazões ao recurso principal da microempresa, pois o Recurso Adesivo segue a sorte do principal e permite a impugnação da parte da sentença que lhe foi desfavorável.", "Paulo não poderá mais recorrer, pois o prazo para interpor o Recurso Ordinário já se encerrou, operando-se a preclusão temporal para a sua manifestação de inconformismo com a sentença, podendo apenas se manifestar em contrarrazões sobre o recurso da microempresa."], "c": 2, "e": "Súmula 283 do TST: cabe recurso ordinário adesivo no prazo das contrarrazões, seguindo a sorte do recurso principal."}, {"id": "q80", "n": {"1": 80, "2": 76, "3": 77, "4": 78}, "p": "Após um Dissídio Coletivo de natureza econômica, foi proferida uma sentença normativa que estabeleceu novas condições de trabalho e reajustes salariais para os empregados da categoria profissional X na base territorial Y. A sociedade empresária Comércio Atacadista Brasileiro Ltda., que faz parte da categoria econômica abrangida pela sentença normativa, não cumpriu as novas condições e os reajustes salariais. Você é consultado, como advogado(a) de um empregado da sociedade empresária, sobre a medida judicial cabível para exigir o cumprimento das obrigações estabelecidas na sentença normativa. Quanto à orientação jurídica a ser dada, assinale a afirmativa correta.", "o": ["O empregado individualmente, ou o sindicato da categoria profissional, pode ajuizar Ação de Cumprimento na Justiça do Trabalho para exigir o cumprimento das obrigações decorrentes da sentença normativa, sendo que o empregado não necessita de assistência sindical para ajuizar a ação.", "Não é cabível nenhuma medida judicial, pois a sentença normativa tem caráter meramente declaratório e não impõe obrigações diretas de pagamento, dependendo de acordo extrajudicial para sua efetivação.", "O empregado deverá necessariamente ajuizar uma reclamação trabalhista individual para pleitear as diferenças salariais e as demais verbas, pois a sentença normativa não possui eficácia executória direta para cada trabalhador.", "O sindicato da categoria profissional X deverá ajuizar uma Ação de Cumprimento em nome de todos os empregados, sendo esta a única medida cabível para exigir o cumprimento da sentença normativa."], "c": 0, "e": "Art. 872, parágrafo único, da CLT: os empregados ou o sindicato podem ajuizar ação de cumprimento; o empregado não precisa de assistência sindical."}]}]}, {"id": "mapas1", "titulo": "Simulado Mapas OAB", "sub": "80 questões no estilo FGV · mapas mentais e pegadinhas", "tipo": "proprio", "fonte": "Material original com base na legislação e jurisprudência citadas. Questões no estilo da banca, não oficiais.", "disc": [{"id": "etica", "nome": "Ética Profissional", "lei": "Lei 8.906/94 (EAOAB), Regulamento Geral e Código de Ética", "peso": 8, "texto": "<p>É a matéria que mais vale na prova: são 8 questões, quase sempre cobrando <mark>letra da lei</mark>. Quem domina Ética entra na prova com 10% dos pontos garantidos.</p>\n<p>O raciocínio da FGV é sempre o mesmo: um caso concreto e uma pergunta sobre <strong>o que o Estatuto permite ou proíbe</strong>. Grave os números: <mark>15 dias</mark> (procuração na urgência e prazos na OAB), <mark>5 causas por ano</mark> (inscrição suplementar), <mark>5 anos</mark> (prescrição de honorários e da punição), <mark>30 dias a 12 meses</mark> (suspensão), <mark>3 suspensões e 2/3</mark> (exclusão).</p>\n<p>Duas distinções caem toda prova: <strong>incompatibilidade</strong> (proibição total) x <strong>impedimento</strong> (proibição parcial); e <strong>licença</strong> (afastamento temporário) x <strong>cancelamento</strong> (fim da inscrição).</p>", "mapa": ["Ética e Estatuto", [["Inscrição", ["Requisitos do art. 8º: capacidade civil, diploma, eleitor/militar, Exame, idoneidade, compromisso", "Não exige tempo de prática", "Principal: domicílio profissional", "Suplementar: mais de 5 causas/ano em outra UF (art. 10, §2º)", "Estrangeiro só advoga no Brasil inscrito na OAB"]], ["Licença x cancelamento", ["Licença: pedido justificado, doença mental curável, atividade incompatível temporária (art. 12)", "Cancelamento: pedido, exclusão, morte, incompatibilidade definitiva, perda de requisito (art. 11)", "Nova inscrição após cancelamento: prova dos incisos I, V, VI e VII do art. 8º, sem novo Exame; o número antigo não volta"]], ["Incompatível x impedido", ["Incompatível (art. 28): chefes do Executivo, Mesas do Legislativo, juízes, MP, policiais, militares ativos, fiscais de tributos", "Impedido (art. 30): servidor contra a Fazenda que o paga", "Impedido: parlamentar contra/a favor do poder público, qualquer esfera", "Docente de Direito não é impedido"]], ["Prerrogativas (art. 7º)", ["Inviolabilidade do escritório e comunicações", "Falar com cliente preso, mesmo sem procuração", "Examinar autos e inquérito, mesmo sem procuração", "Recusar-se a depor, mesmo com autorização do cliente", "Preso em flagrante só por crime inafiançável, com representante da OAB", "Não há hierarquia com juiz e MP (art. 6º)"]], ["Mandato e procuração", ["Urgência: atua sem procuração e junta em 15 dias, prorrogáveis por igual período (art. 5º, §1º)", "Renúncia: continua por 10 dias após notificar o cliente", "Substabelecimento sem reserva exige ciência do cliente"]], ["Honorários", ["Convencionados, arbitrados, sucumbência (art. 22)", "Sucumbência é do advogado (art. 23)", "Contrato escrito é título executivo (art. 24)", "Cobrança prescreve em 5 anos (art. 25)", "Advogado empregado: a sucumbência também é dele (art. 21)"]], ["Sociedade de advogados", ["Registro só na OAB, nunca na Junta", "Sociedade individual existe", "Responsabilidade subsidiária e ilimitada pelos danos ao cliente (art. 17)", "Advogado não pode integrar mais de uma sociedade na mesma seccional"]], ["Infrações e sanções", ["Censura, suspensão, exclusão, multa (art. 35)", "Censura não é publicada", "Suspensão: 30 dias a 12 meses; inadimplência: até pagar", "Exclusão: 3 suspensões, votos de 2/3", "Processo sigiloso até o fim (art. 72, §2º)", "Prazos na OAB: 15 dias (art. 69)", "Prescrição da punição: 5 anos"]]]], "peg": ["A FGV troca 'impedimento' por 'incompatibilidade' nas alternativas: confira se a proibição é total ou parcial.", "'Mesmo com autorização do cliente' é a expressão que torna correta a recusa a depor.", "Censura 'pública' está errada: a censura não pode ser divulgada.", "Seis causas em dois estados diferentes (2 + 4) não geram inscrição suplementar: conta-se por estado."], "qs": [{"id": "etica-0", "p": "Mariana, advogada inscrita em São Paulo, foi eleita vereadora e não integra a Mesa da Câmara Municipal. Sobre o exercício da advocacia, segundo o EAOAB:", "o": ["Ela deve pedir o cancelamento da inscrição, por incompatibilidade.", "Ela está impedida de advogar contra ou a favor de pessoas jurídicas de direito público e entidades a elas vinculadas.", "Ela deve pedir licença, enquanto durar o mandato.", "Ela pode advogar sem qualquer restrição, pois vereador não exerce cargo do Executivo."], "c": 1, "e": "Art. 30, II, do EAOAB: membros do Legislativo que não integram as Mesas são apenas impedidos em relação ao poder público. Só os membros das Mesas são incompatíveis (art. 28, I)."}, {"id": "etica-1", "p": "Um advogado recebeu a pena de suspensão pela terceira vez. Para que lhe seja aplicada a pena de exclusão, é necessária:", "o": ["Manifestação favorável de 2/3 dos membros do Conselho Seccional competente.", "Sentença judicial transitada em julgado.", "Decisão unânime do Tribunal de Ética e Disciplina.", "Manifestação favorável da maioria simples do Conselho Federal."], "c": 0, "e": "Art. 38, I e parágrafo único, do EAOAB: a exclusão por três suspensões exige manifestação favorável de 2/3 dos membros do Conselho Seccional."}, {"id": "etica-2", "p": "Paulo, advogado, renunciou ao mandato que lhe foi outorgado por um cliente e o notificou. Segundo o EAOAB, Paulo:", "o": ["Só pode renunciar com autorização do juiz da causa.", "Deve continuar representando o cliente por 30 dias.", "Deve continuar representando o cliente durante os 10 dias seguintes à notificação, salvo se for substituído antes.", "Fica desobrigado imediatamente de qualquer ato no processo."], "c": 2, "e": "Art. 5º, §3º, do EAOAB: o advogado que renuncia continua, durante os 10 dias seguintes à notificação, a representar o mandante, salvo se for substituído antes."}, {"id": "etica-3", "p": "Pedro, advogado, precisa ajuizar com urgência um mandado de segurança para um cliente que está internado e não consegue assinar a procuração. Segundo o EAOAB, Pedro:", "o": ["Não pode atuar sem procuração em nenhuma hipótese.", "Pode atuar e apresentar a procuração em 30 dias, improrrogáveis.", "Pode atuar, afirmando urgência, e deve apresentar a procuração em 15 dias, prorrogáveis por igual período.", "Pode atuar por tempo indeterminado, enquanto durar a internação."], "c": 2, "e": "Art. 5º, §1º, do EAOAB: afirmando urgência, o advogado pode atuar sem procuração, obrigando-se a apresentá-la no prazo de 15 dias, prorrogável por igual período."}, {"id": "etica-4", "p": "Um jornalista pediu ao Conselho Seccional acesso aos autos de processo disciplinar em curso contra um advogado conhecido. O pedido deve ser:", "o": ["Deferido apenas quanto à decisão final, se houver condenação à censura.", "Indeferido, pois o processo disciplinar tramita em sigilo até o término, com acesso só das partes, defensores e autoridade judiciária competente.", "Deferido, pelo princípio da publicidade.", "Deferido, se o advogado processado concordar."], "c": 1, "e": "Art. 72, §2º, do EAOAB: o processo disciplinar tramita em sigilo até o seu término. E a censura, mesmo aplicada, não é objeto de publicidade (art. 35, parágrafo único)."}, {"id": "etica-5", "p": "Lúcia, advogada inscrita no Paraná, patrocinou no mesmo ano sete causas em Santa Catarina. Segundo o EAOAB:", "o": ["Só precisaria de inscrição suplementar a partir de dez causas por ano.", "Deve transferir sua inscrição principal para Santa Catarina.", "Não precisa de nenhuma providência, pois a inscrição vale em todo o país.", "Deve promover inscrição suplementar no Conselho Seccional de Santa Catarina."], "c": 3, "e": "Art. 10, §2º, do EAOAB: considera-se habitual a intervenção judicial que exceder cinco causas por ano em outra unidade federativa, exigindo inscrição suplementar."}, {"id": "etica-6", "p": "Um advogado prestou serviços com contrato escrito de honorários e não foi pago. O prazo para ajuizar a ação de cobrança é de:", "o": ["1 ano.", "10 anos.", "5 anos.", "3 anos."], "c": 2, "e": "Art. 25 do EAOAB: prescreve em cinco anos a ação de cobrança de honorários de advogado. O contrato escrito, aliás, é título executivo (art. 24)."}, {"id": "etica-7", "p": "Durante uma diligência profissional, um advogado foi acusado da prática de crime afiançável. Segundo o EAOAB, no exercício da profissão:", "o": ["Ele só pode ser preso por ordem do Conselho Federal da OAB.", "Ele nunca pode ser preso em flagrante.", "Ele pode ser preso em flagrante por qualquer crime.", "Ele só pode ser preso em flagrante por crime inafiançável, assegurada a presença de representante da OAB."], "c": 3, "e": "Art. 7º, §3º, do EAOAB: o advogado somente poderá ser preso em flagrante, por motivo de exercício da profissão, em caso de crime inafiançável, com a presença de representante da OAB."}]}, {"id": "const", "nome": "Direito Constitucional", "lei": "CF/88", "peso": 6, "texto": "<p>A FGV cobra Constitucional em três frentes: <strong>controle de constitucionalidade</strong>, <strong>processo legislativo</strong> e <strong>organização do Estado</strong> (competências e intervenção). Direitos fundamentais aparecem misturados com casos práticos.</p>\n<p>A chave do controle é saber <mark>quem pode propor ADI</mark> (art. 103) e distinguir os <strong>legitimados universais</strong> (não precisam provar pertinência temática) dos <strong>especiais</strong> (precisam).</p>\n<p>No processo legislativo, grave as <mark>iniciativas privativas</mark> (Presidente, tribunais) e as <mark>vedações à medida provisória</mark>. Qualquer lei com vício de iniciativa é formalmente inconstitucional, e a sanção do chefe do Executivo não corrige o vício.</p>", "mapa": ["Constitucional", [["Controle de constitucionalidade", ["ADI, ADC, ADPF e ADO no STF", "Legitimados do art. 103", "Universais: Presidente, Mesas do Senado e Câmara, PGR, Conselho Federal da OAB, partido com representação no Congresso", "Especiais (pertinência temática): Governador, Mesa de Assembleia, confederação sindical, entidade de classe nacional", "Recepção: só compatibilidade material com a nova CF", "Lei anterior incompatível: não recepcionada (não cabe ADI, cabe ADPF)"]], ["Processo legislativo", ["Iniciativa privativa do Presidente (art. 61, §1º)", "Iniciativa dos tribunais: criação de varas e cargos (art. 96)", "Sanção não convalida vício de iniciativa", "Lei complementar: maioria absoluta", "Emenda: 3/5, dois turnos, cada Casa"]], ["Medida provisória", ["Relevância e urgência", "Vigência de 60 + 60 dias", "Proibida: direito eleitoral, partidos, direitos políticos, penal, processo, organização do Judiciário e MP, matéria de lei complementar (art. 62, §1º)", "Rejeitada: não pode ser reeditada na mesma sessão legislativa"]], ["Competências", ["Privativa da União (art. 22): civil, penal, processo, trabalho, desapropriação, trânsito", "Concorrente (art. 24): tributário, financeiro, ambiente, consumidor, educação", "Municípios: interesse local (art. 30)", "Comum (art. 23): proteger o ambiente, saúde, patrimônio"]], ["Intervenção", ["União nos Estados (art. 34) e Estados nos Municípios (art. 35)", "Não aplicar mínimo em saúde e educação: decreto direto", "Prover execução de lei ou decisão: depende do Tribunal", "Decreto submetido ao Legislativo em 24 horas, salvo quando depende do Judiciário"]], ["Nacionalidade e direitos políticos", ["Nato nunca é extraditado", "Naturalizado: crime comum antes da naturalização ou tráfico de drogas", "Cargos privativos de nato: Presidente, Vice, presidentes da Câmara e do Senado, Ministro do STF, carreira diplomática, oficial das Forças Armadas, Ministro da Defesa", "Inelegibilidades novas: só por lei complementar (art. 14, §9º)"]], ["Remédios constitucionais", ["Habeas corpus: liberdade de locomoção, gratuito", "Habeas data: informações pessoais, gratuito", "Mandado de segurança: direito líquido e certo, 120 dias", "Mandado de injunção: falta de norma regulamentadora", "Ação popular: qualquer cidadão, sem custas salvo má-fé"]]]], "peg": ["'A sanção do Governador supre o vício de iniciativa' é sempre falso.", "Governador precisa demonstrar pertinência temática para propor ADI; o Conselho Federal da OAB não.", "Medida provisória não pode tratar de matéria reservada a lei complementar, nem ser reeditada na mesma sessão legislativa em que foi rejeitada.", "Ação popular é de cidadão (eleitor); pessoa jurídica não propõe."], "qs": [{"id": "const-0", "p": "O Governador do Estado Alfa pretende propor ADI no STF contra lei federal que, a seu ver, prejudica a arrecadação estadual. Sobre sua legitimidade:", "o": ["É legitimado universal e não precisa demonstrar qualquer vínculo com o objeto.", "É legitimado especial e deve demonstrar pertinência temática entre a lei e os interesses do Estado.", "Não tem legitimidade para impugnar lei federal, apenas lei estadual.", "Só pode propor a ação com autorização da Assembleia Legislativa."], "c": 1, "e": "Art. 103, V, da CF e jurisprudência do STF: o Governador é legitimado especial e deve demonstrar pertinência temática. Pode impugnar lei federal ou de outro Estado que afete seu Estado."}, {"id": "const-1", "p": "Lei estadual de iniciativa parlamentar criou cargos na estrutura de órgão do Poder Executivo estadual. O Governador sancionou o projeto. Essa lei é:", "o": ["Formalmente inconstitucional, porque a iniciativa era privativa do Governador e a sanção não convalida o vício.", "Válida, porque a sanção supriu o vício de iniciativa.", "Materialmente inconstitucional, porque cargos só podem ser criados por decreto.", "Válida, porque a Assembleia tem iniciativa concorrente para criar cargos no Executivo."], "c": 0, "e": "Aplica-se por simetria o art. 61, §1º, II, a, da CF. O STF entende que a sanção não convalida o vício de iniciativa (a antiga Súmula 5 do STF foi superada)."}, {"id": "const-2", "p": "Um brasileiro naturalizado poderá ocupar o cargo de:", "o": ["Presidente da Câmara dos Deputados.", "Ministro do Supremo Tribunal Federal.", "Ministro de Estado da Fazenda.", "Oficial das Forças Armadas."], "c": 2, "e": "Art. 12, §3º, da CF: são privativos de brasileiro nato Presidente e Vice, presidentes da Câmara e do Senado, Ministro do STF, carreira diplomática, oficial das Forças Armadas e Ministro da Defesa. Ministro da Fazenda não está na lista."}, {"id": "const-3", "p": "A autoridade administrativa negou a Ana um direito líquido e certo, comprovado por documentos. Ela tomou ciência do ato há 100 dias. Ana:", "o": ["Ainda pode impetrar mandado de segurança, pois o prazo é de 120 dias da ciência do ato.", "Deve impetrar habeas data.", "Só pode ajuizar ação popular.", "Não pode mais impetrar mandado de segurança, pois o prazo é de 90 dias."], "c": 0, "e": "Art. 23 da Lei 12.016/09: o direito de requerer mandado de segurança extingue-se após 120 dias contados da ciência do ato impugnado."}, {"id": "const-4", "p": "O Município Alfa deixou de aplicar o mínimo exigido da receita municipal em ações e serviços públicos de saúde. Segundo a CF, o Estado:", "o": ["Não pode intervir no Município em nenhuma hipótese.", "Só pode intervir após representação do PGJ julgada pelo Tribunal de Justiça.", "Só pode intervir com autorização prévia do Presidente da República.", "Pode decretar a intervenção, por ato do Governador, sem depender de provimento judicial."], "c": 3, "e": "Art. 35, III, da CF: o Estado pode intervir quando não for aplicado o mínimo exigido em saúde e educação. A dependência do TJ ocorre na hipótese do inciso IV."}, {"id": "const-5", "p": "Uma lei estadual criou novas hipóteses de estabilidade no emprego para trabalhadores da iniciativa privada no Estado. A lei é:", "o": ["Constitucional, pois a matéria é de competência concorrente.", "Inconstitucional, pois legislar sobre direito do trabalho é competência privativa da União.", "Inconstitucional, pois a matéria é reservada aos Municípios.", "Constitucional, se beneficiar o trabalhador."], "c": 1, "e": "Art. 22, I, da CF: compete privativamente à União legislar sobre direito do trabalho. Lei complementar poderia autorizar os Estados a legislar sobre questões específicas (parágrafo único), o que não houve."}]}, {"id": "civil", "nome": "Direito Civil", "lei": "Código Civil (Lei 10.406/02)", "peso": 6, "texto": "<p>Civil é uma matéria enorme, mas a prova se concentra em poucos blocos: <strong>parte geral</strong> (capacidade, prescrição, negócio jurídico), <strong>obrigações e contratos</strong>, <strong>responsabilidade civil</strong>, <strong>direitos reais</strong> e <strong>família e sucessões</strong>.</p>\n<p>Em responsabilidade civil, separe a regra (<mark>subjetiva, depende de culpa</mark>, art. 186 e 927) das exceções <mark>objetivas</mark>: atividade de risco, fato de terceiro pelo qual se responde (pais, empregador, art. 932 e 933), animais, coisas caídas de prédio.</p>\n<p>Em família, os temas favoritos são regime de bens, alimentos (inclusive dos avós) e filiação socioafetiva. Em sucessões, a ordem de vocação hereditária (art. 1.829) e a concorrência do cônjuge com descendentes conforme o regime.</p>", "mapa": ["Direito Civil", [["Parte geral", ["Absolutamente incapaz: só o menor de 16 anos (art. 3º)", "Relativamente: 16 a 18, ébrios habituais, viciados, quem não pode exprimir vontade, pródigos (art. 4º)", "Prescrição atinge pretensão; decadência atinge direito", "Prescrição geral: 10 anos; reparação civil: 3 anos (art. 206, §3º, V)", "Defeitos: erro, dolo, coação, estado de perigo, lesão, fraude contra credores (anuláveis)", "Simulação: nulo"]], ["Obrigações e contratos", ["Adimplemento substancial: impede resolução por pequeno inadimplemento", "Exceção do contrato não cumprido", "Vício redibitório: 30 dias móvel, 1 ano imóvel", "Evicção: alienante responde", "Função social e boa-fé objetiva (arts. 421 e 422)"]], ["Responsabilidade civil", ["Regra: subjetiva (arts. 186 e 927)", "Objetiva: atividade de risco (art. 927, parágrafo único)", "Pais, tutores, empregador respondem objetivamente pelos atos de filhos e empregados (arts. 932 e 933)", "Coisas lançadas de prédio: habitante responde (art. 938)", "Uso indevido de imagem: dano presumido (Súmula 403 STJ)"]], ["Direitos reais", ["Usucapião extraordinária: 15 anos, ou 10 com moradia ou obras", "Ordinária: 10 anos com justo título e boa-fé; 5 se comprado com registro depois cancelado e com moradia ou investimento", "Especial urbana: 250 m², 5 anos, moradia, sem outro imóvel", "Especial rural: até 50 ha, 5 anos, produtiva", "Familiar: 2 anos, ex-cônjuge que abandonou o lar", "Desapropriação judicial privada: art. 1.228, §§4º e 5º"]], ["Família", ["Regime legal: comunhão parcial", "Separação obrigatória: maior de 70 anos (pode ser afastada por pacto, STF Tema 1.236)", "Alimentos avoengos: subsidiários e complementares (Súmula 596 STJ)", "Multiparentalidade: socioafetivo e biológico coexistem (STF Tema 622)", "União estável: mesmos direitos sucessórios do casamento (STF)"]], ["Sucessões", ["Ordem (art. 1.829): descendentes com cônjuge; ascendentes com cônjuge; cônjuge; colaterais até 4º grau", "Cônjuge concorre com descendentes conforme o regime", "Herdeiros necessários: descendentes, ascendentes, cônjuge", "Legítima: metade da herança", "Testamento: público, cerrado, particular"]]]], "peg": ["Maior de 16 e menor de 18 é relativamente incapaz, não absolutamente.", "Deficiência, por si só, não gera incapacidade (Estatuto da Pessoa com Deficiência).", "Empregador responde objetivamente pelo ato do empregado, mas o empregado precisa ter agido com culpa.", "Usucapião familiar exige abandono do lar e prazo de só 2 anos."], "qs": [{"id": "civil-0", "p": "Lucas, com 17 anos, celebrou contrato de compra e venda de um notebook sem assistência de seus pais. Segundo o Código Civil, o contrato é:", "o": ["Válido, porque Lucas já completou 16 anos.", "Inexistente, por falta de manifestação de vontade.", "Nulo, por ser Lucas absolutamente incapaz.", "Anulável, por ser Lucas relativamente incapaz."], "c": 3, "e": "Art. 4º, I, e art. 171, I, do CC: o maior de 16 e menor de 18 anos é relativamente incapaz; o ato praticado sem assistência é anulável."}, {"id": "civil-1", "p": "Ana sofreu danos em acidente de trânsito causado culposamente por Bruno. Ela quer ajuizar ação de reparação civil. O prazo prescricional é de:", "o": ["10 anos.", "5 anos.", "3 anos.", "1 ano."], "c": 2, "e": "Art. 206, §3º, V, do CC: prescreve em 3 anos a pretensão de reparação civil."}, {"id": "civil-2", "p": "Carlos e Diana são casados sob o regime da comunhão parcial. Carlos morreu e deixou dois filhos comuns do casal. Ele tinha bens particulares (recebidos de herança do pai). Sobre a sucessão:", "o": ["Diana não herda nada, pois é meeira.", "Diana só herda se não houver descendentes.", "Diana herda sozinha todos os bens, por ser cônjuge.", "Diana concorre com os filhos na herança dos bens particulares de Carlos."], "c": 3, "e": "Art. 1.829, I, do CC: na comunhão parcial, o cônjuge concorre com os descendentes quanto aos bens particulares do falecido. Nos bens comuns, já é meeira."}, {"id": "civil-3", "p": "Rosa ocupa, há 6 anos, sem oposição e como sua moradia, um terreno urbano de 200 m². Ela não é dona de outro imóvel. Rosa pode pedir:", "o": ["Usucapião familiar.", "Usucapião extraordinária, pois já cumpriu 15 anos.", "Usucapião especial urbana, pois preenche área, prazo, moradia e ausência de outro imóvel.", "Nenhuma usucapião, pois precisa de justo título."], "c": 2, "e": "Art. 183 da CF e art. 1.240 do CC: área urbana de até 250 m², posse de 5 anos ininterrupta e sem oposição, para moradia, sem ser proprietário de outro imóvel."}, {"id": "civil-4", "p": "O motorista de uma transportadora, em serviço, causou um acidente por imprudência. A vítima quer ser indenizada pela empresa. Segundo o Código Civil, a empresa:", "o": ["Responde objetivamente pelo ato culposo do empregado no exercício do trabalho.", "Responde apenas subsidiariamente, após a execução contra o motorista.", "Só responde se a vítima provar culpa na escolha do motorista.", "Não responde, pois o ato foi do empregado."], "c": 0, "e": "Arts. 932, III, e 933 do CC: o empregador responde, independentemente de culpa sua, pelos atos dos empregados no exercício do trabalho."}, {"id": "civil-5", "p": "O pai de Bruno, de 10 anos, paga pensão, mas o valor não basta para as necessidades da criança e ele não tem como pagar mais. A mãe quer pedir complementação aos avós paternos. Segundo o STJ:", "o": ["É impossível, pois a obrigação é exclusiva dos pais.", "Os avós devem pagar integralmente, substituindo o pai.", "Só é possível se o pai for preso.", "É possível, pois a obrigação dos avós é subsidiária e complementar."], "c": 3, "e": "Arts. 1.696 e 1.698 do CC e Súmula 596 do STJ: a obrigação dos avós é complementar e subsidiária, quando os pais não podem prover os alimentos, total ou parcialmente."}]}, {"id": "pc", "nome": "Processo Civil", "lei": "CPC/2015 (Lei 13.105/15)", "peso": 6, "texto": "<p>A FGV gosta de Processo Civil prático: <strong>qual recurso cabe</strong>, <strong>qual o prazo</strong>, <strong>qual peça usar</strong>. Comece pelos prazos: no CPC, <mark>todos os recursos têm 15 dias úteis</mark>, exceto os <mark>embargos de declaração, com 5 dias</mark>.</p>\n<p>O agravo de instrumento só cabe nas hipóteses do <mark>art. 1.015</mark> (lista taxativa, mitigada pelo STJ quando há urgência). O que não for agravável é discutido na apelação.</p>\n<p>Na tutela provisória, separe <strong>urgência</strong> (probabilidade do direito + perigo de dano) de <strong>evidência</strong> (não exige perigo). E lembre os procedimentos especiais mais cobrados: possessórias, monitória, consignação.</p>", "mapa": ["Processo Civil", [["Prazos", ["Contados em dias úteis (art. 219)", "Recursos: 15 dias", "Embargos de declaração: 5 dias", "Fazenda, MP e Defensoria: prazo em dobro", "Litisconsortes com advogados de escritórios diferentes, autos físicos: dobro"]], ["Recursos", ["Apelação: contra sentença", "Agravo de instrumento: hipóteses do art. 1.015", "Agravo interno: contra decisão do relator", "Embargos de declaração: omissão, contradição, obscuridade, erro material", "Recurso especial (STJ) e extraordinário (STF)", "Recurso só sobre honorários: exige preparo (art. 99, §5º)"]], ["Tutela provisória", ["Urgência: probabilidade + perigo (art. 300)", "Antecedente: estabiliza se não houver recurso (art. 304)", "Evidência: abuso de defesa, tese repetitiva, depósito, prova documental (art. 311)"]], ["Petição inicial e resposta", ["Indeferimento: apelação com retratação em 5 dias (art. 331)", "Improcedência liminar: retratação em 5 dias (art. 332)", "Contestação: 15 dias", "Reconvenção na própria contestação", "Revelia: presume verdadeiros os fatos"]], ["Procedimentos especiais", ["Possessória de força nova (menos de ano e dia): liminar com prova da posse, esbulho e data", "Monitória: prova escrita sem eficácia de título", "Consignação: recusa do credor", "Embargos de terceiro: quem não é parte e sofre constrição"]], ["Execução e cumprimento", ["Cumprimento: 15 dias para pagar, senão multa de 10% e honorários de 10% (art. 523)", "Impugnação: 15 dias após o prazo de pagamento", "Embargos à execução: 15 dias da juntada do mandado", "Parcelamento (30% + 6 vezes): só na execução de título extrajudicial", "Liquidação por cálculo: dispensa liquidação formal"]]]], "peg": ["Prazo em dias corridos é erro: o CPC conta em dias úteis.", "O parcelamento do art. 916 não vale no cumprimento de sentença.", "Agravo contra decisão que nega tutela provisória: cabe (art. 1.015, I).", "Retratação em 5 dias na apelação contra indeferimento da inicial, não 10."], "qs": [{"id": "pc-0", "p": "O juiz, em decisão interlocutória, indeferiu pedido de tutela provisória de urgência formulado pelo autor. O recurso cabível é:", "o": ["Nenhum, devendo a matéria ser alegada em preliminar de apelação.", "Agravo de instrumento, no prazo de 15 dias.", "Apelação, no prazo de 15 dias.", "Agravo interno, no prazo de 5 dias."], "c": 1, "e": "Art. 1.015, I, do CPC: cabe agravo de instrumento contra decisão que versa sobre tutelas provisórias. Prazo de 15 dias úteis."}, {"id": "pc-1", "p": "Intimado para cumprir sentença que o condenou a pagar R$ 20.000,00, o devedor não pagou no prazo legal. Segundo o CPC:", "o": ["Incidem multa de 10% e honorários advocatícios de 10%.", "Não há acréscimo, apenas penhora.", "Incidem multa de 10% e juros de 2% ao mês.", "Incide apenas multa de 20%."], "c": 0, "e": "Art. 523, §1º, do CPC: não paga a dívida em 15 dias, o débito é acrescido de multa de 10% e de honorários de 10%."}, {"id": "pc-2", "p": "A sentença foi omissa quanto a um dos pedidos do autor. Para corrigir a omissão, o advogado deve opor, no prazo de:", "o": ["Embargos de declaração, 15 dias.", "Apelação, 5 dias.", "Embargos de declaração, 5 dias.", "Embargos infringentes, 15 dias."], "c": 2, "e": "Arts. 1.022 e 1.023 do CPC: embargos de declaração contra omissão, no prazo de 5 dias. O CPC/2015 extinguiu os embargos infringentes."}, {"id": "pc-3", "p": "José foi esbulhado de seu imóvel há 3 meses e quer a reintegração liminar. Segundo o CPC, ele deve provar:", "o": ["A posse e o perigo de dano irreparável.", "Apenas a propriedade do imóvel.", "O justo título e a má-fé do invasor.", "A posse, o esbulho, a data do esbulho e a perda da posse."], "c": 3, "e": "Arts. 558, 561 e 562 do CPC: na ação de força nova (menos de ano e dia), a liminar depende da prova da posse, do esbulho, de sua data e da perda da posse. Não se exige perigo de dano."}, {"id": "pc-4", "p": "Na fase de cumprimento de sentença, o devedor depositou 30% do valor e pediu para pagar o restante em seis parcelas mensais. O pedido:", "o": ["Só pode ser deferido se o credor for a Fazenda Pública.", "Depende apenas da concordância do juiz, a seu critério.", "Não se aplica ao cumprimento de sentença, só à execução de título extrajudicial.", "Deve ser deferido, pois é direito do executado."], "c": 2, "e": "Art. 916, §7º, do CPC: o parcelamento previsto no art. 916 não se aplica ao cumprimento de sentença."}, {"id": "pc-5", "p": "O Município foi citado em ação pelo procedimento comum. O prazo para contestar é de:", "o": ["15 dias corridos.", "30 dias úteis.", "15 dias úteis.", "60 dias úteis."], "c": 1, "e": "Arts. 183 e 335 do CPC: a Fazenda Pública tem prazo em dobro para todas as manifestações. Os 15 dias da contestação viram 30, contados em dias úteis (art. 219)."}]}, {"id": "penal", "nome": "Direito Penal", "lei": "Código Penal (Decreto-Lei 2.848/40)", "peso": 6, "texto": "<p>A prova de Penal mistura <strong>parte geral</strong> (teoria do crime, tentativa, concurso de pessoas, penas) com <strong>crimes em espécie</strong> (patrimônio, honra, contra a Administração).</p>\n<p>A sequência que resolve quase toda questão é: o fato é <mark>típico</mark>? É <mark>ilícito</mark> (há excludente)? O agente é <mark>culpável</mark>? E, por fim, é <mark>punível</mark>? Escusas absolutórias (como furto contra o filho) não tiram o crime, só a pena.</p>\n<p>Compare sempre os institutos parecidos: <strong>desistência voluntária</strong> e <strong>arrependimento eficaz</strong> (o crime não se consuma, responde só pelos atos já praticados) x <strong>arrependimento posterior</strong> (crime consumado sem violência, repara o dano até o recebimento da denúncia e ganha redução de 1/3 a 2/3).</p>", "mapa": ["Direito Penal", [["Teoria do crime", ["Fato típico: conduta, resultado, nexo, tipicidade", "Ilicitude excluída: legítima defesa, estado de necessidade, estrito cumprimento do dever, exercício regular de direito (art. 23)", "Culpabilidade: imputabilidade, potencial consciência da ilicitude, exigibilidade de conduta diversa", "Insignificância: exclui a tipicidade material"]], ["Iter criminis", ["Tentativa: pena reduzida de 1/3 a 2/3 (art. 14)", "Desistência voluntária e arrependimento eficaz: responde pelos atos praticados (art. 15)", "Arrependimento posterior: sem violência, repara até o recebimento da denúncia, reduz 1/3 a 2/3 (art. 16)", "Crime impossível: impunível (art. 17)"]], ["Concurso de pessoas", ["Teoria monista: todos respondem pelo mesmo crime (art. 29)", "Participação de menor importância: reduz 1/6 a 1/3", "Circunstâncias pessoais não se comunicam, salvo elementares (art. 30)", "Elementar 'funcionário público' se comunica no peculato a quem sabe"]], ["Penas", ["Substituição por restritiva: até 4 anos, sem violência ou grave ameaça, ou crime culposo (art. 44)", "Pena até 1 ano: multa ou uma restritiva", "Mais de 1 ano: uma restritiva e multa, ou duas restritivas", "Regime inicial: mais de 8 fechado; 4 a 8 semiaberto; até 4 aberto (não reincidente)", "Medida de segurança: limite da pena máxima em abstrato (Súmula 527 STJ)"]], ["Crimes contra o patrimônio", ["Furto qualificado: rompimento de obstáculo, abuso de confiança, escalada, chave falsa, concurso de pessoas", "Roubo: violência ou grave ameaça", "Escusa absoluta: contra cônjuge, ascendente, descendente (art. 181)", "Não vale: violência, vítima com 60 anos ou mais, estranho que participa (art. 183)"]], ["Crimes contra a honra", ["Calúnia: imputar falsamente crime", "Difamação: imputar fato ofensivo", "Injúria: ofender sem imputar fato", "Exceção da verdade: cabe na calúnia; na difamação, só contra funcionário público no exercício da função"]], ["Crimes contra a Administração", ["Peculato: apropriar ou desviar (art. 312)", "Peculato culposo: reparar antes da sentença irrecorrível extingue a punibilidade; depois, reduz metade", "Concussão: exigir; corrupção passiva: solicitar ou receber", "Prevaricação: interesse ou sentimento pessoal"]]]], "peg": ["Arrependimento posterior exige reparação até o recebimento da denúncia, não até a sentença.", "A extinção da punibilidade pela reparação vale só no peculato culposo.", "Furto contra o pai de 60 anos ou mais não tem escusa absolutória.", "Concussão é 'exigir'; corrupção passiva é 'solicitar' ou 'receber'."], "qs": [{"id": "penal-0", "p": "Rafael iniciou a execução de um furto, mas, por vontade própria, desistiu de prosseguir antes de subtrair qualquer bem. Ao entrar na casa, já havia quebrado uma janela. Rafael:", "o": ["Não responde por nenhum crime.", "Responde por tentativa de furto.", "Responde por furto qualificado consumado.", "Responde apenas pelos atos já praticados, como o dano à janela."], "c": 3, "e": "Art. 15 do CP: na desistência voluntária, o agente só responde pelos atos já praticados. Aqui, pelo dano à janela."}, {"id": "penal-1", "p": "Funcionária pública, por descuido, deixou aberto o cofre da repartição, e um terceiro subtraiu valores. Antes da sentença irrecorrível, ela reparou integralmente o dano. A consequência é:", "o": ["Extinção da punibilidade.", "Redução da pena pela metade.", "Redução de 1/3 a 2/3, por arrependimento posterior.", "Nenhuma, pois o crime já se consumou."], "c": 0, "e": "Art. 312, §§2º e 3º, do CP: no peculato culposo, a reparação do dano antes da sentença irrecorrível extingue a punibilidade; se posterior, reduz a pena pela metade."}, {"id": "penal-2", "p": "Em discussão de trânsito, Marcos chamou Tiago de 'ladrão safado', sem lhe atribuir qualquer fato concreto. Marcos praticou:", "o": ["Calúnia.", "Injúria.", "Fato atípico.", "Difamação."], "c": 1, "e": "Art. 140 do CP: ofender a dignidade com xingamento, sem imputar fato determinado, é injúria. Calúnia exige imputação de fato concreto definido como crime."}, {"id": "penal-3", "p": "Gustavo, de 30 anos, furtou, sem violência, R$ 5.000,00 de seu pai, de 65 anos. Segundo o Código Penal:", "o": ["Gustavo responde pelo furto, pois a escusa absolutória não se aplica quando a vítima tem 60 anos ou mais.", "A ação penal depende de representação do pai.", "Gustavo é isento de pena, por ser filho da vítima.", "O fato é atípico."], "c": 0, "e": "Art. 183, III, do CP: a imunidade do art. 181 não se aplica se o crime é praticado contra pessoa com idade igual ou superior a 60 anos."}, {"id": "penal-4", "p": "Lia foi condenada a 10 meses de detenção por crime sem violência. É primária. O juiz pode substituir a pena privativa por:", "o": ["Nenhuma pena, pois a substituição exige pena superior a 1 ano.", "Multa ou uma pena restritiva de direitos.", "Duas penas restritivas de direitos.", "Uma restritiva de direitos e multa, obrigatoriamente."], "c": 1, "e": "Art. 44, §2º, do CP: na condenação igual ou inferior a um ano, a substituição pode ser feita por multa ou por uma pena restritiva de direitos."}, {"id": "penal-5", "p": "Um fiscal municipal exigiu de um comerciante R$ 2.000,00 para não lavrar uma autuação. O fiscal praticou:", "o": ["Peculato.", "Concussão.", "Corrupção passiva.", "Prevaricação."], "c": 1, "e": "Art. 316 do CP: exigir, para si ou para outrem, vantagem indevida em razão da função é concussão. Corrupção passiva é solicitar ou receber (art. 317)."}]}, {"id": "ppen", "nome": "Processo Penal", "lei": "CPP (Decreto-Lei 3.689/41) e Lei 9.099/95", "peso": 6, "texto": "<p>Processo Penal na OAB gira em torno de quatro perguntas: <strong>quem pode propor a ação</strong>, <strong>qual juízo é competente</strong>, <strong>qual prisão ou cautelar cabe</strong> e <strong>qual recurso usar</strong>.</p>\n<p>Para os acordos, compare as penas: <mark>transação penal</mark> para infração de menor potencial ofensivo (pena máxima até 2 anos), <mark>suspensão condicional do processo</mark> com pena mínima até 1 ano, e <mark>ANPP</mark> com pena mínima inferior a 4 anos, sem violência e com confissão.</p>\n<p>Nos recursos, grave o <strong>RESE</strong> (lista do art. 581, prazo de 5 dias), a <strong>apelação</strong> (5 dias para interpor, 8 para razões) e os <strong>embargos infringentes</strong> (só da defesa, decisão não unânime, 10 dias).</p>", "mapa": ["Processo Penal", [["Ação penal", ["Pública incondicionada: regra", "Condicionada: depende de representação (6 meses)", "Privada: queixa em 6 meses do conhecimento da autoria", "Privada subsidiária: só com inércia do MP", "Perdão do ofendido precisa ser aceito; renúncia não"]], ["Competência", ["Regra: lugar da consumação (art. 70)", "Justiça Federal: crime contra bens, serviços ou interesse da União (art. 109 CF)", "Servidor federal: federal só se ligado à função", "Júri: crimes dolosos contra a vida", "Foro por prerrogativa só para crimes no cargo e em razão dele (STF)"]], ["Prisões e cautelares", ["Flagrante: audiência de custódia em 24 horas", "Preventiva: crime doloso com pena máxima acima de 4 anos, reincidente ou violência doméstica (art. 313)", "Juiz não decreta preventiva de ofício", "Temporária: só no inquérito (Lei 7.960/89)", "Fiança: quebra perde metade; não apresentação para pena perde tudo"]], ["Acordos", ["Transação penal: menor potencial ofensivo, máxima até 2 anos", "Sursis processual: pena mínima até 1 ano (art. 89, Lei 9.099)", "ANPP: mínima inferior a 4 anos, sem violência, com confissão (art. 28-A)", "Não cabe ANPP em violência doméstica"]], ["Recursos", ["RESE: hipóteses do art. 581, 5 dias", "Apelação: 5 dias, razões em 8", "Embargos infringentes: só defesa, decisão não unânime, 10 dias", "Embargos de declaração: 2 dias", "Revisão criminal: a qualquer tempo, só a favor do réu"]], ["Provas e princípios", ["Comunhão da prova: a prova é do processo", "Prova ilícita e derivadas: inadmissíveis", "Fonte independente e descoberta inevitável afastam a contaminação", "Reconhecimento de pessoas: seguir o art. 226 (STJ)"]]]], "peg": ["Embargos de declaração no CPP têm prazo de 2 dias, não 5 como no CPC.", "Sentença de pronúncia é atacada por RESE, não apelação; impronúncia e absolvição sumária, por apelação.", "Queixa subsidiária sem inércia do MP: ilegitimidade ativa.", "ANPP exige confissão formal e circunstanciada."], "qs": [{"id": "ppen-0", "p": "Ao final da primeira fase do procedimento do Júri, o juiz pronunciou o réu. A defesa quer recorrer. O recurso cabível é:", "o": ["Apelação, em 5 dias.", "Embargos infringentes, em 10 dias.", "Habeas corpus, que é o único meio de impugnar a pronúncia.", "Recurso em sentido estrito, em 5 dias."], "c": 3, "e": "Art. 581, IV, do CPP: cabe RESE da decisão que pronunciar o réu, no prazo de 5 dias (art. 586). Da impronúncia e da absolvição sumária cabe apelação (art. 416)."}, {"id": "ppen-1", "p": "João é acusado de crime sem violência ou grave ameaça, com pena de 1 a 4 anos. É primário e confessou formalmente. Em tese, cabem:", "o": ["Suspensão condicional do processo e acordo de não persecução penal.", "Nenhum benefício, pois a pena máxima é de 4 anos.", "Apenas acordo de não persecução penal, pois a pena máxima supera 2 anos.", "Apenas transação penal."], "c": 0, "e": "Pena mínima de 1 ano: cabe sursis processual (art. 89 da Lei 9.099/95). Mínima inferior a 4 anos, sem violência e com confissão: cabe ANPP (art. 28-A do CPP). O ANPP vem antes da denúncia; o sursis, com ela."}, {"id": "ppen-2", "p": "O prazo para opor embargos de declaração contra sentença penal é de:", "o": ["2 dias.", "15 dias.", "10 dias.", "5 dias."], "c": 0, "e": "Art. 382 do CPP: embargos de declaração contra sentença em 2 dias. Contra acórdão, também 2 dias (art. 619)."}, {"id": "ppen-3", "p": "Na audiência de custódia, nem o MP nem a autoridade policial pediram a prisão preventiva do autuado. Mesmo assim, o juiz converteu o flagrante em preventiva, de ofício. A decisão é:", "o": ["Ilegal, pois após o Pacote Anticrime o juiz não pode decretar a preventiva de ofício.", "Válida, pois o juiz pode decretar a preventiva de ofício.", "Válida, pois a conversão do flagrante dispensa requerimento.", "Válida apenas em crimes hediondos."], "c": 0, "e": "Art. 311 do CPP (Lei 13.964/19): a preventiva depende de requerimento do MP, do querelante ou do assistente, ou de representação da autoridade policial. O STJ e o STF vedam a conversão de ofício."}, {"id": "ppen-4", "p": "O acusado, solto mediante fiança, mudou de residência sem comunicar o juízo. O juiz julgou quebrada a fiança. A consequência legal é:", "o": ["A perda de 1/3 do valor da fiança.", "A perda da totalidade do valor da fiança.", "A perda de metade do valor da fiança.", "Nenhuma perda de valor, apenas a prisão."], "c": 2, "e": "Arts. 341 e 343 do CPP: o quebramento da fiança importa a perda de metade do seu valor. A perda total ocorre se o condenado não se apresentar para o início do cumprimento da pena (art. 344)."}, {"id": "ppen-5", "p": "O inquérito sobre o roubo sofrido por Clara foi concluído e remetido ao MP, que ofereceu denúncia no prazo legal. Clara também quer apresentar queixa-crime subsidiária. Ela:", "o": ["Pode, desde que o MP concorde.", "Pode, pois é a vítima.", "Não pode, pois a ação penal privada subsidiária só cabe quando o MP fica inerte.", "Pode, desde que no prazo de 6 meses."], "c": 2, "e": "Art. 5º, LIX, da CF e art. 29 do CPP: a ação privada subsidiária pressupõe inércia do MP, que não oferece denúncia no prazo legal."}]}, {"id": "trab", "nome": "Direito do Trabalho", "lei": "CLT (com a Reforma Trabalhista, Lei 13.467/17) e Súmulas do TST", "peso": 5, "texto": "<p>Trabalho é uma matéria de <strong>números e exceções</strong>. A prova quer saber se você conhece os limites: jornada de 8 horas diárias e 44 semanais, adicional de no mínimo 50%, intervalo de 1 a 2 horas para quem trabalha mais de 6.</p>\n<p>Depois da Reforma de 2017, muitos temas passaram a admitir <mark>acordo individual</mark> (banco de horas de até 6 meses, 12x36, compensação no mesmo mês). O que exige <mark>negociação coletiva</mark> é o banco de horas de até 1 ano e o que a CLT reserva às convenções.</p>\n<p>Estabilidades caem sempre: gestante, cipeiro, acidentado e dirigente sindical. Grave o período de cada uma e se o desconhecimento do empregador muda algo (não muda, no caso da gestante).</p>", "mapa": ["Direito do Trabalho", [["Jornada", ["8 horas por dia, 44 por semana", "Hora extra: no mínimo 50%", "Banco de horas: individual 6 meses; coletivo 1 ano; no mesmo mês, tácito", "12x36: acordo individual escrito", "Intervalo: mais de 6 horas, 1 a 2 horas; de 4 a 6 horas, 15 minutos", "Intervalo suprimido: paga só o tempo suprimido, com 50%, natureza indenizatória"]], ["Salário", ["Equiparação: mesma função, mesmo estabelecimento, até 4 anos no emprego e 2 na função (art. 461)", "Quadro de carreira existente afasta a equiparação", "Descontos: só adiantamento, lei, norma coletiva; dano com dolo, ou culpa se acordado (art. 462)", "Gorjeta integra remuneração, não salário"]], ["Estabilidades", ["Gestante: da confirmação até 5 meses após o parto; desconhecimento não afasta (Súmula 244)", "Cipeiro eleito: do registro até 1 ano após o mandato", "Acidentado: 12 meses após cessar o benefício acidentário", "Dirigente sindical: do registro até 1 ano após o mandato"]], ["Férias", ["30 dias após 12 meses", "Fracionamento em até 3 períodos, um com 14 dias ou mais, os demais com 5 ou mais", "Não podem começar 2 dias antes de feriado ou repouso", "Terço constitucional; abono de 1/3 a pedido"]], ["Rescisão", ["Justa causa: rol do art. 482", "Rescisão indireta: falta grave do empregador (art. 483)", "Acordo (art. 484-A): metade do aviso e da multa do FGTS, saque de 80%, sem seguro-desemprego", "Suspensão disciplinar acima de 30 dias: rescisão injusta (art. 474)", "Verbas em 10 dias do término"]], ["Terceirização e figuras", ["Terceirização lícita em qualquer atividade, inclusive fim (STF)", "Tomador: responsabilidade subsidiária", "Teletrabalho: por produção não tem controle de jornada", "Intermitente: contrato escrito, valor-hora não inferior ao mínimo"]]]], "peg": ["Banco de horas de 1 ano por acordo individual é inválido: o individual vai só até 6 meses.", "Desconhecimento da gravidez pelo empregador não afasta a estabilidade.", "Quadro de carreira 'que ainda vai entrar em vigor' não afasta a equiparação.", "Desconto por dano culposo sem cláusula no contrato é ilícito."], "qs": [{"id": "trab-0", "p": "Uma empresa e seu empregado firmaram, por acordo individual escrito, regime de 12 horas de trabalho por 36 de descanso. Esse ajuste é:", "o": ["Válido apenas para profissionais de saúde.", "Válido, pois a CLT admite o 12x36 por acordo individual escrito.", "Inválido, pois o 12x36 exige convenção ou acordo coletivo.", "Inválido, pois ultrapassa o limite de 10 horas diárias."], "c": 1, "e": "Art. 59-A da CLT: é facultado às partes, mediante acordo individual escrito, convenção ou acordo coletivo, estabelecer jornada 12x36."}, {"id": "trab-1", "p": "Uma empregada pediu que suas férias fossem divididas em três períodos: 14, 10 e 6 dias. O fracionamento é:", "o": ["Inválido, pois nenhum período pode ser inferior a 10 dias.", "Válido, pois um período tem 14 dias e os demais têm pelo menos 5 dias.", "Inválido, pois as férias só podem ser divididas em dois períodos.", "Válido somente se houver previsão em norma coletiva."], "c": 1, "e": "Art. 134, §1º, da CLT: com a concordância do empregado, as férias podem ser fracionadas em até 3 períodos, sendo um de pelo menos 14 dias e os outros de pelo menos 5 dias corridos."}, {"id": "trab-2", "p": "Empregado e empregador decidiram encerrar o contrato por acordo, nos termos do art. 484-A da CLT. O empregado terá direito a:", "o": ["Somente saldo de salário e férias, sem saque do FGTS.", "Metade do aviso prévio indenizado, multa de 20% do FGTS e saque de até 80% do FGTS, sem seguro-desemprego.", "Metade de todas as verbas rescisórias e seguro-desemprego.", "Aviso prévio integral, multa de 40% do FGTS e seguro-desemprego."], "c": 1, "e": "Art. 484-A da CLT: na extinção por acordo, são devidos metade do aviso indenizado e da multa do FGTS (20%), as demais verbas integralmente, saque de até 80% do FGTS e não há seguro-desemprego."}, {"id": "trab-3", "p": "Uma empresa firmou banco de horas com seus empregados, por acordo individual escrito, com compensação em até 12 meses. O ajuste é:", "o": ["Inválido nesses termos, pois por acordo individual a compensação deve ocorrer em até 6 meses; o prazo de 1 ano exige negociação coletiva.", "Inválido, pois o banco de horas foi extinto.", "Válido, pois a Reforma Trabalhista permite qualquer prazo por acordo individual.", "Válido, se houver homologação do sindicato depois."], "c": 0, "e": "Art. 59, §§2º e 5º, da CLT: banco de horas de até 1 ano exige acordo ou convenção coletiva; por acordo individual escrito, a compensação deve ocorrer no máximo em 6 meses."}, {"id": "trab-4", "p": "Como punição por faltas reiteradas, a empresa suspendeu um empregado por 40 dias seguidos. Segundo a CLT:", "o": ["A suspensão é válida, pois está dentro do poder disciplinar.", "A suspensão por mais de 30 dias consecutivos importa rescisão injusta do contrato.", "A suspensão só é inválida se ultrapassar 90 dias.", "A suspensão é válida se o empregado assinar a advertência."], "c": 1, "e": "Art. 474 da CLT: a suspensão do empregado por mais de 30 dias consecutivos importa a rescisão injusta do contrato de trabalho."}]}, {"id": "ptrab", "nome": "Processo do Trabalho", "lei": "CLT e Súmulas do TST", "peso": 5, "texto": "<p>O Processo do Trabalho tem regras próprias que a FGV adora contrastar com o CPC. O principal: <mark>recursos em 8 dias</mark> (salvo embargos de declaração, 5 dias), <mark>decisões interlocutórias irrecorríveis de imediato</mark> e <mark>depósito recursal</mark> para o empregador.</p>\n<p>Na audiência, a ausência do <strong>reclamante</strong> gera arquivamento; a do <strong>reclamado</strong>, revelia e confissão quanto à matéria de fato. O preposto não precisa ser empregado.</p>\n<p>Desde a Reforma, há <mark>honorários de sucumbência</mark> (5% a 15%) e a homologação de <mark>acordo extrajudicial</mark> por petição conjunta, com advogados distintos.</p>", "mapa": ["Processo do Trabalho", [["Audiência", ["Reclamante ausente: arquivamento", "Reclamado ausente: revelia e confissão", "Preposto não precisa ser empregado (art. 843, §3º)", "Duas propostas de conciliação obrigatórias", "Testemunhas: até 3 no ordinário, 2 no sumaríssimo"]], ["Ritos", ["Sumário: até 2 salários mínimos", "Sumaríssimo: até 40 salários mínimos, pedido líquido, sem citação por edital", "Ordinário: acima de 40 ou com ente público"]], ["Recursos", ["Prazo geral: 8 dias", "Embargos de declaração: 5 dias", "Interlocutórias: irrecorríveis de imediato (Súmula 214)", "Recurso ordinário, de revista, agravo de petição, agravo de instrumento", "Adesivo: no prazo das contrarrazões (Súmula 283)"]], ["Preparo", ["Custas: 2% do valor da condenação", "Depósito recursal: só do empregador", "Metade: microempresa, EPP, sem fins lucrativos, doméstico", "Isentos: justiça gratuita, recuperação judicial, entidades filantrópicas", "Falta ou insuficiência: deserção"]], ["Reforma de 2017", ["Honorários de sucumbência: 5% a 15%", "Acordo extrajudicial: petição conjunta, advogados distintos (art. 855-B)", "Prescrição intercorrente: 2 anos", "Pedido deve ser certo e com valor"]], ["Execução e outras ações", ["Ação de cumprimento: empregado ou sindicato (art. 872)", "Embargos à execução: 5 dias, garantido o juízo", "Agravo de petição: contra decisões na execução", "Competência: relação de trabalho, inclusive dano moral (art. 114 CF)"]]]], "peg": ["Prazo de 15 dias para recurso é do CPC; no trabalho são 8 dias.", "Empregado não faz depósito recursal.", "Agravo de instrumento trabalhista serve só para destrancar recurso denegado.", "Preposto não precisa ser empregado desde a Reforma."], "qs": [{"id": "ptrab-0", "p": "Na audiência inaugural de reclamação trabalhista no rito ordinário, o reclamante não compareceu, embora o reclamado estivesse presente. A consequência é:", "o": ["Adiamento obrigatório da audiência.", "Arquivamento da reclamação.", "Julgamento imediato com confissão ficta do reclamante.", "Revelia do reclamante."], "c": 1, "e": "Art. 844 da CLT: o não comparecimento do reclamante importa arquivamento da reclamação."}, {"id": "ptrab-1", "p": "Uma microempresa foi condenada na reclamação trabalhista e quer interpor recurso ordinário. Quanto ao depósito recursal:", "o": ["Está isenta.", "Deve recolher o depósito pela metade.", "Deve recolher o valor integral.", "Só deve recolher se a condenação superar 40 salários mínimos."], "c": 1, "e": "Art. 899, §9º, da CLT: o depósito recursal é reduzido pela metade para microempresas, empresas de pequeno porte, entidades sem fins lucrativos e empregadores domésticos."}, {"id": "ptrab-2", "p": "Contra decisão interlocutória proferida durante a fase de conhecimento, em regra, no processo do trabalho:", "o": ["Cabe agravo de instrumento em 8 dias.", "Não cabe recurso imediato; a matéria é discutida no recurso contra a decisão definitiva.", "Cabe recurso ordinário em 8 dias.", "Cabe agravo de petição em 8 dias."], "c": 1, "e": "Art. 893, §1º, da CLT e Súmula 214 do TST: as decisões interlocutórias não são recorríveis de imediato, salvo as exceções da súmula."}, {"id": "ptrab-3", "p": "A sentença trabalhista foi publicada e a empresa quer interpor recurso ordinário. O prazo é de:", "o": ["15 dias.", "5 dias.", "10 dias.", "8 dias."], "c": 3, "e": "Art. 895, I, da CLT: cabe recurso ordinário para a instância superior das decisões definitivas ou terminativas das Varas, no prazo de 8 dias."}, {"id": "ptrab-4", "p": "Na audiência, a empresa reclamada foi representada por um preposto que não é seu empregado, mas conhece os fatos. O reclamante pediu a revelia. Segundo a CLT:", "o": ["A audiência deve ser adiada para a empresa enviar um empregado.", "Há revelia, salvo se a empresa for microempresa.", "Não há revelia, pois o preposto não precisa ser empregado da parte reclamada.", "Há revelia, pois o preposto deve ser empregado."], "c": 2, "e": "Art. 843, §3º, da CLT (Reforma de 2017): o preposto não precisa ser empregado da parte reclamada. A Súmula 377 do TST foi superada nesse ponto."}]}, {"id": "adm", "nome": "Direito Administrativo", "lei": "CF, Lei 14.133/21, Lei 9.784/99, Lei 8.987/95, Lei 8.429/92", "peso": 5, "texto": "<p>Administrativo cobra muito <strong>licitações</strong> (Lei 14.133/21), <strong>atos administrativos</strong>, <strong>serviços públicos</strong>, <strong>intervenção na propriedade</strong> e <strong>responsabilidade do Estado</strong>.</p>\n<p>Na nova lei de licitações, separe <mark>dispensa</mark> (há competição possível, mas a lei permite não licitar, rol do art. 75) de <mark>inexigibilidade</mark> (a competição é inviável, rol exemplificativo do art. 74, como artista consagrado e fornecedor exclusivo).</p>\n<p>A responsabilidade do Estado é <mark>objetiva</mark> (art. 37, §6º, CF): a vítima processa o Estado, que depois cobra do servidor em ação regressiva se ele agiu com dolo ou culpa. A vítima não pode processar diretamente o servidor (tese da dupla garantia, STF).</p>", "mapa": ["Administrativo", [["Atos administrativos", ["Elementos: competência, finalidade, forma, motivo, objeto", "Atributos: presunção de legitimidade, imperatividade, autoexecutoriedade, tipicidade", "Anulação: ilegalidade, efeito retroativo, prazo de 5 anos (art. 54 da Lei 9.784)", "Revogação: conveniência, efeito para frente, só pela Administração", "Vinculado: Judiciário pode reconhecer o direito; discricionário: só controla legalidade"]], ["Processo administrativo federal", ["Delegação: inclusive a quem não é subordinado", "Não se delega: ato normativo, decisão de recurso, competência exclusiva (art. 13)", "Recurso: 10 dias", "Reformatio in pejus: admitida no recurso, com aviso ao interessado"]], ["Licitações (Lei 14.133)", ["Modalidades: pregão, concorrência, concurso, leilão, diálogo competitivo", "Fim do convite e da tomada de preços", "Inexigibilidade (art. 74): fornecedor exclusivo, artista consagrado, serviço técnico especializado notório", "Dispensa (art. 75): valores baixos, emergência, licitação deserta", "Critérios: menor preço, maior desconto, melhor técnica, técnica e preço, maior lance, maior retorno"]], ["Serviços públicos e concessões", ["Concessão: licitação, concorrência ou diálogo competitivo", "Encampação: interesse público, lei autorizativa, indenização prévia", "Caducidade: inadimplemento da concessionária", "Reversão dos bens ao final"]], ["Intervenção na propriedade", ["Desapropriação: indenização prévia, justa e em dinheiro", "Após a declaração: indeniza benfeitorias necessárias e úteis autorizadas", "Caducidade do decreto: 5 anos (utilidade pública), 2 (interesse social)", "Servidão, requisição, ocupação temporária, limitação, tombamento"]], ["Responsabilidade e improbidade", ["Estado: objetiva, risco administrativo (art. 37, §6º)", "Omissão genérica: subjetiva (falta do serviço); omissão específica, com dever de agir: objetiva", "Ação contra o Estado, nunca direto contra o servidor (STF)", "Improbidade: exige dolo desde a Lei 14.230/21", "Prescrição da improbidade: 8 anos"]]]], "peg": ["Decisão de recurso administrativo não pode ser delegada.", "Artista consagrado é inexigibilidade, não dispensa.", "Encampação exige lei específica e indenização prévia; caducidade, não.", "Improbidade culposa deixou de existir desde 2021."], "qs": [{"id": "adm-0", "p": "A Administração verificou que um ato administrativo discricionário, válido, se tornou inconveniente ao interesse público. Ela deve:", "o": ["Anulá-lo, com efeitos retroativos.", "Pedir ao Judiciário a sua revogação.", "Convalidá-lo.", "Revogá-lo, com efeitos a partir da revogação."], "c": 3, "e": "Ato válido que deixa de ser conveniente ou oportuno é revogado pela própria Administração, com efeitos ex nunc. Anulação é para atos ilegais."}, {"id": "adm-1", "p": "O Município Beta precisa adquirir um equipamento que só é fornecido por uma empresa exclusiva no país. Segundo a Lei 14.133/21, trata-se de:", "o": ["Inexigibilidade de licitação.", "Licitação obrigatória na modalidade pregão.", "Dispensa de licitação.", "Licitação na modalidade diálogo competitivo."], "c": 0, "e": "Art. 74, I, da Lei 14.133/21: é inexigível a licitação para aquisição de bens que só possam ser fornecidos por produtor, empresa ou representante comercial exclusivos."}, {"id": "adm-2", "p": "Uma viatura da polícia estadual, dirigida por policial em serviço, colidiu com o carro de Joana. Ela pretende ser indenizada. Segundo o STF:", "o": ["Deve processar o Estado, que responde objetivamente, cabendo ao Estado ação regressiva contra o policial em caso de dolo ou culpa.", "Deve processar o policial diretamente, provando sua culpa.", "Deve processar o Estado, provando a culpa do policial.", "Pode escolher entre processar o Estado ou o policial."], "c": 0, "e": "Art. 37, §6º, da CF e Tema 940 do STF: a ação deve ser proposta contra o Estado, que responde objetivamente; o agente só responde em regresso, se agiu com dolo ou culpa."}, {"id": "adm-3", "p": "O Secretário de Estado, autoridade competente para julgar recursos administrativos num processo federal, delegou essa decisão a um assessor técnico. Segundo a Lei 9.784/99, a delegação é:", "o": ["Válida, se o assessor tiver mais conhecimento técnico.", "Válida, se o administrado concordar.", "Válida, se publicada no Diário Oficial.", "Inválida, pois a decisão de recursos administrativos não pode ser delegada."], "c": 3, "e": "Art. 13, II, da Lei 9.784/99: não podem ser objeto de delegação a edição de atos normativos, a decisão de recursos administrativos e as matérias de competência exclusiva."}, {"id": "adm-4", "p": "O Município quer retomar, por interesse público, um serviço concedido a uma empresa que cumpre regularmente o contrato. Para isso, segundo a Lei 8.987/95, é necessário:", "o": ["Lei autorizativa específica e prévio pagamento de indenização.", "Apenas decreto do Prefeito.", "Comprovar inadimplemento da concessionária, declarando a caducidade.", "Esperar o fim do prazo da concessão, pois a retomada antecipada é vedada."], "c": 0, "e": "Art. 37 da Lei 8.987/95: a encampação é a retomada por interesse público, durante a concessão, mediante lei autorizativa específica e após prévio pagamento da indenização."}]}, {"id": "trib", "nome": "Direito Tributário", "lei": "CF (arts. 145 a 162), CTN e Reforma Tributária (EC 132/23)", "peso": 5, "texto": "<p>Tributário na OAB é <strong>CF + CTN</strong>. Os temas campeões: <strong>limitações ao poder de tributar</strong> (legalidade, anterioridade, imunidades), <strong>competência de cada ente</strong>, <strong>crédito tributário</strong> (suspensão, extinção e exclusão) e <strong>certidões</strong>.</p>\n<p>Sobre a anterioridade, a regra é cumprir <mark>as duas</mark>: a anual (próximo exercício) e a nonagesimal (90 dias). Mas há exceções diferentes para cada uma, e a FGV cobra exatamente essas listas.</p>\n<p>A <mark>Reforma Tributária</mark> (EC 132/23) cria o IBS, a CBS e o Imposto Seletivo, em transição até 2033. Até lá, ICMS, ISS, PIS e Cofins convivem com os novos tributos; acompanhe se o edital do seu exame cobra a reforma.</p>", "mapa": ["Tributário", [["Princípios", ["Legalidade: tributo só por lei", "Anterioridade anual e nonagesimal (art. 150, III, b e c)", "Exceções às duas: II, IE, IOF, empréstimo compulsório de guerra/calamidade, imposto extraordinário", "Exceção só à anual: IPI, contribuições sociais, CIDE-combustíveis e ICMS-combustíveis (redução e restabelecimento de alíquota)", "Exceção só à nonagesimal: IR, base de cálculo do IPTU e IPVA", "Isenção heterônoma vedada (art. 151, III)"]], ["Imunidades", ["Recíproca: entes entre si, autarquias e fundações", "Templos de qualquer culto", "Partidos, sindicatos de trabalhadores, entidades de educação e assistência sem fins lucrativos", "Livros, jornais, periódicos e o papel; e-book incluído (STF)", "Imunidade alcança só impostos"]], ["Competências", ["União: II, IE, IR, IPI, IOF, ITR, grandes fortunas", "Estados: ICMS, IPVA, ITCMD", "Municípios: IPTU, ISS, ITBI", "ITCMD de imóvel: Estado do bem", "ITBI: não incide na integralização de capital (salvo atividade imobiliária)"]], ["Crédito tributário", ["Suspensão (art. 151): moratória, depósito integral, reclamações e recursos, liminar, tutela, parcelamento", "Extinção (art. 156): pagamento, compensação, transação, remissão, prescrição, decadência...", "Exclusão (art. 175): isenção e anistia", "Decadência: 5 anos para lançar; prescrição: 5 anos para cobrar"]], ["Obrigação e responsabilidade", ["Fato gerador gera a obrigação principal", "Sucessão: adquirente de imóvel responde pelos tributos do bem", "Sócio-gerente: só com excesso de poderes ou infração de lei (art. 135)", "Inadimplência simples não gera responsabilidade do sócio (Súmula 430 STJ)", "Capacidade tributária ativa pode ser delegada (art. 7º)"]], ["Certidões e processo", ["Negativa: sem débitos", "Positiva com efeito de negativa: débito suspenso, não vencido ou garantido em execução (art. 206)", "Execução fiscal: Lei 6.830/80", "Embargos à execução fiscal: 30 dias, garantido o juízo"]]]], "peg": ["IR obedece à anterioridade anual, mas não à nonagesimal.", "IPI obedece à nonagesimal, mas não à anual.", "Imunidade não alcança taxas nem contribuições.", "Mero inadimplemento não gera responsabilidade pessoal do sócio-gerente."], "qs": [{"id": "trib-0", "p": "Lei publicada em 10 de de
