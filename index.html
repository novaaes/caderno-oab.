zembro de 2025 majorou a alíquota do Imposto de Renda. A nova alíquota pode ser exigida a partir de:", "o": ["10 de março de 2026.", "1º de janeiro de 2027.", "10 de dezembro de 2025.", "1º de janeiro de 2026."], "c": 3, "e": "Art. 150, §1º, da CF: o IR é exceção apenas à anterioridade nonagesimal. Basta respeitar a anual, então pode ser exigido a partir de 1º de janeiro do exercício seguinte."}, {"id": "trib-1", "p": "Uma igreja é proprietária de um imóvel alugado a terceiros, cuja renda é integralmente aplicada nas atividades religiosas. Quanto ao IPTU:", "o": ["Incide, mas a igreja tem isenção automática.", "Não incide, porque igrejas não pagam nenhum tributo.", "Não incide, pela imunidade dos templos, já que a renda é aplicada nas finalidades essenciais.", "Incide normalmente, pois o imóvel está alugado."], "c": 2, "e": "Art. 150, VI, b, e §4º, da CF e Súmula Vinculante 52: a imunidade alcança o imóvel alugado a terceiros quando a renda é aplicada nas atividades essenciais da entidade."}, {"id": "trib-2", "p": "O sócio-gerente de uma sociedade limitada deixou de recolher tributos por falta de caixa, sem fraude ou excesso de poderes. Segundo o STJ:", "o": ["Não responde pessoalmente, pois o mero inadimplemento não gera responsabilidade do sócio-gerente.", "Responde solidariamente com a sociedade, sempre.", "Responde pessoalmente pelos tributos, pelo simples inadimplemento.", "Responde subsidiariamente em qualquer caso."], "c": 0, "e": "Súmula 430 do STJ: o inadimplemento da obrigação tributária pela sociedade não gera, por si só, a responsabilidade solidária do sócio-gerente (art. 135 do CTN exige excesso de poderes ou infração de lei)."}, {"id": "trib-3", "p": "Um templo religioso recebeu a cobrança da taxa municipal de coleta de lixo. O templo alega imunidade. Segundo a CF:", "o": ["Não há cobrança, pois templos têm imunidade a todos os tributos.", "A cobrança é devida, pois a imunidade dos templos alcança apenas impostos.", "A cobrança é indevida, pois taxa de lixo é inconstitucional.", "A cobrança só é devida se o templo tiver fins lucrativos."], "c": 1, "e": "Art. 150, VI, b, da CF: a imunidade dos templos é vedação à instituição de impostos. Não alcança taxas nem contribuições. A taxa de coleta domiciliar de lixo é constitucional (SV 19)."}, {"id": "trib-4", "p": "Uma empresa tem um único débito tributário, cuja exigibilidade está suspensa por parcelamento em dia. Ela precisa de certidão para licitar. Segundo o CTN, ela tem direito a:", "o": ["Certidão positiva com efeitos de negativa.", "Certidão negativa de débitos.", "Apenas certidão positiva, que a impede de licitar.", "Nenhuma certidão, até quitar o parcelamento."], "c": 0, "e": "Art. 206 do CTN: tem os mesmos efeitos da certidão negativa a certidão que aponta créditos não vencidos, em cobrança executiva com penhora ou com exigibilidade suspensa (o parcelamento suspende, art. 151, VI)."}]}, {"id": "emp", "nome": "Direito Empresarial", "lei": "Código Civil (Livro II), Lei 6.404/76, Lei 11.101/05, leis de títulos", "peso": 4, "texto": "<p>Empresarial tem quatro blocos fixos na prova: <strong>empresário e sociedades</strong>, <strong>títulos de crédito</strong>, <strong>sociedade limitada e anônima</strong> e <strong>falência e recuperação</strong>.</p>\n<p>A pergunta de partida é sempre: <mark>é empresário ou não?</mark> Quem exerce atividade econômica organizada para produzir ou circular bens ou serviços é empresário (art. 966). Profissional intelectual não é, salvo se a profissão for elemento de empresa. E há duas regras fixas: <mark>S.A. é sempre empresária</mark>, <mark>cooperativa é sempre simples</mark>.</p>\n<p>Na falência, grave a <strong>ordem de pagamento</strong> (art. 83) e os prazos da recuperação judicial: plano em 60 dias, suspensão das execuções por 180 dias (prorrogável uma vez).</p>", "mapa": ["Empresarial", [["Empresário", ["Atividade econômica organizada (art. 966)", "Profissional intelectual não é empresário, salvo elemento de empresa", "Registro na Junta antes de começar (art. 967)", "Rural: registro é facultativo", "S.A. sempre empresária; cooperativa sempre simples (art. 982)"]], ["Sociedades", ["Limitada: responsabilidade limitada às quotas, todos solidários pela integralização", "Limitada unipessoal admitida", "Alteração do contrato: mais da metade do capital (art. 1.076)", "S.A.: ações, assembleia geral, conselho fiscal", "Desconsideração da personalidade: abuso, desvio de finalidade ou confusão patrimonial (art. 50)"]], ["Títulos de crédito", ["Princípios: cartularidade, literalidade, autonomia", "Cheque: apresentação em 30 dias (mesma praça) ou 60 (outra praça)", "Duplicata aceita: título executivo sem protesto", "Duplicata sem aceite: protesto e comprovante de entrega", "Aval: garantia cambial; fiança: garantia contratual"]], ["Recuperação judicial", ["Requisito: atividade há mais de 2 anos", "Plano em 60 dias após o deferimento do processamento", "Suspensão das ações e execuções: 180 dias, prorrogável uma vez", "Créditos trabalhistas: pagos em até 1 ano", "Credores votam o plano em assembleia"]], ["Falência", ["Ordem (art. 83): trabalhistas até 150 salários mínimos e acidentários; garantia real; tributários; quirografários; multas; subordinados", "Créditos extraconcursais pagos antes", "Juros após a decretação: só se o ativo bastar (art. 124)", "Ineficácia de atos no termo legal"]]]], "peg": ["Sociedade anônima é empresária mesmo que o objeto seja intelectual.", "Cooperativa é simples mesmo que registrada na Junta.", "Prazo de apresentação do cheque (30 ou 60 dias) não é o prazo para executá-lo: a execução prescreve em 6 meses contados do fim do prazo de apresentação.", "Na falência, o crédito tributário vem depois do crédito com garantia real."], "qs": [{"id": "emp-0", "p": "Três médicos constituíram sociedade cooperativa para prestar serviços de saúde. Segundo o Código Civil, essa sociedade é:", "o": ["Empresária, porque exerce atividade econômica organizada.", "Empresária, se arquivar seus atos na Junta Comercial.", "Simples, independentemente de seu objeto.", "Simples, apenas se tiver menos de 20 cooperados."], "c": 2, "e": "Art. 982, parágrafo único, do CC: independentemente do objeto, considera-se simples a cooperativa e empresária a sociedade por ações."}, {"id": "emp-1", "p": "Na falência, após o pagamento dos créditos extraconcursais, o primeiro grupo de credores a ser pago é o dos:", "o": ["Créditos quirografários.", "Créditos com garantia real.", "Créditos trabalhistas, até 150 salários mínimos por credor, e os de acidente de trabalho.", "Créditos tributários."], "c": 2, "e": "Art. 83, I, da Lei 11.101/05: em primeiro lugar, os créditos derivados da legislação trabalhista, limitados a 150 salários mínimos por credor, e os decorrentes de acidente de trabalho."}, {"id": "emp-2", "p": "Para requerer recuperação judicial, o empresário deve exercer regularmente suas atividades há mais de:", "o": ["6 meses.", "1 ano.", "5 anos.", "2 anos."], "c": 3, "e": "Art. 48 da Lei 11.101/05: o devedor precisa exercer regularmente suas atividades há mais de 2 anos."}, {"id": "emp-3", "p": "Seis economistas constituíram uma sociedade anônima para prestar serviços de consultoria intelectual. Segundo o Código Civil, essa sociedade é:", "o": ["Empresária, pois a sociedade por ações é sempre empresária, independentemente do objeto.", "Simples, pois a atividade é intelectual.", "Simples, se registrada no Registro Civil de Pessoas Jurídicas.", "Empresária apenas se tiver mais de dez acionistas."], "c": 0, "e": "Art. 982, parágrafo único, do CC: independentemente de seu objeto, considera-se empresária a sociedade por ações. Seus atos são arquivados na Junta Comercial."}]}, {"id": "cdc", "nome": "Direito do Consumidor", "lei": "CDC (Lei 8.078/90)", "peso": 2, "texto": "<p>O CDC tem uma distinção que resolve metade das questões: <mark>fato do produto</mark> (acidente de consumo, dano à saúde ou segurança, prazo de 5 anos) x <mark>vício do produto</mark> (problema de qualidade ou quantidade, prazo de 30 ou 90 dias).</p>\n<p>No fato do produto, o comerciante responde só de forma <strong>subsidiária</strong> (art. 13). No vício, <strong>todos os fornecedores respondem solidariamente</strong>. E o vício de qualidade dá ao fornecedor 30 dias para consertar; o de quantidade, não.</p>", "mapa": ["Consumidor", [["Fato do produto (acidente)", ["Responsabilidade objetiva do fabricante, produtor, importador (art. 12)", "Comerciante: subsidiário (art. 13)", "Prescrição: 5 anos (art. 27)", "Bystander: vítima do evento é consumidor (art. 17)"]], ["Vício do produto", ["Todos os fornecedores solidários (art. 18)", "Qualidade: fornecedor tem 30 dias para sanar; depois o consumidor escolhe", "Quantidade: escolha imediata do consumidor (art. 19)", "Reclamar: 30 dias (não durável), 90 dias (durável)", "Vício oculto: prazo conta de quando aparece"]], ["Práticas e contratos", ["Arrependimento: 7 dias fora do estabelecimento (art. 49)", "Cobrança indevida paga: devolução em dobro (art. 42)", "Cláusula de perda total das parcelas: nula (art. 53)", "Inversão do ônus da prova: verossimilhança ou hipossuficiência"]], ["Princípios", ["Vulnerabilidade do consumidor", "Boa-fé objetiva", "Informação adequada", "Adimplemento substancial impede resolução"]]]], "peg": ["O comerciante não responde solidariamente pelo fato do produto, só nos casos do art. 13.", "Prazo de 5 anos é para o fato; 30 e 90 dias são para o vício.", "Direito de arrependimento só vale em compra fora do estabelecimento."], "qs": [{"id": "cdc-0", "p": "Uma panela de pressão explodiu na casa de Júlia e a feriu. A panela foi comprada numa loja e fabricada pela empresa X, devidamente identificada. Quem responde?", "o": ["A loja e o fabricante, solidariamente.", "Apenas a loja, que vendeu o produto.", "O fabricante, de forma objetiva; a loja só nos casos do art. 13 do CDC.", "O fabricante, desde que Júlia prove sua culpa."], "c": 2, "e": "É fato do produto (art. 12 do CDC): responde o fabricante objetivamente. O comerciante só responde se o fabricante não puder ser identificado, se o produto não tiver identificação clara ou se conservar mal perecíveis (art. 13)."}, {"id": "cdc-1", "p": "Pedro comprou uma geladeira que apresentou defeito de funcionamento após 20 dias de uso. O prazo para ele reclamar do vício aparente é de:", "o": ["5 anos.", "30 dias.", "7 dias.", "90 dias."], "c": 3, "e": "Art. 26, II, do CDC: 90 dias para produtos duráveis. A geladeira é bem durável."}]}, {"id": "eca", "nome": "ECA", "lei": "Lei 8.069/90", "peso": 2, "texto": "<p>O ECA na OAB cobra principalmente <strong>medidas socioeducativas</strong>, <strong>adoção</strong> e <strong>direito à convivência familiar</strong>. Criança é quem tem até <mark>12 anos incompletos</mark>; adolescente, de <mark>12 a 18</mark>. Criança que pratica ato infracional recebe só medida de proteção.</p>\n<p>A internação é a medida mais grave: <mark>máximo de 3 anos</mark>, reavaliação a cada <mark>6 meses</mark> e liberação compulsória aos <mark>21 anos</mark>. Só cabe por violência ou grave ameaça, reiteração em infrações graves ou descumprimento reiterado de medida anterior (por até 3 meses).</p>", "mapa": ["ECA", [["Conceitos", ["Criança: até 12 anos incompletos", "Adolescente: 12 a 18 anos", "Excepcionalmente, aplica-se até 21 anos", "Criança infratora: só medidas de proteção"]], ["Medidas socioeducativas", ["Advertência; reparar o dano; serviços à comunidade (até 6 meses); liberdade assistida (mínimo 6 meses); semiliberdade; internação", "Reparar o dano impossível: substitui por outra (art. 116)", "Internação: até 3 anos, reavaliação a cada 6 meses, saída obrigatória aos 21", "Internação provisória: até 45 dias", "Remissão pelo MP: exclui o processo"]], ["Convivência familiar", ["Acolhimento: reavaliação a cada 3 meses, máximo de 18 meses", "Visita a pai ou mãe preso: independe de autorização judicial (art. 19, §4º)", "Perda do poder familiar não decorre de pobreza"]], ["Adoção", ["Adotante: maior de 18 anos, 16 anos mais velho que o adotado", "Irmãos e avós não podem adotar", "Adoção é irrevogável", "Adolescente: consentimento necessário", "Estágio de convivência: até 90 dias"]]]], "peg": ["Avós não podem adotar o neto; podem ter a guarda.", "Internação não tem prazo determinado na sentença, só o limite de 3 anos.", "Falta de recursos materiais não justifica perda do poder familiar."], "qs": [{"id": "eca-0", "p": "Paulo, de 15 anos, praticou ato infracional equiparado a roubo, com grave ameaça. O juiz aplicou internação. Sobre essa medida:", "o": ["A internação pode durar até Paulo completar 18 anos.", "A medida não comporta prazo determinado, deve ser reavaliada no máximo a cada 6 meses e não pode passar de 3 anos.", "A sentença deve fixar o prazo exato da internação.", "A internação deve ser reavaliada uma vez por ano."], "c": 1, "e": "Art. 121, §§2º e 3º, do ECA: a internação não comporta prazo determinado, é reavaliada no máximo a cada 6 meses e não excede 3 anos; a liberação é compulsória aos 21."}, {"id": "eca-1", "p": "Os avós de Lucas, de 8 anos, que vive com eles desde bebê, querem adotá-lo. Segundo o ECA:", "o": ["Só podem adotar se os pais tiverem perdido o poder familiar.", "Podem adotar, pois têm vínculo afetivo com o neto.", "Não podem adotar o neto, mas podem obter sua guarda ou tutela.", "Podem adotar, desde que os pais concordem."], "c": 2, "e": "Art. 42, §1º, do ECA: não podem adotar os ascendentes e os irmãos do adotando. A situação se resolve por guarda ou tutela."}]}, {"id": "amb", "nome": "Direito Ambiental", "lei": "CF (art. 225), Lei 9.605/98, Lei 6.938/81, LC 140/11", "peso": 2, "texto": "<p>Ambiental tem três eixos: <strong>princípios</strong> (prevenção, precaução, poluidor-pagador), <strong>responsabilidade</strong> nas três esferas e <strong>licenciamento e competências</strong>.</p>\n<p>A responsabilidade civil ambiental é <mark>objetiva</mark>, pela teoria do <mark>risco integral</mark>: não admite excludentes como caso fortuito. A reparação é <mark>imprescritível</mark> e a obrigação de recuperar a área é <mark>propter rem</mark>, ou seja, acompanha o imóvel e alcança o novo dono.</p>", "mapa": ["Ambiental", [["Princípios", ["Prevenção: risco conhecido", "Precaução: risco incerto, na dúvida protege", "Poluidor-pagador", "Vedação do retrocesso", "Desenvolvimento sustentável"]], ["Responsabilidade civil", ["Objetiva, risco integral, sem excludentes", "Reparação imprescritível (STF)", "Obrigação propter rem: acompanha o imóvel (Súmula 623 STJ)", "Inversão do ônus da prova (Súmula 618 STJ)"]], ["Responsabilidade penal", ["Pessoa jurídica responde: decisão do representante ou colegiado, em seu benefício (art. 3º, Lei 9.605)", "Não exclui a pessoa física", "Dupla imputação não é obrigatória (STF)", "Penas da PJ: multa, restritivas, serviços à comunidade"]], ["Licenciamento e EIA", ["EIA/RIMA para atividade de significativa degradação (art. 225, §1º, IV)", "Estado não pode dispensar o EIA exigido", "Competência comum para proteger (art. 23)", "Licenciamento por um só ente (LC 140/11)", "Licenças: prévia, de instalação, de operação"]]]], "peg": ["'Caso fortuito exclui a responsabilidade ambiental': falso, a teoria é do risco integral.", "O novo proprietário responde pelo passivo ambiental, mesmo sem ter causado o dano.", "A ação de reparação de dano ambiental não prescreve."], "qs": [{"id": "amb-0", "p": "Carlos comprou uma fazenda com área de preservação permanente desmatada pelo antigo dono. Notificado para recuperar a área, alega que não causou o dano. Segundo o STJ:", "o": ["Carlos só responde se provado que sabia do desmatamento.", "Só o antigo dono responde, e a pretensão já prescreveu.", "Carlos não responde, pois a responsabilidade é pessoal do causador.", "Carlos responde, pois a obrigação ambiental é propter rem e acompanha o imóvel."], "c": 3, "e": "Súmula 623 do STJ: as obrigações ambientais têm natureza propter rem, podendo ser cobradas do proprietário ou possuidor atual e/ou dos anteriores, à escolha do credor."}, {"id": "amb-1", "p": "Sobre a pretensão de reparação civil de dano ambiental, é correto afirmar que:", "o": ["Prescreve em 5 anos.", "Prescreve em 3 anos.", "É imprescritível.", "Prescreve em 20 anos."], "c": 2, "e": "Tema 999 do STF: é imprescritível a pretensão de reparação civil de dano ambiental."}]}, {"id": "eleit", "nome": "Direito Eleitoral", "lei": "CF, Código Eleitoral, LC 64/90 e Lei 9.504/97", "peso": 2, "texto": "<p>Eleitoral cobra <strong>condições de elegibilidade e inelegibilidades</strong>, <strong>ações eleitorais</strong> e <strong>propaganda</strong>. Saiba quem pode propor cada ação e até quando.</p>\n<p>A impugnação do registro (AIRC) cabe a <mark>candidato, partido, federação, coligação ou MP</mark>, em 5 dias. O eleitor não impugna, só noticia. A captação ilícita de sufrágio (art. 41-A) pode ser apontada <mark>até a diplomação</mark> e não exige pedido explícito de voto.</p>", "mapa": ["Eleitoral", [["Elegibilidade", ["Nacionalidade, pleno exercício dos direitos políticos, alistamento, domicílio eleitoral, filiação, idade mínima", "Idades: 35 Presidente e Senador; 30 Governador; 21 Deputado e Prefeito; 18 Vereador", "Domicílio e filiação: 6 meses antes da eleição"]], ["Inelegibilidades", ["Constitucionais: inalistáveis, analfabetos, parentes no território (reflexa)", "Infraconstitucionais: LC 64/90 (Ficha Limpa)", "Infraconstitucional preexistente: alegar no registro, senão preclui", "Constitucional ou superveniente: pode ir ao RCED"]], ["Ações", ["AIRC: 5 dias da publicação do pedido de registro", "AIJE: abuso de poder, até a diplomação", "Representação do art. 41-A: até a diplomação", "AIME: 15 dias após a diplomação (art. 14, §10, CF)", "RCED: 3 dias após a diplomação"]], ["Propaganda", ["Permitida a partir de 16 de agosto do ano da eleição", "Proibido outdoor, showmício e brindes", "Internet: proibido impulsionamento por pessoa física", "Pré-campanha: sem pedido explícito de voto"]]]], "peg": ["Eleitor comum não tem legitimidade para AIRC.", "Captação de sufrágio não exige potencialidade para mudar o resultado.", "AIME tramita em segredo de justiça."], "qs": [{"id": "eleit-0", "p": "Para concorrer ao cargo de Governador, a idade mínima exigida pela Constituição é de:", "o": ["18 anos.", "30 anos.", "35 anos.", "21 anos."], "c": 1, "e": "Art. 14, §3º, VI, b, da CF: 30 anos para Governador e Vice-Governador de Estado e do Distrito Federal."}, {"id": "eleit-1", "p": "O prazo para ajuizar ação de impugnação de mandato eletivo (AIME) é de:", "o": ["Até a data da eleição.", "3 dias contados da diplomação.", "15 dias contados da diplomação.", "5 dias da publicação do registro."], "c": 2, "e": "Art. 14, §10, da CF: a AIME é ajuizada no prazo de 15 dias contados da diplomação, com provas de abuso do poder econômico, corrupção ou fraude."}]}, {"id": "prev", "nome": "Direito Previdenciário", "lei": "CF (art. 201), Lei 8.213/91 e EC 103/19", "peso": 2, "texto": "<p>Previdenciário na OAB foca em <strong>segurados</strong>, <strong>carência</strong> e <strong>benefícios</strong>. Comece pelo conceito de carência: o número mínimo de contribuições para ter direito ao benefício. O benefício por incapacidade exige <mark>12 contribuições</mark>, mas a carência é <mark>dispensada em acidente de qualquer natureza</mark> e em doenças graves da lista.</p>\n<p>Não confunda o <strong>benefício por incapacidade temporária</strong> (substitui a renda durante o afastamento) com o <strong>auxílio-acidente</strong> (indenização pela sequela que reduz a capacidade, sem impedir o trabalho).</p>", "mapa": ["Previdenciário", [["Segurados", ["Obrigatórios: empregado, doméstico, avulso, contribuinte individual, segurado especial", "Facultativo: maior de 16 anos sem atividade remunerada", "Servidor com regime próprio não pode ser facultativo (art. 201, §5º)", "Servidor com outra atividade no RGPS: obrigatório quanto a ela"]], ["Carência", ["Incapacidade temporária e permanente: 12 contribuições", "Aposentadoria programada: 180 contribuições", "Salário-maternidade: 10 contribuições para contribuinte individual e facultativo", "Dispensada: acidente de qualquer natureza, doença do trabalho, doenças graves da lista"]], ["Benefícios", ["Incapacidade temporária: mais de 15 dias de afastamento", "Auxílio-acidente: sequela que reduz a capacidade; não é pago ao contribuinte individual", "Aposentadoria programada: 65 anos (homem) e 62 (mulher), regra da EC 103", "Pensão por morte: cotas de 50% + 10% por dependente"]], ["Qualidade de segurado", ["Período de graça: até 12 meses após parar de contribuir", "Mais 12 meses se tiver mais de 120 contribuições", "Mais 12 meses se desempregado registrado"]]]], "peg": ["Acidente fora do trabalho também dispensa carência.", "Auxílio-acidente não é devido ao contribuinte individual.", "Afastamento longo não presume invalidez permanente."], "qs": [{"id": "prev-0", "p": "Rita, segurada empregada há 4 meses, quebrou a perna em acidente doméstico e ficará afastada por 60 dias. Ela:", "o": ["Não tem direito a benefício, pois não cumpriu a carência de 12 contribuições.", "Tem direito ao auxílio-acidente.", "Tem direito à aposentadoria por incapacidade permanente.", "Tem direito ao benefício por incapacidade temporária, pois a carência é dispensada em acidente de qualquer natureza."], "c": 3, "e": "Art. 26, II, da Lei 8.213/91: independe de carência o benefício por incapacidade em caso de acidente de qualquer natureza."}, {"id": "prev-1", "p": "Mário, desempregado, tem 50 anos e nunca exerceu atividade remunerada desde 2020. Quer contribuir para a Previdência. Ele pode filiar-se como:", "o": ["Segurado facultativo.", "Não pode se filiar enquanto estiver desempregado.", "Segurado especial.", "Segurado obrigatório, na categoria de contribuinte individual."], "c": 0, "e": "Art. 13 da Lei 8.213/91: é segurado facultativo o maior de 16 anos que se filia mediante contribuição, desde que não esteja exercendo atividade que o torne segurado obrigatório."}]}, {"id": "filo", "nome": "Filosofia do Direito", "lei": "Autores e correntes clássicas", "peso": 2, "texto": "<p>Filosofia vale 2 questões e assusta mais do que deveria. A FGV traz um <strong>trecho de um autor</strong> e pergunta qual ideia ele defende. Você não precisa ter lido as obras: precisa saber <mark>a ideia central de cada autor</mark>.</p>\n<p>Leia o enunciado procurando a palavra-chave: \"vontade geral\" é Rousseau; \"norma fundamental\" é Kelsen; \"imperativo categórico\" é Kant; \"justiça como equidade\" e \"véu da ignorância\" são Rawls; \"princípios x regras\" é Dworkin ou Alexy; \"o direito como integridade\" é Dworkin.</p>", "mapa": ["Filosofia do Direito", [["Correntes", ["Jusnaturalismo: direitos anteriores e superiores à lei", "Positivismo: separa validade e moral", "Realismo: direito é o que os tribunais decidem", "Pós-positivismo: princípios têm força normativa"]], ["Antigos e modernos", ["Aristóteles: justiça distributiva (proporcional) e corretiva (igualdade aritmética); equidade corrige a lei", "Hobbes: estado de natureza é guerra; o Leviatã garante a paz", "Locke: direitos naturais à vida, liberdade e propriedade", "Rousseau: vontade geral, lei geral e abstrata", "Kant: imperativo categórico, pessoa como fim e nunca meio"]], ["Século XX", ["Kelsen: teoria pura, norma fundamental, pirâmide normativa", "Hart: regras primárias e secundárias, regra de reconhecimento", "Rawls: véu da ignorância, princípios da liberdade e da diferença", "Dworkin: princípios, juiz Hércules, direito como integridade", "Alexy: princípios como mandados de otimização, ponderação", "Habermas: agir comunicativo, legitimidade pelo procedimento democrático"]]]], "peg": ["Vontade geral não é a vontade da maioria nem a soma das vontades.", "Para o positivismo clássico, lei injusta continua válida.", "Para Alexy, regras se aplicam por subsunção e princípios por ponderação."], "qs": [{"id": "filo-0", "p": "Segundo John Rawls, as pessoas escolheriam princípios justos se os definissem numa situação em que não soubessem sua posição social, talentos ou riqueza. Essa situação é chamada de:", "o": ["Véu da ignorância.", "Imperativo categórico.", "Estado de natureza.", "Norma fundamental."], "c": 0, "e": "Em Uma Teoria da Justiça, Rawls descreve a posição original, sob o véu da ignorância, em que se escolhem os princípios da justiça como equidade."}, {"id": "filo-1", "p": "Para Hans Kelsen, o fundamento de validade de todo o ordenamento jurídico é:", "o": ["A vontade geral do povo.", "O direito natural.", "A decisão dos tribunais.", "A norma fundamental (Grundnorm), pressuposta."], "c": 3, "e": "Na Teoria Pura do Direito, a validade de cada norma vem de uma norma superior, até a norma fundamental, pressuposta, que fecha o sistema."}]}, {"id": "dh", "nome": "Direitos Humanos", "lei": "CF, tratados internacionais e sistema interamericano", "peso": 2, "texto": "<p>Direitos Humanos cobra a <strong>hierarquia dos tratados</strong> e o funcionamento dos <strong>sistemas de proteção</strong>. Comece pela hierarquia: tratados de direitos humanos aprovados pelo rito do <mark>art. 5º, §3º</mark> valem como <mark>emenda constitucional</mark>; os demais tratados de direitos humanos são <mark>supralegais</mark> (acima da lei, abaixo da CF); tratados comuns têm força de lei ordinária.</p>\n<p>No sistema interamericano, a petição individual vai à <strong>Comissão</strong>, nunca direto à Corte. Só os Estados e a Comissão levam casos à <strong>Corte Interamericana</strong>.</p>", "mapa": ["Direitos Humanos", [["Hierarquia dos tratados", ["Rito do art. 5º, §3º: emenda constitucional", "Exemplos: Convenção de Nova York (pessoa com deficiência), Tratado de Marraqueche, Convenção contra o Racismo", "Demais de direitos humanos: supralegais (Pacto de São José)", "Prisão do depositário infiel: proibida (SV 25)", "Tratados comuns: lei ordinária"]], ["Sistema interamericano", ["Comissão (Washington): recebe petições de qualquer pessoa ou ONG", "Corte (San José): só Estados e Comissão acionam", "Esgotamento dos recursos internos e prazo de 6 meses", "Sentença da Corte é obrigatória para o Brasil"]], ["Sistema global", ["ONU: Declaração Universal de 1948 (não é tratado)", "Pactos de 1966: direitos civis e políticos; econômicos, sociais e culturais", "Comitês de monitoramento"]], ["Tribunal Penal Internacional", ["Estatuto de Roma", "Genocídio, crimes contra a humanidade, de guerra e de agressão", "Complementar às jurisdições nacionais", "Só crimes após a entrada em vigor", "Julga qualquer pessoa física, sem imunidade de cargo", "Admite prisão perpétua"]], ["Na Constituição", ["Federalização de graves violações: PGR pede ao STJ (art. 109, §5º)", "Brasil se submete ao TPI (art. 5º, §4º)", "Aplicação imediata dos direitos fundamentais (art. 5º, §1º)"]]]], "peg": ["Particular não leva caso direto à Corte Interamericana.", "O Pacto de São José é supralegal, não emenda constitucional.", "O incidente de deslocamento de competência é julgado pelo STJ, a pedido do PGR."], "qs": [{"id": "dh-0", "p": "Uma ONG brasileira pretende denunciar o Brasil por violação à Convenção Americana. Ela deve apresentar a petição:", "o": ["Diretamente à Corte Interamericana de Direitos Humanos.", "Ao Conselho de Segurança da ONU.", "À Comissão Interamericana de Direitos Humanos.", "Ao Tribunal Penal Internacional."], "c": 2, "e": "Art. 44 da Convenção Americana: qualquer pessoa, grupo ou ONG pode apresentar petições à Comissão. Só os Estados e a Comissão submetem casos à Corte (art. 61)."}, {"id": "dh-1", "p": "Diante de grave violação de direitos humanos, com risco de descumprimento de obrigações internacionais, o deslocamento da competência para a Justiça Federal pode ser pedido:", "o": ["Pelo Governador ao STJ.", "Pelo Procurador-Geral da República ao STJ.", "Pelo Ministro da Justiça ao STF.", "Pela vítima ao STF."], "c": 1, "e": "Art. 109, §5º, da CF: o Procurador-Geral da República pode suscitar, perante o STJ, o incidente de deslocamento de competência."}]}, {"id": "inter", "nome": "Direito Internacional", "lei": "LINDB, CF e Convenção de Viena sobre Tratados", "peso": 2, "texto": "<p>Internacional se divide em <strong>público</strong> (tratados, imunidades, nacionalidade) e <strong>privado</strong> (qual lei se aplica ao caso, LINDB, e homologação de sentença estrangeira).</p>\n<p>Na LINDB, o elemento que manda é quase sempre o <mark>domicílio</mark>: capacidade e direitos de família seguem a lei do domicílio; sucessão segue o domicílio do falecido. A exceção é o <mark>imóvel</mark>, regido pela lei do lugar onde está. Sentença estrangeira só vale no Brasil depois de <mark>homologada pelo STJ</mark>.</p>", "mapa": ["Internacional", [["Tratados", ["Presidente celebra (art. 84, VIII)", "Congresso aprova por decreto legislativo (art. 49, I), começando pela Câmara", "Presidente ratifica e promulga por decreto", "Denúncia: retirada do tratado", "Reservas: excluem cláusulas na adesão"]], ["LINDB", ["Personalidade, nome, capacidade e família: lei do domicílio (art. 7º)", "Regime de bens: domicílio dos nubentes ou primeiro domicílio conjugal", "Bens: lei do lugar onde estão (art. 8º)", "Obrigações: lei do país onde se constituírem (art. 9º)", "Sucessão: domicílio do falecido (art. 10)", "Imóvel no Brasil: competência exclusiva brasileira (art. 12, §1º)"]], ["Cooperação", ["Homologação de sentença estrangeira: STJ (art. 105, I, i)", "Exequatur de carta rogatória: STJ", "Extradição: STF", "Divórcio consensual simples estrangeiro: dispensa homologação"]], ["Imunidades", ["Estado estrangeiro em ato de gestão (ex.: trabalhista): sem imunidade de jurisdição", "Imunidade de execução: em regra mantida", "Diplomatas: Convenção de Viena de 1961"]]]], "peg": ["Lei aplicável à sucessão é a do domicílio, não a da nacionalidade.", "Homologação é no STJ; extradição é no STF.", "A apreciação de tratados começa pela Câmara, não pelo Senado."], "qs": [{"id": "inter-0", "p": "Uma sentença de divórcio litigioso proferida na Argentina, com partilha de bens, precisa produzir efeitos no Brasil. Ela deve ser homologada:", "o": ["Pelo STF.", "Por nenhum órgão, pois tem eficácia automática.", "Pelo STJ.", "Pelo juiz federal do domicílio do interessado."], "c": 2, "e": "Art. 105, I, i, da CF: compete ao STJ homologar sentenças estrangeiras. Só o divórcio consensual simples (sem partilha, guarda ou alimentos) dispensa homologação (CPC, art. 961, §5º)."}, {"id": "inter-1", "p": "Um estrangeiro domiciliado no Brasil morreu deixando bens aqui. Segundo a LINDB, a sucessão obedece, em regra, à lei:", "o": ["Do país em que o falecido era domiciliado.", "Do país onde estão os herdeiros.", "Sempre à lei brasileira, por ser a lei do foro.", "Do país de nacionalidade do falecido."], "c": 0, "e": "Art. 10 da LINDB: a sucessão obedece à lei do país em que era domiciliado o falecido. Há a ressalva de lei mais favorável ao cônjuge ou filhos brasileiros (art. 10, §1º)."}]}, {"id": "fin", "nome": "Direito Financeiro", "lei": "CF (arts. 163 a 169), Lei 4.320/64 e LRF (LC 101/00)", "peso": 2, "texto": "<p>Financeiro cobra as <strong>leis orçamentárias</strong> e a <strong>Lei de Responsabilidade Fiscal</strong>. Grave as três leis: o <mark>PPA</mark> (plano de 4 anos), a <mark>LDO</mark> (metas e prioridades do ano seguinte) e a <mark>LOA</mark> (o orçamento em si). Todas são de iniciativa do Executivo.</p>\n<p>Na LRF, os limites de despesa com pessoal são calculados sobre a receita corrente líquida: <mark>50% para a União</mark> e <mark>60% para Estados e Municípios</mark>. Empresa estatal não dependente fica fora desses limites.</p>", "mapa": ["Financeiro", [["Leis orçamentárias", ["PPA: 4 anos, iniciativa do Executivo", "LDO: metas, prioridades, orienta a LOA", "LOA: orçamento fiscal, de investimento das estatais e da seguridade", "Princípios: anualidade, universalidade, exclusividade, unidade", "Vedada a vinculação de receita de impostos, salvo exceções (saúde, educação...)"]], ["Despesa e receita", ["Despesa: empenho, /* ---------- armazenamento ---------- */
function blank(){return {v:1,sims:{},saves:[],packs:[],lastSim:null,lastAuto:null,modo:false}}
let S=blank();
function readStore(){try{const s=localStorage.getItem(KEY);if(s){const o=JSON.parse(s);if(o&&o.v===1)return Object.assign(blank(),o)}}catch(e){}return null}
const loaded=readStore(); if(loaded)S=loaded;
let storageOK=true;
function persist(){
  try{localStorage.setItem(KEY,JSON.stringify(S));storageOK=true;markSaved()}catch(e){storageOK=false;toast("Não foi possível salvar neste aparelho. Baixe um backup em Salvamentos.")}
}
function markSaved(){const el=document.getElementById("savedot");const d=new Date();el.textContent="Salvo "+d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});el.className="savedot on"}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().then(v=>{S._persist=!!v})}catch(e){}

function allSims(){return BUILTIN.concat(S.packs||[])}
function simById(id){return allSims().find(s=>s.id===id)}
function simState(id){if(!S.sims[id])S.sims[id]={lidos:{},resp:{},tentativa:1,tipo:"1"};return S.sims[id]}

/* ---------- utilidades ---------- */
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function safeHTML(html){const t=document.createElement("template");t.innerHTML=html;t.content.querySelectorAll("script,style,iframe,object,embed,link,meta,img,form").forEach(n=>n.remove());t.content.querySelectorAll("*").forEach(n=>{[...n.attributes].forEach(a=>{if(/^on/i.test(a.name)||/javascript:/i.test(a.value)||a.name==="style")n.removeAttribute(a.name)})});return t.innerHTML}
function fmtDate(ts){const d=new Date(ts);return d.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit",year:"numeric"})+" "+d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}
let toastT;function toast(m){const t=document.getElementById("toast");t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600)}
function cls(q,r){if(q.c===null)return"anul";const hit=r.a===q.c;return hit?(r.sure?"ok":"luck"):(r.sure?"trap":"bad")}
const LABEL={ok:"Sabia e acertou",luck:"Acertou no chute",bad:"Errou (estava chutando)",trap:"Errou com certeza",anul:"Anulada"};
const MSG={ok:"Domínio confirmado.",luck:"Acertou, mas no chute. Fica na lista de revisão.",bad:"Errou, mas você já sabia que estava em dúvida.",trap:"Atenção: você tinha certeza e errou. Revise este ponto primeiro.",anul:"Questão anulada pela banca. Não conta no placar."};
function resumo(sim,st){const n={ok:0,luck:0,bad:0,trap:0,tot:0,valid:0};sim.disc.forEach(d=>d.qs.forEach(q=>{if(q.c===null)return;n.valid++;const r=st.resp[q.id];if(!r)return;n.tot++;n[cls(q,r)]++}));return n}
function qNum(sim,q,tipo){if(q.n&&typeof q.n==="object")return q.n[tipo]||q.n["1"];return null}

/* ---------- pontos de salvamento ---------- */
function snapshot(simId,nome,auto){
  const sim=simById(simId),st=simState(simId),r=resumo(sim,st);
  S.saves.unshift({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),simId,nome,auto:!!auto,ts:Date.now(),
    snap:JSON.parse(JSON.stringify(st)),res:{tot:r.tot,valid:r.valid,ok:r.ok}});
  const autos=S.saves.filter(s=>s.auto);if(autos.length>15){const drop=new Set(autos.slice(15).map(s=>s.id));S.saves=S.saves.filter(s=>!drop.has(s.id))}
}
function autoDaily(){
  const today=new Date().toDateString();if(S.lastAuto===today)return;
  Object.keys(S.sims).forEach(id=>{const sim=simById(id);if(!sim)return;const st=S.sims[id];if(!Object.keys(st.resp).length)return;
    const last=S.saves.find(s=>s.simId===id);if(last&&JSON.stringify(last.snap.resp)===JSON.stringify(st.resp))return;
    snapshot(id,"Automático do dia",true)});
  S.lastAuto=today;persist();
}

    box.innerHTML=`<div class="inline-confirm">Remover este simulado e suas respostas? Os pontos de salvamento dele também somem.<button class="btn danger sm" type="button">Remover</button><button class="btn ghost sm" type="button">Cancelar</button></div>`;
    const [y,n]=box.querySelectorAll("button");n.onclick=()=>box.innerHTML="";y.onclick=()=>{const id=b.dataset.rm;S.packs=S.packs.filter(p=>p.id!==id);delete S.sims[id];S.saves=S.saves.filter(s=>s.simId!==id);persist();renderHome();toast("Simulado removido")}});

function validPack(p){return p&&typeof p.id==="string"&&typeof p.titulo==="string"&&Array.isArray(p.disc)&&p.disc.every(d=>d&&typeof d.nome==="string"&&Array.isArray(d.qs)&&d.qs.every(q=>q&&typeof q.id==="string"&&typeof q.p==="string"&&Array.isArray(q.o)&&q.o.length>=2&&(q.c===null||Number.isInteger(q.c))))}
function importPack(p){
  if(p&&p.kind==="caderno-oab-backup"){toast("Esse arquivo é um backup. Use Salvamentos → Restaurar backup.");return}
  if(!validPack(p)){toast("Arquivo inválido: não é um simulado do Caderno OAB.");return}
  if(BUILTIN.some(b=>b.id===p.id)){toast("Esse simulado já está no aplicativo.");return}
  p.imported=true;S.packs=(S.packs||[]).filter(x=>x.id!==p.id);S.packs.push(p);persist();renderHome();toast("Simulado adicionado: "+p.titulo);
}

function ordered(sim,d,tipo){const qs=d.qs.slice();if(sim.tipos)qs.sort((a,b)=>qNum(sim,a,tipo)-qNum(sim,b,tipo));return qs}
function renderTemas(sim,st){

    if(d.mapa){const t=document.createElement("div");t.className="blk-t";t.textContent="Mapa mental";sec.appendChild(t);sec.appendChild(mapa(sim,d));

      tools.querySelectorAll("button").forEach(b=>b.onclick=()=>sec.querySelectorAll(".mm details").forEach(x=>x.open=b.dataset.a==="1"));sec.appendChild(tools)}

function mapa(sim,d){

}
function qBlock(sim,st,d,q,i){
  const r=st.resp[q.id],el=document.createElement("div");el.className="q";el.id="q-"+q.id;
  const num=sim.tipos?qNum(sim,q,st.tipo||"1"):i+1;let pick=null,sure=null;
  el.innerHTML=`<span class="n">Questão ${num}${q.c===null?'<span class="anul">· anulada</span>':""}</span><p class="prompt">${esc(q.p)}</p>`;
  const opts=document.createElement("div");opts.className="opts";
  q.o.forEach((txt,j)=>{const id=`r-${q.id}-${j}`,l=document.createElement("label");l.className="opt";l.htmlFor=id;
    l.innerHTML=`<input type="radio" name="r-${q.id}" id="${id}" value="${j}"><span><strong>(${L[j]})</strong> ${esc(txt)}</span>`;const inp=l.querySelector("input");
    if(r){inp.disabled=true;if(j===r.a)inp.checked=true;if(q.c!==null){if(j===q.c)l.classList.add("right");else if(j===r.a)l.classList.add("wrong")}else if(j===r.a)l.classList.add("sel")}
    else inp.onchange=()=>{pick=j;opts.querySelectorAll(".opt").forEach(o=>o.classList.remove("sel"));l.classList.add("sel");upd()};
    opts.appendChild(l)});
  el.appendChild(opts);
  if(r){const c=cls(q,r),f=document.createElement("div");f.className="fb "+c;f.innerHTML=`<strong>${MSG[c]}</strong>${q.c===null?"":`Gabarito: <b>${L[q.c]}</b>. `}${esc(q.e||"")}`;el.appendChild(f);return el}
  const conf=document.createElement("div");conf.className="conf";
  conf.innerHTML=`<span class="lbl">Você sabe ou está chutando?</span><button type="button" class="segb" data-v="1" aria-pressed="false">Sei a resposta</button><button type="button" class="segb" data-v="0" aria-pressed="false">Estou chutando</button><button type="button" class="btn" disabled>Responder</button>`;
  const segs=conf.querySelectorAll(".segb"),go_=conf.querySelector(".btn");
  segs.forEach(b=>b.onclick=()=>{sure=b.dataset.v==="1";segs.forEach(x=>x.setAttribute("aria-pressed",x===b));upd()});
  function upd(){go_.disabled=!(pick!==null&&sure!==null)}
  go_.onclick=()=>{st.resp[q.id]={a:pick,sure,t:Date.now()};persist();el.replaceWith(qBlock(sim,st,d,q,i));score(sim,st)};
  el.appendChild(conf);return el;
}
function score(sim,st){
  const r=resumo(sim,st);["ok","luck","bad","trap"].forEach(k=>document.getElementById("s-"+k).textContent=r[k]);
  document.getElementById("s-tot").textContent=r.tot+"/"+r.valid;
  const tipo=st.tipo||"1";
  document.getElementById("idx").innerHTML=sim.disc.map(d=>{const v=d.qs.filter(q=>q.c!==null),done=v.filter(q=>st.resp[q.id]).length;return `<a href="#d-${d.id}" class="${done===v.length?"done":""}" data-j="d-${d.id}">${esc(d.nome)}<span class="pg">${done}/${v.length}</span></a>`}).join("");
  document.getElementById("bydisc").innerHTML=sim.disc.map(d=>{const v=d.qs.filter(q=>q.c!==null);let a=0,ok=0;v.forEach(q=>{const x=st.resp[q.id];if(!x)return;a++;if(cls(q,x)==="ok")ok++});return `<tr><td><a href="#d-${d.id}" data-j="d-${d.id}">${esc(d.nome)}</a></td><td class="num">${a}/${v.length}</td><td class="num">${ok}</td><td class="num">${a-ok}</td></tr>`}).join("");
  const rev=[];sim.disc.forEach(d=>d.qs.forEach((q,i)=>{const x=st.resp[q.id];if(!x||q.c===null)return;const c=cls(q,x);if(c!=="ok")rev.push({d,q,i,c})}));
  const o={trap:0,luck:1,bad:2};rev.sort((a,b)=>o[a.c]-o[b.c]);
  document.getElementById("rev").innerHTML=rev.length?`<ul>${rev.map(x=>`<li><strong>${LABEL[x.c]}</strong> · <a href="#q-${x.q.id}" data-j="q-${x.q.id}">${esc(x.d.nome)}, questão ${sim.tipos?qNum(sim,x.q,tipo):x.i+1}</a></li>`).join("")}</ul>`:`<p class="small muted">Nada para revisar ainda. Acertos no chute e erros aparecem aqui, começando pelos erros com certeza.</p>`;
  view.querySelectorAll("[data-j]").forEach(a=>a.onclick=e=>{e.preventDefault();document.getElementById(a.dataset.j)?.scrollIntoView({behavior:"smooth",block:"start"})});
}

/* ----- salvamentos ----- */
function renderSaves(){
  const sims=allSims();
  let h=`<h1>Salvamentos</h1><p class="lede">Suas respostas são salvas automaticamente a cada clique. Aqui ficam os pontos de restauração, como versões: crie um ponto, refaça o simulado e volte a qualquer versão quando quiser.</p>`;
  h+=`<div class="notice ${storageOK?"ok":"warn"}">${storageOK?"Salvamento automático funcionando neste aparelho.":"O salvamento neste aparelho falhou. Baixe um backup agora."} ${S._persist?"O armazenamento está protegido contra limpeza automática.":""}</div>`;
  h+=`<div class="card"><h2>Pontos de salvamento</h2><p class="sub">Restaurar um ponto troca as respostas atuais daquele simulado pelas do ponto. Antes disso, o estado atual é guardado como um novo ponto, então nada se perde.</p><div class="saves">`;
  if(!S.saves.length)h+=`<p class="small muted">Nenhum ponto ainda. No simulado, toque em <strong>Salvar ponto</strong>. Ao usar <strong>Refazer do zero</strong>, a tentativa anterior é guardada aqui automaticamente.</p>`;
  S.saves.forEach(s=>{const sim=sims.find(x=>x.id===s.simId);h+=`<div class="save"><div class="top"><span class="nm">${esc(s.nome)}${s.auto?'<span class="pill">automático</span>':""}</span><span class="when">${fmtDate(s.ts)}</span></div>
    <div class="small muted">${esc(sim?sim.titulo:"Simulado removido")} · ${s.res.tot}/${s.res.valid} respondidas · ${s.res.ok} com domínio</div>
    <div class="row">${sim?`<button class="btn ghost sm" type="button" data-rs="${s.id}">Restaurar</button>`:""}<button class="lnk" type="button" data-del="${s.id}">Apagar</button></div><div data-c="${s.id}"></div></div>`});
  h+=`</div></div>
  <div class="card"><h2>Backup</h2><p class="sub">O backup guarda tudo: respostas, tentativas, pontos e simulados adicionados. Use para trocar de celular ou se o navegador apagar os dados.</p>
    <div class="row"><button class="btn" id="bk-dl" type="button">Baixar backup</button><button class="btn ghost" id="bk-cp" type="button">Copiar backup como texto</button></div>
    <h2 style="margin-top:16px;font-size:16px">Restaurar backup</h2><p class="sub">Escolha o arquivo .json do backup ou cole o texto copiado. O estado atual é guardado antes.</p>
    <input type="file" id="bk-file" accept=".json,application/json">
    <div style="margin-top:10px"><label for="bk-txt" class="small muted">Ou cole o texto do backup</label><textarea id="bk-txt"></textarea><div class="row" style="margin-top:8px"><button class="btn ghost sm" id="bk-paste" type="button">Restaurar do texto</button></div></div>
    <div id="bk-c"></div></div>
  <p class="small muted">Caderno OAB · versão ${APP_VERSION}</p>`;
  view.innerHTML=h;
  view.querySelectorAll("[data-rs]").forEach(b=>b.onclick=()=>{const s=S.saves.find(x=>x.id===b.dataset.rs),box=view.querySelector(`[data-c="${s.id}"]`);
    box.innerHTML=`<div class="inline-confirm">Restaurar "${esc(s.nome)}"? O estado atual vira um ponto antes.<button class="btn sm" type="button">Restaurar</button><button class="btn ghost sm" type="button">Cancelar</button></div>`;
    const [y,n]=box.querySelectorAll("button");n.onclick=()=>box.innerHTML="";
    y.onclick=()=>{snapshot(s.simId,"Antes de restaurar “"+s.nome+"”",false);S.sims[s.simId]=JSON.parse(JSON.stringify(s.snap));persist();toast("Ponto restaurado");go("sim",s.simId)}});
  view.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{const id=b.dataset.del,box=view.querySelector(`[data-c="${id}"]`);
    box.innerHTML=`<div class="inline-confirm">Apagar este ponto de vez?<button class="btn danger sm" type="button">Apagar</button><button class="btn ghost sm" type="button">Cancelar</button></div>`;
    const [y,n]=box.querySelectorAll("button");n.onclick=()=>box.innerHTML="";y.onclick=()=>{S.saves=S.saves.filter(x=>x.id!==id);persist();renderSaves();toast("Ponto apagado")}});
  const payload=()=>JSON.stringify({kind:"caderno-oab-backup",app:APP_VERSION,ts:Date.now(),data:S});
  document.getElementById("bk-dl").onclick=()=>{try{const b=new Blob([payload()],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="caderno-oab-backup-"+new Date().toISOString().slice(0,10)+".json";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);toast("Backup baixado")}catch(e){toast("Não deu para baixar aqui. Use Copiar backup como texto.")}};
  document.getElementById("bk-cp").onclick=()=>{const t=payload(),ta=document.getElementById("bk-txt");
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(()=>toast("Backup copiado. Cole num lugar seguro, como suas notas."),()=>{ta.value=t;ta.select();toast("Texto selecionado: copie manualmente")});else{ta.value=t;ta.select();toast("Texto selecionado: copie manualmente")}};
  const restore=txt=>{let o;try{o=JSON.parse(txt)}catch(e){toast("Backup inválido.");return}
    if(!o||o.kind!=="caderno-oab-backup"||!o.data||o.data.v!==1){if(validPack(o)){importPack(o);return}toast("Backup inválido.");return}
    const box=document.getElementById("bk-c");box.innerHTML=`<div class="inline-confirm" style="margin-top:10px">Restaurar o backup de ${fmtDate(o.ts)}? O estado atual é guardado como ponto antes.<button class="btn sm" type="button">Restaurar</button><button class="btn ghost sm" type="button">Cancelar</button></div>`;
    const [y,n]=box.querySelectorAll("button");n.onclick=()=>box.innerHTML="";
    y.onclick=()=>{const before=JSON.parse(JSON.stringify(S));const nd=Object.assign(blank(),o.data);
      Object.keys(before.sims).forEach(id=>{const sim=simById(id);if(!sim)return;const st=before.sims[id],r=resumo(sim,st);nd.saves.unshift({id:"pre"+Date.now().toString(36)+id,simId:id,nome:"Antes de restaurar backup",auto:false,ts:Date.now(),snap:st,res:{tot:r.tot,valid:r.valid,ok:r.ok}})});
      S=nd;persist();renderSaves();toast("Backup restaurado")}};
  document.getElementById("bk-file").onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{restore(rd.result);e.target.value=""};rd.readAsText(f)};
  document.getElementById("bk-paste").onclick=()=>restore(document.getElementById("bk-txt").value.trim());
}

/* ---------- service worker (modo aplicativo) ---------- */
if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol)&&!/claude\.ai|claudeusercontent/.test(location.hostname)){
  navigator.serviceWorker.register("sw.js").then(reg=>{
    const ask=w=>{document.getElementById("upd").hidden=false;document.getElementById("upd-go").onclick=()=>w.postMessage("skip")};
    if(reg.waiting)ask(reg.waiting);
    reg.addEventListener("updatefound",()=>{const w=reg.installing;w&&w.addEventListener("statechange",()=>{if(w.state==="installed"&&navigator.serviceWorker.controller)ask(w)})});
  }).catch(()=>{});
  let reloaded=false;navigator.serviceWorker.addEventListener("controllerchange",()=>{if(reloaded)return;reloaded=true;location.reload()});
}

const ab=document.querySelector('.appbar');const setAbh=()=>document.documentElement.style.setProperty('--abh',(ab.offsetHeight+8)+'px');setAbh();addEventListener('resize',setAbh);
autoDaily();
if(S.lastSim&&simById(S.lastSim))go("sim",S.lastSim);else go("home");
document.getElementById("savedot").textContent=loaded?"Dados carregados":"";
</script>
