 que a autoridade se pronuncie."}, {"id": "q31", "n": {"1": 31, "2": 32, "3": 33, "4": 34}, "p": "Após obter a manifestação desfavorável em um processo administrativo em âmbito federal, Matheus interpôs, tempestivamente, o recurso cabível em face da decisão. Durante a tramitação do processo em grau recursal, o administrado percebeu que João da Silva, autoridade administrativa competente, delegou a decisão do recurso por ele interposto a Guilherme, agente público sem qualquer relação de hierarquia, com o argumento de que o último teria mais expertise na matéria discutida nos autos. Preocupado com eventuais reflexos da delegação realizada, Matheus procurou você para, na qualidade de advogado(a), prestar-lhe a adequada consultoria jurídica. Considerando a Lei nº 9.784/1999, que versa sobre o processo administrativo em âmbito federal, assinale a afirmativa que apresenta corretamente a sua orientação.", "o": ["Caso haja a anuência expressa de Guilherme, a delegação efetivada por João da Silva se compatibilizará com a ordem jurídica.", "A decisão de recurso administrativo não pode ser objeto de delegação, de forma que João da Silva agiu em contrariedade à legislação.", "Como Guilherme tem mais expertise na matéria discutida nos autos, seria cabível a avocação de competência, e não o ato de delegação.", "João da Silva poderia ter delegado a decisão do recurso administrativo a Guilherme, que dispõe de mais expertise na matéria discutida, de forma a prestigiar o princípio da eficiência na Administração Pública."], "c": 1, "e": "Art. 13, II, da Lei 9.784/99: a decisão de recursos administrativos não pode ser delegada."}, {"id": "q32", "n": {"1": 32, "2": 33, "3": 34, "4": 30}, "p": "O Governador do Estado Alfa, após a observância das formalidades legais, declarou a utilidade pública, por meio de decreto, do imóvel localizado à rua XYZ, de titularidade de João da Silva, visando à desapropriação. Irresignado com a situação posta e sem acreditar que, de fato, o poder público daria continuidade à desapropriação, o proprietário realizou, sem a concordância do expropriante, benfeitorias necessárias, úteis e voluptuárias no local. Contudo, ao perceber que, de fato, a área seria desapropriada, João da Silva procurou você para, na qualidade de advogado(a), prestar-lhe a devida orientação jurídica. Nesse cenário, considerando as disposições do Decreto-Lei nº 3.365/1941, que versa sobre as desapropriações por utilidade pública, assinale a afirmativa correta.", "o": ["As benfeitorias necessárias e úteis serão objeto de indenização pelo poder público, mas não as benfeitorias voluptuárias.", "O Estado Alfa deverá indenizar todas as benfeitorias realizadas por João da Silva, sob pena de enriquecimento sem causa.", "João da Silva tem direito à indenização pelas benfeitorias necessárias que foram realizadas no imóvel, mas não pelas benfeitorias úteis e voluptuárias.", "Como as benfeitorias foram realizadas por João da Silva, após a declaração formal de utilidade pública do imóvel, o Estado Alfa não será obrigado a indenizá-las."], "c": 2, "e": "Art. 26, §1º, do DL 3.365/41: após a declaração de utilidade pública, só se indenizam as benfeitorias necessárias e as úteis autorizadas. Como não houve autorização, só as necessárias."}, {"id": "q33", "n": {"1": 33, "2": 34, "3": 30, "4": 31}, "p": "A autoridade competente do pequeno Município Alfa entrou em contato com o empresário exclusivo da cantora Lúcia, consagrada tanto pela crítica especializada quanto pela opinião pública, com a intenção de contratá-la para realizar uma apresentação no show de celebração do aniversário do referido ente federativo, festa que é bastante famosa na localidade, atraindo muitos turistas. Em razão disso, o empresário de Lúcia buscou sua assessoria jurídica, para obter esclarecimentos acerca da viabilidade da contratação almejada sem a realização de licitação, salientando que o cachê da cantora é de R$ 200.000,00. Sobre o caso narrado, à luz do disposto na Lei nº 14.133/2021, assinale a afirmativa correta.", "o": ["A licitação é dispensável para a contratação de Lúcia, considerando o valor do cachê que será por ela cobrado na situação descrita.", "A validade da contratação de Lúcia pelo Município Alfa depende da realização de licitação na modalidade diálogo competitivo.", "A contratação de Lúcia caracteriza hipótese de inexigibilidade de licitação, em decorrência da inviabilidade de competição em tais circunstâncias.", "O Município Alfa apenas poderia realizar a contratação direta de Lúcia, mediante dispensa de licitação, após a apresentação de três orçamentos de artistas de mesma envergadura."], "c": 2, "e": "Art. 74, II, da Lei 14.133/21: a contratação de artista consagrado, por meio de empresário exclusivo, é inexigibilidade de licitação, por inviabilidade de competição."}, {"id": "q34", "n": {"1": 34, "2": 30, "3": 31, "4": 32}, "p": "Após o regular processo licitatório, o Estado Alfa e a sociedade empresária Beta celebraram contrato administrativo visando à prestação de determinado serviço público à coletividade em geral. No curso da avença, contudo, o poder público aventou a possibilidade de, mediante decreto do Chefe do Poder Executivo e por motivo de interesse público, retomar o serviço, por meio do instituto da encampação. Irresignado, o diretor executivo da entidade privada procurou você para, na qualidade de advogado(a), prestar-lhe a devida consultoria jurídica. Nesse cenário, considerando as disposições da Lei nº 8.987/1995, que dispõe sobre o regime de concessão e permissão da prestação de serviços públicos, assinale a opção que apresenta, corretamente, a orientação jurídica prestada.", "o": ["A retomada do serviço público por parte do Estado Alfa, com base no instituto da encampação, dispensa prévio pagamento de indenização à sociedade empresária Beta.", "O interesse público na retomada do serviço por parte do Estado Alfa legitima a caducidade do contrato administrativo, não sendo caso de aplicabilidade do instituto da encampação.", "Inexistindo inadimplemento contratual imputado à sociedade empresária Beta, é vedado ao poder público retomar o serviço durante o prazo da concessão, ainda que se alegue a existência de motivo de interesse público.", "Para que o Estado Alfa possa, legitimamente, invocar o instituto da encampação, é necessário que esteja presente motivo de interesse público, sem o prejuízo da edição de lei autorizativa específica e de prévio pagamento de indenização à sociedade empresária Beta."], "c": 3, "e": "Art. 37 da Lei 8.987/95: a encampação exige interesse público, lei autorizativa específica e prévio pagamento da indenização."}]}, {"id": "amb", "nome": "Direito Ambiental", "lei": "Competência e responsabilidade penal", "peso": 2, "texto": "<p><strong>Estudo prévio de impacto ambiental (EIA).</strong> A CF exige EIA para obra ou atividade <mark>potencialmente causadora de significativa degradação</mark> do meio ambiente <span class=\"art\">art. 225, §1º, IV</span>. Proteção ambiental é competência legislativa <strong>concorrente</strong> <span class=\"art\">art. 24, VI</span>: os Estados podem suplementar, mas <mark>não podem afastar a exigência constitucional</mark> nem reduzir a proteção fixada nas normas gerais. O STF considera inconstitucionais leis estaduais que dispensam o EIA nesses casos.</p>\n<p><strong>Responsabilidade penal da pessoa jurídica.</strong> A CF admite sanções penais contra pessoas jurídicas por condutas lesivas ao meio ambiente <span class=\"art\">art. 225, §3º</span>. A pessoa jurídica responde quando a infração é cometida <mark>por decisão de seu representante legal</mark> ou contratual, ou de seu órgão colegiado, <mark>no interesse ou benefício</mark> da entidade <span class=\"art\">Lei 9.605/98, art. 3º</span>.</p>\n<p>A responsabilidade da pessoa jurídica <mark>não exclui a das pessoas físicas</mark> autoras, coautoras ou partícipes <span class=\"art\">art. 3º, parágrafo único</span>. Não é subsidiária nem objetiva, e o STF admite a punição da empresa mesmo sem identificar a pessoa física.</p>", "qs": [{"id": "q35", "n": {"1": 35, "2": 36, "3": 36, "4": 35}, "p": "O Estado Ômega editou uma lei para dispensar a realização de estudo prévio de impacto ambiental para determinada atividade empresarial, sendo certo que a Resolução Conama nº 237/1997 considera tal atividade como potencialmente lesiva ao meio ambiente, de modo que seria necessária a realização do mencionado estudo no âmbito dessa última norma. A sociedade empresária Cautelosa, que se dedica ao exercício dessa atividade, consultou você, como advogado(a), acerca da constitucionalidade da dispensa instituída pela lei estadual. Diante dessa situação hipotética, sobre a lei editada pelo Estado Ômega, assinale a afirmativa correta.", "o": ["É constitucional, pois compete privativamente aos estados legislar sobre estudo prévio de impacto ambiental.", "É inconstitucional, na medida em que as normas editadas pelo Conama são hierarquicamente superiores as leis estaduais.", "É inconstitucional, pois os estados não têm competência para dispensar a realização de estudo de impacto ambiental na situação descrita.", "É constitucional, considerando que a lei estadual deve prevalecer sobre os atos normativos editados por órgãos administrativos, tais como o Conama."], "c": 2, "e": "Os estados não podem dispensar o EIA de atividade potencialmente causadora de significativa degradação, exigido pelo art. 225, §1º, IV, da CF."}, {"id": "q36", "n": {"1": 36, "2": 35, "3": 35, "4": 36}, "p": "Após a divulgação na imprensa de evento caracterizador de grave dano ao meio ambiente, ocasionado durante o desenvolvimento de atividade econômica pela sociedade empresária XYZ, a autoridade policial, com atribuição para a apuração do caso, emitiu uma nota pública, afirmando que existiriam elementos informativos robustos que apontariam para a prática de crime ambiental. Dessa forma, João, representante legal da entidade privada e membro do seu órgão colegiado, preocupado com potenciais consequências criminais que poderiam decorrer do acontecimento, entrou em contato com você, para, na qualidade de advogado(a), orientá-lo sobre a responsabilidade penal ambiental. Registre-se que o delito foi praticado por decisão de João, representante legal da entidade privada, em benefício desta. Sobre a responsabilidade penal ambiental na hipótese narrada, assinale a afirmativa correta.", "o": ["A sociedade empresária XYZ e João, na qualidade de representante legal da entidade, podem responder objetivamente, na esfera penal, pela conduta praticada.", "A responsabilização penal da sociedade empresária XYZ tem natureza subsidiária, caso não seja possível identificar a pessoa natural que, efetivamente, deu causa à conduta penalmente proibida.", "A sociedade empresária XYZ não poderá ser responsabilizada na esfera penal, por ausência de previsão constitucional e legal, mas nada impede que João, na qualidade de representante legal da entidade, responda, criminalmente, pela conduta perpetrada.", "A responsabilização penal da sociedade empresária XYZ é, juridicamente, cabível, pois a infração penal foi cometida por decisão de João, seu representante legal, em benefício desta, o que não exclui a responsabilidade da pessoa natural, autora ou partícipe do mesmo fato."], "c": 3, "e": "Art. 3º da Lei 9.605/98: a pessoa jurídica responde penalmente quando a infração é cometida por decisão de seu representante legal em seu benefício, sem excluir a responsabilidade da pessoa física."}]}, {"id": "civil", "nome": "Direito Civil", "lei": "Código Civil, LGPD e STF", "peso": 6, "texto": "<p><strong>Alimentos avoengos.</strong> A obrigação dos avós é <mark>subsidiária e complementar</mark> à dos pais: surge quando o genitor não pode prestar alimentos ou não é localizado <span class=\"art\">CC, arts. 1.696 e 1.698</span>; <span class=\"art\">Súmula 596 STJ</span>. Não depende de declaração de ausência nem de suspensão do poder familiar.</p>\n<p><strong>Responsabilidade por atos de empregados.</strong> O empregador responde pelos atos de seus empregados no exercício do trabalho <span class=\"art\">art. 932, III</span>, de forma <mark>objetiva</mark> <span class=\"art\">art. 933</span>. Desobedecer a ordens internas não rompe o nexo funcional.</p>\n<p><strong>Desapropriação judicial privada (posse-trabalho).</strong> O proprietário pode ser privado do imóvel se ele consistir em <mark>extensa área</mark>, na posse ininterrupta e de boa-fé, por <mark>mais de cinco anos</mark>, de considerável número de pessoas que nela realizaram obras de relevante interesse social e econômico <span class=\"art\">art. 1.228, §4º</span>. O juiz fixa <mark>justa indenização</mark>, e a sentença, após o pagamento, vale como título para registro em nome dos possuidores <span class=\"art\">§5º</span>.</p>\n<p><strong>LGPD.</strong> O consentimento é apenas uma das <mark>bases legais</mark> de tratamento. Outras: cumprimento de obrigação legal ou regulatória, exercício regular de direitos em processo, <mark>legítimo interesse</mark> do controlador, proteção do crédito, entre outras <span class=\"art\">Lei 13.709/18, art. 7º</span>.</p>\n<p><strong>Direito de imagem.</strong> O uso da imagem para fins comerciais <mark>exige autorização</mark>, nos limites dados <span class=\"art\">CC, art. 20</span>. Uso fora do prazo ou da finalidade autorizada gera dano moral <mark>independentemente de prova do prejuízo</mark> <span class=\"art\">Súmula 403 STJ</span>.</p>\n<p><strong>Multiparentalidade.</strong> A paternidade socioafetiva, declarada ou não em registro, <mark>não impede o reconhecimento do vínculo biológico</mark>, com os efeitos jurídicos próprios de ambos <span class=\"art\">STF, Tema 622</span>.</p>", "qs": [{"id": "q37", "n": {"1": 37, "2": 40, "3": 38, "4": 41}, "p": "Joana, criança, foi abandonada pelo pai, que nunca prestou qualquer assistência financeira. Sua mãe, apesar de trabalhar, não consegue prover sozinha as necessidades básicas da filha. Diante dessa situação, a mãe de Joana ingressou com uma ação contra os avós paternos, requerendo o pagamento de pensão alimentícia, uma vez que o pai está em local incerto e não sabido. Citados na ação, os avós paternos consultaram você, como advogado(a), alegando que eles não têm qualquer obrigação de prestar alimentos e que cabe à mãe localizar o genitor para que ele arque com as despesas. Diante da situação e da legislação vigente, assinale a opção que indica, corretamente, a orientação jurídica que você prestou.", "o": ["Os avós paternos só poderão ser responsabilizados pelo pagamento de alimentos a Joana se houver a suspensão do poder familiar do genitor.", "A mãe de Joana deve apresentar sentença declaratória de ausência do genitor, como requisito indispensável para a determinação da obrigação dos avós.", "Os avós paternos têm a obrigação de prestar alimentos à Joana, sendo a responsabilidade subsidiária à do pai, que está em local desconhecido e sem possibilidade de ser localizado.", "Como a obrigação dos avós é subsidiária e excepcional, eventual dever de prestar alimentos à neta só será devido após sentença judicial transitada em julgado determinando essa obrigação."], "c": 2, "e": "Arts. 1.696 e 1.698 do CC e Súmula 596 do STJ: os avós respondem de forma subsidiária e complementar quando o pai não cumpre a obrigação, como no caso de genitor não localizado."}, {"id": "q38", "n": {"1": 38, "2": 41, "3": 39, "4": 42}, "p": "Em um domingo à tarde, o porteiro do Condomínio Residencial Tempo de Verão, localizado no município de João Pessoa, PB, ausentou-se da portaria durante o seu horário de trabalho por aproximadamente 60 minutos, sem qualquer autorização ou justificativa. Durante esse período, um indivíduo teve acesso ao edifício e furtou diversos bens do apartamento da moradora Mary Cassatt. A investigação revelou que o porteiro deixou o posto para tratar de assuntos pessoais nas imediações, em claro descumprimento de suas obrigações contratuais e das normas internas do condomínio. Mary ajuizou ação de indenização por danos materiais contra o condomínio, alegando falha na prestação do serviço de vigilância. Em sua defesa, o condomínio sustentou que não poderia ser responsabilizado, pois o empregado teria agido dolosa e unilateralmente, em desobediência as instruções da administração. Sobre a hipótese narrada, com base no Código Civil brasileiro, assinale a afirmativa correta.", "o": ["O condomínio responde objetivamente pelos atos ilícitos praticados por seus empregados no exercício da função, ainda que tenha havido descumprimento de normas internas.", "O condomínio responde subjetivamente pelos atos de seus colaboradores, sendo necessário que Mary comprove a culpa da administração para obter êxito.", "A responsabilidade do condomínio é excluída diante da culpa exclusiva do porteiro, visto que sua conduta não guarda nexo funcional com a atividade desempenhada.", "A responsabilidade recai exclusivamente sobre o porteiro, pois agiu dolosamente, contrariando normas internas expressas e ordens do síndico."], "c": 0, "e": "Arts. 932, III, e 933 do CC: o empregador responde objetivamente pelos atos dos empregados no exercício da função, mesmo que tenham descumprido normas internas."}, {"id": "q39", "n": {"1": 39, "2": 42, "3": 37, "4": 40}, "p": "A sociedade empresária XYZ Comércio S.A. ajuizou ação reivindicatória em face de uma comunidade formada por cerca de 80 famílias que, há aproximadamente 8 anos, ocupa uma área urbana de grande extensão de sua propriedade, regularmente registrada no cartório de imóveis. No curso do processo, restou comprovado que a ocupação se deu de forma contínua, pacífica e de boa-fé, tendo os possuidores realizado diversas benfeitorias, inclusive a construção de moradias, a instalação de rede informal de abastecimento de água e a organização de atividades econômicas locais. O laudo pericial indicou que a área passou a desempenhar relevante função social, atendendo a interesses econômicos e sociais expressivos. Considerando o disposto no Código Civil brasileiro, assinale a afirmativa correta.", "o": ["O pedido reivindicatório da sociedade empresária XYZ deve ser julgado procedente, assegurado o direito de retenção pelas benfeitorias necessárias e úteis.", "Comprovada a titularidade da sociedade empresária XYZ, o pedido reivindicatório deve ser julgado procedente, sendo irrelevante a consolidação fática da posse.", "A perda da propriedade com fundamento na função social depende de prévia desapropriação pelo Poder Executivo, não podendo ser declarada em ação reivindicatória.", "O Juiz poderá privar a sociedade empresária XYZ da propriedade do bem, mediante justa indenização, valendo a sentença, após o pagamento, como título para registro em nome dos possuidores."], "c": 3, "e": "Art. 1.228, §§4º e 5º, do CC: o juiz pode privar o proprietário da área, mediante justa indenização, valendo a sentença, após o pagamento, como título para registro em nome dos possuidores."}, {"id": "q40", "n": {"1": 40, "2": 39, "3": 41, "4": 38}, "p": "Uma startup de tecnologia desenvolveu um aplicativo de monitoramento dos hábitos de consumo digital. Para o funcionamento do serviço, o aplicativo coleta dados pessoais dos usuários, incluindo histórico de navegação, preferências de consumo e localização aproximada. No momento do cadastro, o aplicativo solicitou a autorização para o tratamento desses dados. Após algum tempo, a startup passou a utilizar parte dessas informações para a análise estatística interna e para a melhoria da segurança do sistema, sem solicitar novo consentimento dos usuários. Além disso, em determinada situação, a empresa compartilhou dados com autoridades públicas para o cumprimento de ordem judicial relacionada à investigação criminal. Considerando as bases legais para o tratamento de dados pessoais previstas na legislação brasileira, assinale a afirmativa correta.", "o": ["O tratamento de dados pessoais pode ocorrer com base em diferentes fundamentos jurídicos previstos na legislação, incluindo consentimento, cumprimento de obrigação legal e interesse legítimo do controlador.", "O tratamento de dados pessoais somente pode ocorrer mediante consentimento expresso do titular, não sendo admitidas outras bases legais.", "A empresa somente poderia tratar os dados para finalidades estatísticas ou de segurança se obtivesse um novo consentimento específico dos titulares, não havendo outra base legal aplicável.", "O compartilhamento de dados pessoais com autoridades públicas depende sempre de consentimento prévio do titular."], "c": 0, "e": "Art. 7º da LGPD: há várias bases legais além do consentimento, como cumprimento de obrigação legal e legítimo interesse do controlador."}, {"id": "q41", "n": {"1": 41, "2": 38, "3": 42, "4": 37}, "p": "Carla, atriz iniciante, participou de uma campanha publicitária para determinada marca de roupas, autorizando expressamente o uso de sua imagem em redes sociais da contratante por seis meses. Encerrado o prazo contratual, a imagem de Carla continuou sendo utilizada em novas campanhas publicitárias, inclusive vinculando sua fotografia a produtos que não existiam à época da autorização inicial. Ao tomar conhecimento, Carla procurou assessoria jurídica especializada para orientá-la sobre a possibilidade de exigir a cessação da utilização de sua imagem, bem como a reparação pelos danos suportados. Assinale a opção que apresenta, à luz do Código Civil e da jurisprudência consolidada do Superior Tribunal de Justiça, a orientação jurídica correta.", "o": ["A utilização da imagem de Carla após o prazo inicialmente autorizado é lícita, pois a autorização para uso de imagem possui natureza irretratável.", "A utilização da imagem após o prazo contratual apenas gera responsabilidade civil se Carla comprovar prejuízo econômico direto decorrente da divulgação.", "A utilização da imagem após o prazo autorizado não configura ilícito, pois a empresa possui direito de exploração econômica da campanha publicitária produzida.", "A utilização da imagem de Carla após o término da autorização constitui violação a direito da personalidade, sendo cabível a cessação da divulgação e eventual indenização por danos."], "c": 3, "e": "Art. 20 do CC e Súmula 403 do STJ: o uso da imagem além do prazo e da finalidade autorizados viola direito da personalidade e gera indenização independentemente de prova de prejuízo."}, {"id": "q42", "n": {"1": 42, "2": 37, "3": 40, "4": 39}, "p": "Carolina nasceu durante o casamento de Márcia, sua mãe, com Paulo, que a registrou como filha e exerceu, por mais de 20 anos, todas as funções inerentes à paternidade, mantendo com ela sólida relação socioafetiva. Anos depois, Carolina descobriu sua origem biológica e ajuizou ação de investigação de paternidade em face de Roberto, que reconheceu espontaneamente ser seu pai biológico. No curso do processo, ficou demonstrado que Carolina sempre preservou fortes vínculos afetivos com Paulo e manifestou expressamente o desejo de manter o vínculo jurídico já existente, ao mesmo tempo que pretendia ver reconhecida sua ascendência biológica. Após o reconhecimento judicial da paternidade biológica, Roberto sustentou que o vínculo de filiação anteriormente existente com Paulo deveria ser automaticamente desconstituído, afirmando ser juridicamente impossível a coexistência de duas paternidades. Paulo, por sua vez, requereu a manutenção do vínculo socioafetivo já consolidado. Sobre o caso hipotético narrado, à luz da Constituição Federal, do Código Civil e da jurisprudência do Supremo Tribunal Federal, assinale a afirmativa correta.", "o": ["O reconhecimento da paternidade biológica não impede a manutenção da paternidade socioafetiva anteriormente constituída, sendo possível a coexistência de ambos os vínculos jurídicos de filiação, com a produção dos respectivos efeitos pessoais e patrimoniais.", "O reconhecimento da paternidade biológica impede a desconstituição do vínculo socioafetivo apenas para fins de alimentos e convivência familiar, permanecendo vedada a produção de efeitos sucessórios em relação ao pai socioafetivo.", "O reconhecimento da paternidade biológica somente poderá coexistir com a paternidade socioafetiva se houver concordância expressa dos dois pais, por se tratar de situação excepcional que depende da manifestação de vontade de todos os envolvidos.", "O reconhecimento da paternidade biológica torna incompatível a manutenção da paternidade socioafetiva anteriormente estabelecida, devendo prevalecer o vínculo biológico, por constituir a verdadeira origem da filiação."], "c": 0, "e": "Tema 622 do STF: a paternidade socioafetiva não impede o reconhecimento da biológica, com coexistência dos vínculos e todos os efeitos, inclusive patrimoniais."}]}, {"id": "eca", "nome": "Estatuto da Criança e do Adolescente", "lei": "Lei 8.069/90", "peso": 2, "texto": "<p><strong>Convivência com pais presos.</strong> É garantida a convivência da criança e do adolescente com a mãe ou o pai privado de liberdade, por meio de <mark>visitas periódicas promovidas pelo responsável</mark> ou, nas hipóteses de acolhimento institucional, <mark>pela entidade responsável</mark>, <mark>independentemente de autorização judicial</mark> <span class=\"art\">art. 19, §4º</span>.</p>\n<p><strong>Obrigação de reparar o dano.</strong> Em ato infracional com reflexos patrimoniais, o juiz pode determinar que o adolescente restitua a coisa, ressarça o dano ou compense o prejuízo da vítima <span class=\"art\">art. 116</span>. Havendo <mark>manifesta impossibilidade</mark>, a medida <mark>poderá ser substituída por outra adequada</mark> <span class=\"art\">art. 116, parágrafo único</span>. Não se converte em internação nem extingue o processo.</p>", "qs": [{"id": "q43", "n": {"1": 43, "2": 44, "3": 43, "4": 44}, "p": "Herminda, 30 anos, foi presa em flagrante pela prática do crime de homicídio descrito no Art. 121 do Código Penal. De acordo com o inquérito, Herminda planejou e executou a morte de sua vizinha, antiga desafeta, por meros problemas de convivência. No momento da prisão, policiais militares perceberam que o filho de Herminda, Gabriel, de 9 anos, estava em casa sozinho. Foi verificado que Gabriel não tinha com quem ficar, já que o pai é desconhecido e sua única referência é a mãe, agora presa. Os policiais acionaram o Conselho Tutelar que, regularmente, aplicou a medida protetiva de acolhimento institucional à criança, com posterior comunicado ao Juízo da Infância responsável. Em audiência de custódia, a prisão de Herminda foi convertida em preventiva e ela foi levada ao presídio feminino mais próximo de sua residência. Passados dois meses, Gabriel, ainda acolhido, manifestou reiteradamente a vontade de ter contato com sua mãe, mas a entidade responsável pelo acolhimento não sabe como proceder no caso concreto. Assim, Fábio, dirigente da entidade, procurou você, como advogado(a), para que lhe preste assessoria jurídica, especificamente, para esse caso. Diante desse cenário, assinale a afirmativa correta.", "o": ["Considerando a gravidade do crime cometido, bem como a prisão preventiva decretada, Gabriel não poderá ter contato com sua genitora.", "É preciso ingressar com pedido de alvará judicial ao Juízo Criminal competente para o julgamento de Herminda, para que este autorize a visita de Gabriel à sua mãe.", "É preciso ingressar com pedido de alvará judicial ao Juízo da Infância para que a entidade responsável pelo acolhimento institucional promova a visita de Gabriel à sua mãe, que está privada de liberdade.", "É garantida a convivência da criança com a mãe privada de liberdade, por meio de visitas periódicas promovidas pela entidade responsável pelo acolhimento institucional, independentemente de autorização judicial."], "c": 3, "e": "Art. 19, §4º do ECA: a convivência com a mãe privada de liberdade é garantida por visitas promovidas pela entidade de acolhimento, independentemente de autorização judicial."}, {"id": "q44", "n": {"1": 44, "2": 43, "3": 44, "4": 43}, "p": "Ricardo, de 14 anos, foi apreendido em flagrante, logo após subtrair três peças de picanha e duas de alcatra bovina de um supermercado. Instaurado o procedimento de apuração de ato infracional, que transcorreu regularmente, as testemunhas confirmaram os fatos e Ricardo confessou a subtração. Em sentença, o Juízo da Infância decidiu que os fatos estavam comprovados e aplicou a medida socioeducativa de obrigação de reparar o dano. Foi estipulada, de acordo com o valor de mercado e o peso dos alimentos, a quantia de R$ 500,00 para o ressarcimento do dano causado. Todavia, como Ricardo não conseguiu honrar com o valor fixado judicialmente, tanto ele quanto seus responsáveis procuraram você, como advogado(a), para ter sua assistência jurídica. Sobre a situação narrada, assinale a afirmativa correta.", "o": ["A impossibilidade de pagamento faz com que a medida se converta em internação.", "Diante da manifesta impossibilidade de pagamento, a medida de obrigação de reparar o dano pode ser substituída por outra adequada.", "A impossibilidade de pagamento, devidamente comprovada, leva à extinção do processo, já que a medida é educativa e não punitiva.", "A impossibilidade de pagamento acarreta a suspensão do processo até os 21 anos de Ricardo, mas, caso haja melhora na condição financeira, o valor deve ser honrado."], "c": 1, "e": "Art. 116, parágrafo único, do ECA: havendo manifesta impossibilidade, a obrigação de reparar o dano pode ser substituída por outra medida adequada."}]}, {"id": "cdc", "nome": "Direito do Consumidor", "lei": "CDC", "peso": 2, "texto": "<p><strong>Boa-fé objetiva e adimplemento substancial.</strong> A boa-fé objetiva é princípio da Política Nacional das Relações de Consumo <span class=\"art\">art. 4º, III</span>. Pela teoria do adimplemento substancial, quando o devedor cumpriu <mark>quase toda a obrigação</mark>, o credor não pode resolver o contrato pelo inadimplemento mínimo; deve cobrar o saldo. Também são nulas as cláusulas que impõem perda total das prestações pagas <span class=\"art\">art. 53</span>.</p>\n<p><strong>Vício de quantidade.</strong> Quando o conteúdo líquido for inferior ao indicado, o <mark>consumidor escolhe</mark>, alternativamente e à sua escolha <span class=\"art\">art. 19</span>:</p>\n<ul>\n<li>abatimento proporcional do preço;</li>\n<li>complementação do peso ou da medida;</li>\n<li>substituição do produto por outro da mesma espécie, marca ou modelo, sem os vícios;</li>\n<li>restituição imediata da quantia paga, corrigida, sem prejuízo de perdas e danos.</li>\n</ul>\n<p>Diferente do vício de qualidade (art. 18), aqui <mark>não há prazo de 30 dias</mark> para o fornecedor sanar o vício: a escolha é imediata e do consumidor.</p>", "qs": [{"id": "q45", "n": {"1": 45, "2": 46, "3": 46, "4": 45}, "p": "A Associação dos Hotéis do Litoral ofereceu um serviço por meio do qual, pagando 24 parcelas mensais de R$ 250,00, após dois anos, o consumidor ganharia sete diárias para aproveitar em quaisquer dos hotéis associados. Marina aderiu ao serviço. Porém, por esquecimento, deixou de pagar a 24ª parcela, apesar de ter realizado, pontualmente, o pagamento de todas as demais. Ao entrar em contato com a associação para oferecer o pagamento da parcela em aberto e solicitar as reservas, foi informada de que havia perdido o direito às diárias, e que o contrato estava considerado resolvido, ante o não pagamento da última parcela. Sobre o caso narrado, segundo os princípios aplicáveis ao Direito do Consumidor, assinale a afirmativa correta.", "o": ["Com base no princípio da boa-fé objetiva e na teoria do adimplemento substancial, Marina pode insistir na manutenção do direito às diárias.", "Com base no princípio da vulnerabilidade do consumidor e na vedação do enriquecimento sem causa, resta a Marina apenas pedir o reembolso das parcelas pagas.", "Com base no princípio da informação e na vedação do enriquecimento sem causa, resta a Marina apenas pedir que a regra passe a ser divulgada com mais clareza.", "Com base no princípio da informação e na vedação do enriquecimento sem causa, resta a Marina pedir que a regra passe a ser divulgada com mais clareza, bem como pedir o reembolso das parcelas pagas."], "c": 0, "e": "Pela boa-fé objetiva e pela teoria do adimplemento substancial, o não pagamento de 1 de 24 parcelas não autoriza a resolução do contrato. Marina pode pagar a parcela e exigir as diárias."}, {"id": "q46", "n": {"1": 46, "2": 45, "3": 45, "4": 46}, "p": "Ana encomendou 2 litros de sorvete de cupuaçu para o seu almoço de aniversário diretamente da fábrica de sorvete Gelado Ltda. Ao receber a encomenda, percebeu que o pote estava leve e, ao questionar o entregador, esse lhe disse que o sabor estava sendo muito pedido e, aquela hora, só restava pouco mais de 1 (um) litro no estoque, razão pela qual estava autorizado a abater o preço. Ana informou que o problema não era o preço, mas sim a quantidade de sobremesa para os convidados. Assistindo ao diálogo, Rita, advogada, ofereceu auxílio jurídico para Ana, que insistia nos 2 litros de sorvete. Diante disso, quanto à orientação a ser prestada por Rita, assinale a afirmativa correta.", "o": ["Ana deve permitir que o fabricante apresente outra forma de solução para o problema.", "Ana deve aceitar o abatimento do preço, ante a opção exercida pelo preposto do fabricante.", "Ana deve ficar com o pote entregue e nada pagar, ante a alegação de que não há mais o produto.", "Ana deve optar entre abater o preço, pedir a complementação ou a substituição do produto ou, ainda, o desfazimento da compra."], "c": 3, "e": "Art. 19 do CDC: no vício de quantidade, cabe ao consumidor escolher entre abatimento, complementação, substituição ou restituição."}]}, {"id": "emp", "nome": "Direito Empresarial", "lei": "Títulos, sociedades e falência", "peso": 4, "texto": "<p><strong>Duplicata.</strong> Os requisitos do título estão na Lei 5.474/68, art. 2º, §1º (entre eles, data de emissão e praça de pagamento). A duplicata <mark>aceita</mark> é título executivo extrajudicial mesmo sem protesto <span class=\"art\">art. 15, I</span>.</p>\n<p><strong>Sociedade anônima.</strong> <mark>Independentemente do objeto</mark>, considera-se empresária a sociedade por ações <span class=\"art\">CC, art. 982, parágrafo único</span>. Seus atos constitutivos vão para a <mark>Junta Comercial</mark>, e ela adquire personalidade com o arquivamento <span class=\"art\">art. 985</span>. A cooperativa, ao contrário, é sempre simples.</p>\n<p><strong>Transformação de Ltda. em S.A.</strong> Depende do consentimento de todos os sócios, <mark>salvo se prevista no contrato social</mark>, caso em que o dissidente pode se retirar <span class=\"art\">CC, art. 1.114</span>. Na Lei das S.A., os sócios podem <mark>renunciar no contrato ao direito de retirada</mark> <span class=\"art\">LSA, art. 221, parágrafo único</span>. Com a previsão contratual, a deliberação segue o quórum de alteração do contrato social: <mark>mais da metade do capital</mark> <span class=\"art\">CC, art. 1.076, II</span>.</p>\n<p><strong>Juros na falência.</strong> Contra a massa falida <mark>não são exigíveis juros vencidos após a decretação da falência</mark>, previstos em lei ou contrato, se o ativo não bastar para pagar os credores subordinados <span class=\"art\">Lei 11.101/05, art. 124</span>. Até a decretação, os juros de mora correm normalmente.</p>", "qs": [{"id": "q47", "n": {"1": 47, "2": 48, "3": 49, "4": 50}, "p": "Em 8 de janeiro de 2025, Diamante Moda e Confecções Ltda. sacou duplicata de compra e venda contra Inês Gurjão, microempreendedora individual, na praça de João Pessoa, PB, no valor de R$ 7.550,00. O título foi apresentado ao sacado no dia 17 de janeiro de 2025 e foi aceito. No dia do vencimento, não houve pagamento, fato que motivou o sacador a ajuizar ação de execução em face do aceitante, sem ter levado a duplicata a protesto. Ficou constatado nos autos que a duplicata sacada não continha nem a data de emissão nem o lugar de pagamento. Diante deste fato, assinale a afirmativa correta.", "o": ["Não há título executivo extrajudicial em virtude da ausência da data de emissão, sendo o lugar do pagamento requisito suprível ou não essencial.", "A duplicata é título executivo extrajudicial, pois tanto a data de emissão quanto o lugar do pagamento são requisitos supríveis ou não essenciais.", "Não há título executivo extrajudicial em virtude da ausência da data de emissão e do lugar do pagamento, ambos requisitos formais e essenciais para a validade da duplicata.", "A duplicata é título executivo extrajudicial, pois, com o aceite, ela se torna título autônomo em relação ao negócio subjacente, independentemente da ausência do lugar do pagamento e da data de emissão."], "c": null, "e": "Questão anulada pela banca no gabarito definitivo. Ela não entra na sua pontuação, mas vale resolver para revisar os requisitos da duplicata."}, {"id": "q48", "n": {"1": 48, "2": 49, "3": 50, "4": 47}, "p": "Inês Cabedelo e mais cinco amigos, todos analistas de investimento, pretendem constituir uma sociedade simples para a prestação de serviços de consultoria financeira, sem que o exercício da profissão intelectual de cada sócio constitua elemento de empresa. Ficou acordado por todos, que o tipo societário a ser adotado para a exploração da atividade econômica é a sociedade anônima, sendo que a administração da sociedade será privativa do sócio Lucena Lastro. Com base na narrativa apresentada, sobre o tipo societário a ser adotado, assinale a afirmativa correta.", "o": ["A sociedade será empresária, caso os sócios optem por arquivar o ato constitutivo na Junta Comercial; optando os sócios pelo arquivamento do ato constitutivo no Registro Civil de Pessoas Jurídicas, a sociedade será simples.", "A sociedade será simples, em virtude de o objeto social não ser atividade própria de empresário, já o ato constitutivo deve ser arquivado no Registro Civil de Pessoas Jurídicas para que ela venha a adquirir personalidade jurídica.", "A sociedade será empresária, ainda que a atividade econômica a ser exercida não seja própria de empresário, devendo o ato constitutivo ser arquivado na Junta Comercial para que a sociedade venha a adquirir personalidade jurídica.", "A sociedade será simples, em virtude de o objeto social não ser atividade própria de empresário, já o arquivamento do ato constitutivo deve ser feito no Registro Civil de Pessoas Jurídicas, ressalvada a possibilidade de transformação do tipo anônima para limitada, hipótese em que ela será empresária."], "c": 2, "e": "Art. 982, parágrafo único, do CC: a S.A. é sempre empresária, independentemente do objeto, e deve arquivar seus atos na Junta Comercial."}, {"id": "q49", "n": {"1": 49, "2": 50, "3": 47, "4": 48}, "p": "A sociedade Curtume Massapê Ltda. é composta por sete sócios, sendo dois deles pessoas jurídicas e o restante, pessoas naturais. A sócia Maria Caridade, majoritária no capital social e única administradora, pretende aprovar em reunião a alteração do tipo societário para sociedade anônima, sem dissolver e liquidar Curtume Massapê Ltda. Tal medida já tem previsão no contrato social, o qual autoriza a aplicação supletiva da Lei das S.A., e a sócia pretende implementá-la. Maria Caridade consultou você, como advogado(a), para saber sobre o quórum deliberativo para a aprovação dessa proposta e se haveria direito de retirada para os atuais sócios e a consequente liquidação de suas quotas. Assinale a opção que apresenta, corretamente, a sua resposta.", "o": ["É preciso a aprovação da medida pelos votos correspondentes a mais da metade do capital social, podendo os sócios renunciar, no contrato social, ao direito de retirada.", "A medida pretendida deve ser aprovada pela unanimidade dos sócios e, por conseguinte, não tem cabimento o direito de retirada pela ausência de sócio dissidente da deliberação.", "É preciso a aprovação da medida pela maioria de votos dos presentes, sendo direito dos sócios dissidentes pleitear a liquidação de suas quotas se o contrato social dispuser nesse sentido.", "Caso seja atingido o quórum deliberativo de três quartos do capital social, a medida estará aprovada, sendo direito potestativo dos sócios dissidentes pleitear a liquidação de suas quotas."], "c": 0, "e": "Com previsão no contrato social, a transformação segue o quórum de alteração contratual (mais da metade do capital, art. 1.076, II, do CC), e o direito de retirada pode ser renunciado no contrato (art. 221, parágrafo único, da LSA)."}, {"id": "q50", "n": {"1": 50, "2": 47, "3": 48, "4": 49}, "p": "A sociedade empresária Antas Comércio de Artigos Esportivos Ltda. é credora quirografária da sociedade Araçás, Camacan & Ibirataia Ltda., cuja falência foi decretada por convolação do processo de recuperação judicial. O crédito foi constituído durante a recuperação judicial e já estava vencido antes da convolação, porém não foi arrolado pela devedora na relação de credores publicada junto com a decisão que decretou a falência. O administrador e representante legal de Antas Comércio de Artigos Esportivos Ltda. irá realizar a habilitação do crédito e você deverá orientá-lo quanto aos juros de mora, de modo que", "o": ["não incidirão juros de mora nas cobranças de créditos da massa falida, apenas o valor do crédito será atualizado monetariamente até a data do pagamento.", "poderão ser cobrados juros de mora a partir da data da decretação da falência, porém o pagamento fica na dependência de ser o ativo apurado suficiente para o pagamento dos credores subordinados.", "os juros de mora incidirão sobre o valor do principal, da data do vencimento até a data do pagamento na falência, pois apenas os credores subordinados ficam na dependência da suficiência do ativo para o pagamento dos juros.", "poderão ser cobrados juros de mora da data do vencimento até a data da decretação da falência, pois, após esse evento, o pagamento fica na dependência de ser o ativo apurado suficiente para o pagamento dos credores subordinados."], "c": 3, "e": "Art. 124 da Lei 11.101/05: os juros de mora correm até a decretação da falência; depois dela, só são pagos se o ativo bastar para quitar os credores subordinados."}]}, {"id": "pc", "nome": "Direito Processual Civil", "lei": "CPC/2015", "peso": 6, "texto": "<p><strong>Liminar possessória.</strong> Na ação de força nova (esbulho há <mark>menos de ano e dia</mark>), o autor obtém a reintegração liminar provando <mark>a posse, o esbulho, a data do esbulho</mark> e a perda da posse <span class=\"art\">arts. 558 e 561</span>. Não se exige perigo de dano (não é tutela de urgência).</p>\n<p><strong>Parcelamento do art. 916.</strong> No prazo dos embargos à execução, o executado reconhece o crédito, deposita 30% e pede o restante em até 6 parcelas, com correção e juros de 1% ao mês. Esse parcelamento <mark>não se aplica ao cumprimento de sentença</mark> <span class=\"art\">art. 916, §7º</span>.</p>\n<p><strong>Consignação em pagamento.</strong> Cabe quando o credor <mark>recusa receber</mark> sem justa causa, para que o devedor deposite e se libere dos efeitos da mora <span class=\"art\">art. 539</span>; <span class=\"art\">Lei 8.245/91, art. 67</span>.</p>\n<p><strong>Recurso só sobre honorários.</strong> O advogado tem legitimidade para recorrer dos honorários. Mas o recurso que verse <mark>exclusivamente</mark> sobre honorários de sucumbência <mark>está sujeito a preparo</mark>, salvo se o próprio advogado demonstrar direito à gratuidade <span class=\"art\">art. 99, §5º</span>.</p>\n<p><strong>Ação declaratória.</strong> É admissível a ação meramente declaratória <mark>ainda que tenha ocorrido a violação do direito</mark> <span class=\"art\">art. 20</span>. Na apelação contra indeferimento da inicial, o juiz pode se retratar em <mark>5 dias</mark> <span class=\"art\">art. 331</span>.</p>\n<p><strong>Liquidação.</strong> Quando a apuração do valor depender <mark>apenas de cálculo aritmético</mark>, o credor pode iniciar logo o cumprimento de sentença com demonstrativo do débito <span class=\"art\">art. 509, §2º</span>. Liquidação por arbitramento ou pelo procedimento comum só se houver necessidade de perícia ou de provar fato novo.</p>", "qs": [{"id": "q51", "n": {"1": 51, "2": 52, "3": 53, "4": 54}, "p": "Você, como advogado(a) de José, ajuizou ação de reintegração de posse, com pedido de liminar, alegando que seu cliente foi esbulhado na posse de imóvel de sua propriedade. Segundo indica, o esbulho foi praticado por Thiago há dois meses, contados da data da propositura da ação. Considerando o procedimento especial que rege as ações possessórias e a espécie de liminar prevista para ele, assinale a opção que indica o que você deve provar para que o Juiz conceda, liminarmente, a reintegração.", "o": ["Apenas a prova da posse do imóvel.", "A prova da posse anterior, do esbulho e de sua data.", "O justo título de propriedade e a prova da posse de má-fé de Thiago.", "A prova da posse anterior, do esbulho e do perigo da demora ou do risco de dano irreparável."], "c": 1, "e": "Art. 561 do CPC: na possessória de força nova, a liminar depende da prova da posse, do esbulho e de sua data. Não é preciso provar perigo da demora."}, {"id": "q52", "n": {"1": 52, "2": 53, "3": 54, "4": 55}, "p": "Fernando ingressou com uma ação de cobrança contra Márcio e, após o trânsito em julgado da sentença condenatória, iniciou o cumprimento de sentença para receber o valor devido de R$ 10.000,00. Ao ser intimado a pagar a dívida, Márcio, por meio do seu(sua) advogado(a), reconheceu o crédito exequendo e solicitou o parcelamento do débito, oportunidade em que depositou R$ 3.000,00 à vista e requereu o pagamento do restante em seis parcelas mensais, acrescidas de correção monetária e de juros de 1% ao mês. Sobre a situação relatada, assinale a afirmativa correta.", "o": ["Márcio tem direito ao parcelamento do débito, independentemente de a execução se originar de título judicial ou extrajudicial.", "O parcelamento nos moldes propostos por Márcio somente é cabível no prazo para embargos à execução, não se aplicando ao cumprimento de sentença.", "O Juiz pode, a seu critério, conceder o parcelamento independentemente da previsão legal, considerando os princípios da razoabilidade e da proporcionalidade.", "O pedido de parcelamento formulado por Márcio deve ser deferido, pois a legislação processual permite essa modalidade de pagamento em qualquer fase de execução."], "c": 1, "e": "Art. 916, §7º, do CPC: o parcelamento do art. 916 não se aplica ao cumprimento de sentença."}, {"id": "q53", "n": {"1": 53, "2": 54, "3": 55, "4": 56}, "p": "Laura alugou um imóvel residencial com o objetivo de lá morar após seu casamento, marcado para o ano que vem. O contrato vem sendo cumprido regularmente por ambas as partes, até que William, locador, recusou-se a receber o valor mensal devido sem nenhuma justificativa. Laura, então, procurou você, na qualidade de advogado(a), com o intuito de buscar a solução judicial que melhor resguardasse seu direito de permanecer no imóvel em função do cumprimento de todas as obrigações de sua parte, afastando a mora. Com base nesses fatos, assinale a opção que apresenta, corretamente, a sua orientação.", "o": ["Propor ação monitória, pois o contrato de locação é prova escrita sem eficácia de título executivo.", "Propor ação de execução por título extrajudicial, uma vez que a Obrigação é líquida, certa e exigível.", "Propor ação de consignação em pagamento, a fim de efetuar o pagamento e se eximir dos efeitos da mora.", "Interpor mandado de segurança e, por meio de depósito, eximir-se da obrigação, pois a recusa de William configura ato coator, que viola o seu direito líquido e certo previsto no contrato."], "c": 2, "e": "Art. 539 do CPC e art. 67 da Lei de Locações: diante da recusa injustificada do locador, cabe consignação em pagamento para afastar a mora."}, {"id": "q54", "n": {"1": 54, "2": 55, "3": 56, "4": 51}, "p": "Juliana moveu ação indenizatória contra Antônio, na qual requereu a condenação dele, no montante de R$ 10.000,00. Na sua petição inicial, Juliana requereu gratuidade de justiça, que, ato contínuo, foi concedida de forma integral. Após o fim da fase instrutória, o Magistrado proferiu sentença julgando procedentes os pedidos de Juliana, embora tenha fixado honorários de sucumbência abaixo dos esperados por Paula, advogada que representa Juliana na ação. Inconformada com a decisão, Paula, que possui recursos suficientes para pagar custas e despesas processuais, pretende recorrer exclusivamente quanto aos honorários de sucumbência fixados em seu favor. Sobre a pretensão de Paula, assinale a afirmativa correta.", "o": ["Não é cabível recurso para a reforma de sentença no que tange aos honorários de sucumbência, devendo Paula ajuizar ação própria para requerer a majoração dos honorários fixados.", "É admitida a interposição de recurso para a majoração de honorários de sucumbência, e Paula não precisará arcar com o preparo, uma vez que Juliana é beneficiária da gratuidade de justiça.", "É admitida a interposição de recurso para a majoração de honorários de sucumbência, embora Paula tenha que arcar com o preparo do recurso e dividir o valor das custas processuais pagas pelas partes ao longo do processo.", "É admitida a interposição de recurso para a majoração de honorários de sucumbência e Paula terá de arcar com o preparo do recurso, tendo em vista que possui recursos suficientes para pagá-lo e não faz jus à gratuidade de justiça."], "c": 3, "e": "Art. 99, §5º, do CPC: o recurso que versa exclusivamente sobre honorários exige preparo, salvo se o próprio advogado tiver direito à gratuidade. Paula pode pagar, então deve recolher."}, {"id": "q55", "n": {"1": 55, "2": 56, "3": 51, "4": 52}, "p": "Paulo, comerciante, descobre que foi citado nominalmente em relatório de Auditoria Interna de um órgão público estadual, elaborado por um servidor, como suposto beneficiário de fraude em licitação, sem nunca ter participado de procedimento de contratação pública nem ter sido formalmente processado ou tido oportunidade de defesa. Embora não tenha ainda ocorrido imputação formal, a divulgação do relatório causou abalo reputacional e Paulo, com medo de que tal medida ainda pudesse prejudicá-lo, ingressou com uma ação declaratória em face do Estado, requerendo judicialmente a declaração de ocorrência de ato ilícito em seu desfavor, praticado por servidor público daquele órgão estadual, tendo em vista que não teve participação nos fatos mencionados, protegendo sua honra e imagem. O Juízo, ao proceder à análise de admissibilidade da petição inicial, indeferiu-a liminarmente, sob o fundamento de que a pretensão deduzida em juízo possuiria natureza exclusivamente declaratória, revelando-se, portanto, incabível a via eleita pela parte autora. Diante do caso narrado, como advogada(o) de Paulo, assinale a afirmativa correta.", "o": ["O Juízo não agiu corretamente e Paulo deverá interpor recurso de apelação, momento em que poderá ser exercido o juízo de retratação no prazo de dez dias.", "O Juízo não agiu corretamente, e Paulo deverá interpor recurso de apelação, argumentando a ocorrência de vício, pois é admissível a ação meramente declaratória, ainda que tenha havido a violação do direito do autor.", "O Juízo agiu corretamente ao indeferir a petição inicial de Paulo, pois de acordo com o Código de Processo Civil, não é admissível ação declaratória quando o direito já tiver sido violado, devendo o autor buscar a tutela condenatória ou constitutiva.", "O Juízo agiu corretamente, uma vez que Paulo buscou tão somente a declaração judicial de inexistência de vínculo com os fatos narrados, e a Fazenda Pública não pode ser compelida a litigar em face de pedidos meramente declaratórios, cabendo ao autor, pelo menos, formular um pedido condenatório."], "c": 1, "e": "Art. 20 do CPC: é admissível ação meramente declaratória mesmo após a violação do direito. Cabe apelação, com retratação em 5 dias (art. 331), e não 10."}, {"id": "q56", "n": {"1": 56, "2": 51, "3": 52, "4": 53}, "p": "Em demanda indenizatória proposta por uma sociedade empresária em face de sua fornecedora, a sentença julgou procedente o pedido do autor para condenar a ré ao pagamento de perdas e danos decorrentes de inadimplemento contratual. Na fundamentação, a sentença estabeleceu de forma detalhada os critérios para a apuração do prejuízo, determinando que o valor da condenação corresponderia às notas fiscais inadimplidas, acrescidas de correção monetária de cada vencimento e juros de mora a partir da citação. Apesar de não ter fixado o montante final devido, a decisão delimitou todos os parâmetros necessários para a sua apuração, não havendo controvérsia quanto aos documentos já juntados aos autos, tampouco necessidade de produção de novas provas ou alegação de fatos supervenientes. Após o trânsito em julgado, a parte credora buscou a adoção das medidas cabíveis para a satisfação de seu crédito. Considerando a situação narrada e atuando como advogado(a) da sociedade empresária, assinale a afirmativa correta.", "o": ["É obrigatória a liquidação por arbitramento, em razão da ausência de fixação do valor na sentença.", "A prévia liquidação de sentença pelo procedimento comum é indispensável, por se tratar de condenação ilíquida.", "A liquidação pelo procedimento comum é obrigatória, pois a apuração do valor da condenação exige dilação probatória.", "O credor pode promover desde logo o cumprimento de sentença, mediante apresentação de memória de cálculo, pois a apuração do valor depende apenas de cálculo aritmético."], "c": 3, "e": "Art. 509, §2º, do CPC: se o valor depende só de cálculo aritmético, o credor promove desde logo o cumprimento com memória de cálculo."}]}, {"id": "penal", "nome": "Direito Penal", "lei": "Código Penal", "peso": 6, "texto": "<p><strong>Imunidade absoluta nos crimes patrimoniais.</strong> É <mark>isento de pena</mark> quem comete crime contra o patrimônio em prejuízo de ascendente ou <mark>descendente</mark> <span class=\"art\">art. 181, II</span>. O fato continua típico e ilícito; só a punibilidade é afastada. Não se aplica se houver violência ou grave ameaça ou se a vítima tiver <mark>60 anos ou mais</mark> <span class=\"art\">art. 183</span>.</p>\n<p><strong>Arrependimento posterior.</strong> Nos crimes sem violência ou grave ameaça, reparado o dano ou restituída a coisa, por ato voluntário, <mark>até o recebimento da denúncia</mark>, a pena é reduzida de 1/3 a 2/3 <span class=\"art\">art. 16</span>. No peculato, a extinção da punibilidade pela reparação só existe na modalidade <mark>culposa</mark> <span class=\"art\">art. 312, §3º</span>.</p>\n<p><strong>Concurso de pessoas.</strong> Quem participa do plano e tem domínio funcional do fato (como dar fuga combinada) é coautor. A qualificadora objetiva (rompimento de obstáculo) se comunica a quem dela tem ciência. Já as <mark>circunstâncias pessoais não se comunicam</mark>, como a reincidência <span class=\"art\">art. 30</span>.</p>\n<p><strong>Penas restritivas de direitos.</strong> Na condenação <mark>igual ou inferior a um ano</mark>, a substituição é feita por <mark>multa ou por uma</mark> restritiva de direitos; se superior a um ano, por uma restritiva e multa ou por duas restritivas <span class=\"art\">art. 44, §2º</span>.</p>\n<p><strong>Medida de segurança.</strong> Sua duração não pode ultrapassar o <mark>limite máximo da pena abstratamente cominada</mark> ao delito <span class=\"art\">Súmula 527 STJ</span>.</p>\n<p><strong>Crimes contra a honra.</strong> <mark>Calúnia</mark>: imputar falsamente fato definido como crime <span class=\"art\">art. 138</span>. <mark>Difamação</mark>: imputar fato ofensivo à reputação <span class=\"art\">art. 139</span>. <mark>Injúria</mark>: ofender a dignidade ou o decoro, sem imputar fato <span class=\"art\">art. 140</span>.</p>", "qs": [{"id": "q57", "n": {"1": 57, "2": 60, "3": 59, "4": 58}, "p": "Teobaldo tem 59 anos de idade, está desempregado e usa drogas ilícitas recreativamente. Túlio, o filho dele, tem 20 anos de idade, é jogador de futebol profissional e colecionador de relógios raros. Teobaldo, aproveitando-se da ausência do filho, que disputava um jogo fora da sua cidade, pulou o muro e arrombou a porta da mansão em que Túlio morava, pegando o relógio mais valioso da coleção, avaliado em R$ 100.000,00, com o fim de vendê-lo para adquirir drogas. Diante de tal situação hipotética, assinale a afirmativa correta.", "o": ["Teobaldo deve ser punido pelo crime de furto qualificado pelo rompimento de obstáculo.", "Teobaldo praticou comportamento típico e ilícito, mas está isento de pena devido à relação de parentesco.", "Teobaldo praticou comportamento típico, mas cuja antijuridicidade está excluída em razão da relação de parentesco.", "Teobaldo praticou comportamento atípico por incidência do princípio da insignificância, haja vista o valor do bem subtraído em comparação com o patrimônio de Túlio."], "c": 1, "e": "Art. 181, II, do CP: furto contra descendente, sem violência e com vítima menor de 60 anos, é fato típico e ilícito, mas o agente fica isento de pena."}, {"id": "q58", "n": {"1": 58, "2": 61, "3": 60, "4": 59}, "p": "Júlia, funcionária pública federal lotada no setor de compras de um órgão do Ministério da Fazenda, desviou dolosamente para sua conta particular a importância de R$ 10.000,00, que deveria ser utilizada na aquisição de material de escritório. A conduta se consumou em 1º de março de 2025. Após a instauração do inquérito policial para investigar a prática do crime de peculato, Júlia foi orientada por sua advogada e reparou integralmente o dano causado à Administração Pública em 1º de agosto de 2025, após o oferecimento da denúncia, mas antes de seu recebimento. Sobre a reparação integral do dano por Júlia, assinale a afirmativa correta.", "o": ["A reparação antes do trânsito em julgado gera a extinção da punibilidade.", "Configura o instituto do arrependimento posterior, gerando a diminuição da pena.", "Configura causa legal de diminuição de pena especificamente aplicável ao crime de peculato, por força do princípio da especialidade.", "A reparação antes do recebimento da denúncia configura o instituto do arrependimento eficaz, devendo Júlia responder apenas pelos atos praticados, se constituírem crime autônomo."], "c": 1, "e": "Art. 16 do CP: no peculato doloso, a reparação integral antes do recebimento da denúncia configura arrependimento posterior e reduz a pena. A extinção da punibilidade do art. 312, §3º, vale só para o peculato culposo."}, {"id": "q59", "n": {"1": 59, "2": 62, "3": 61, "4": 60}, "p": "José planejou subtrair um valioso equipamento de informática de uma loja no período noturno. Para tanto, convenceu Pierre, primário e de bons antecedentes, a executar a ação. Pierre confiou no planejamento de José, pois tinha ciência de que este era reincidente específico em crimes patrimoniais. O plano consistia em Pierre arrombar a porta lateral da loja com um pé de cabra, subtrair o objeto e se encontrar com José a duas quadras de distância, onde este o aguardaria em um carro ligado para garantir a fuga. Pierre seguiu o plano à risca: arrombou a porta, pegou o equipamento e foi ao encontro de José. Ambos dividiram o produto do crime, mas foram descobertos e presos. A perícia técnica comprovou o rompimento de obstáculo à subtração. Ao final, José e Pierre foram denunciados pela prática do crime de furto qualificado pelo rompimento de obstáculo (Art. 155, § 4º, inciso I, do Código Penal). Diante de tal situação hipotética, assinale a afirmativa correta.", "o": ["Pierre é autor e José é partícipe do crime de furto, sendo a reincidência uma circunstância pessoal incomunicável a Pierre.", "José deve responder por furto simples, pois o rompimento de obstáculo foi executado pessoalmente por outrem, e não se comunica com ele.", "Ambos respondem como coautores do furto qualificado, sendo a reincidência comunicável a Pierre, pois estava ciente dessa circunstância que agrava a pena.", "José e Pierre devem responder como coautores do furto qualificado pelo rompimento de obstáculo, sendo a reincidência uma circunstância pessoal incomunicável a Pierre."], "c": 3, "e": "José e Pierre são coautores do furto qualificado (José tinha papel essencial na fuga combinada). A reincidência é circunstância pessoal e não se comunica a Pierre (art. 30 do CP)."}, {"id": "q60", "n": {"1": 60, "2": 57, "3": 62, "4": 61}, "p": "Mariana, primária e com bons antecedentes, foi condenada pela prática do crime de apropriação indébita (Art. 168 do CP), cuja pena mínima é de um ano e, a máxima, de quatro anos de reclusão. Na primeira fase da dosimetria, o Juiz, considerando favoráveis todas as circunstâncias judiciais do Art. 59 do CP, fixou a pena-base no mínimo legal, ou seja, um ano de reclusão. Na segunda e terceira fases da dosimetria, não houve alterações. Ao aplicar a pena, o Juiz determinou o regime inicial aberto e, em seguida, efetuou a substituição da pena privativa de liberdade por duas penas restritivas de direitos: prestação de serviços à comunidade e prestação pecuniária. Sobre a situação hipotética apresentada, assinale a afirmativa correta.", "o": ["A substituição da pena privativa de liberdade por duas penas restritivas de direitos é ilegal, pois nas condenações iguais ou inferiores a um ano, a substituição deve ser feita por multa ou uma pena restritiva de direitos.", "A substituição da pena privativa de liberdade está equivocada, pois a pena definitiva não pode ser inferior a dois anos para ser substituída por duas penas restritivas de direitos, devendo, no caso, ser substituída apenas por uma multa ou uma pena restritiva de direitos.", "A substituição da pena privativa de liberdade pela prestação de serviços e pela prestação pecuniária está correta, mas a modalidade de prestação de serviços à comunidade é obrigatória e deve ser aplicada sozinha, e não em cumulação com a prestação pecuniária.", "A substituição da pena privativa de liberdade está correta, pois, sendo a pena inferior a um ano, é possível que a substituição seja feita por multa ou uma pena restritiva de direitos, mas, excepcionalmente, o Juiz pode aplicar duas, se fundamentado na insuficiência de apenas uma."], "c": 0, "e": "Art. 44, §2º, do CP: pena igual ou inferior a um ano é substituída por multa ou por uma pena restritiva de direitos; duas restritivas só para pena superior a um ano."}, {"id": "q61", "n": {"1": 61, "2": 58, "3": 57, "4": 62}, "p": "Carlos foi processado pela prática do crime de lesão corporal de natureza grave (Art. 129, § 1º, do Código Penal) e punido com pena de reclusão de um a cinco anos. No curso do processo, ficou comprovado que Carlos era inteiramente incapaz de entender o caráter ilícito do fato em razão de doença mental. O Juízo proferiu sentença absolutória, mas impôs a Carlos medida de segurança de internação. Após seis anos de internação ininterrupta, a defesa de Carlos requer a extinção da medida de segurança, sob o argumento de que o prazo de duração já ultrapassou a pena máxima cominada ao crime e que o último exame de periculosidade atestou melhora significativa no quadro, embora ainda não haja cessação total da patologia. Diante de tal situação hipotética, assinale a afirmativa correta.", "o": ["A medida de segurança deve ser extinta, uma vez que a sua duração não pode ultrapassar o limite máximo da pena abstrata cominada ao delito.", "O Juiz poderá converter a medida de segurança em pena privativa de liberdade, uma vez que foi verificado que a patologia subsiste e o crime foi praticado com violência.", "A medida de segurança de internação deve perdurar por prazo ilimitado, enquanto não for verificada, mediante perícia médica, a cessação da patologia do agente.", "A desinternação de Carlos será sempre condicional, devendo ser restabelecida caso ele pratique, no prazo de dez anos, fato que revele a persistência de sua periculosidade."], "c": 0, "e": "Súmula 527 do STJ: a medida de segurança não pode ultrapassar o máximo da pena abstrata cominada ao delito. Com 6 anos de internação e pena máxima de 5, deve ser extinta."}, {"id": "q62", "n": {"1": 62, "2": 59, "3": 58, "4": 57}, "p": "Durante uma assembleia do condomínio em que reside, Paulo, Juiz de Direito, irritado com a gestão do síndico Roberto, advogado, pediu a palavra e, diante de todos os moradores presentes, afirmou categoricamente, ciente da falsidade da sua afirmação: “O Sr. Roberto desviou criminosamente R$ 10.000,00 do fundo de reserva no mês passado para pagar dívidas pessoais.” Roberto, que sempre agiu com probidade, sentiu-se profundamente ofendido em sua reputação perante a comunidade. No dia seguinte, Paulo enviou uma mensagem telefônica privada para Roberto dizendo: “Além de desonesto, você é um incapaz e um estúpido.” Diante de tal situação hipotética, assinale a afirmativa correta.", "o": ["Paulo cometeu o crime de difamação durante a assembleia, ao imputar fato ofensivo à reputação de Roberto, e o crime de injúria, ao enviar a mensagem telefônica privada.", "Em relação à afirmação feita na assembleia, Paulo poderia se valer da exceção da verdade apenas se Roberto fosse funcionário público e o crime tivesse sido cometido no exercício de suas funções.", "A afirmação feita na assembleia configura o crime de calúnia, pois Paulo imputou falsamente a Roberto um fato definido como crime, enquanto a mensagem telefônica privada configura o crime de injúria.", "Por se tratar de uma discussão em assembleia de condomínio, a conduta de Paulo é atípica em relação ao que foi dito publicamente, sendo protegida pela imunidade judiciária, restando apenas o crime de injúria pela mensagem telefônica privada."], "c": 2, "e": "Imputar falsamente um crime (desvio de dinheiro) é calúnia (art. 138). Chamar alguém de desonesto, incapaz e estúpido é injúria (art. 140)."}]}, {"id": "ppen", "nome": "Direito Processual Penal", "lei": "CPP e Lei 9.099/95", "peso": 6, "texto": "<p><strong>Quebra de fiança.</strong> Ocorre, entre outros casos, quando o acusado deliberadamente pratica <mark>ato de obstrução</mark> ao andamento do processo <span class=\"art\">art. 341, II</span>. A consequência é a <mark>perda de metade do valor</mark> da fiança, cabendo ao juiz decidir sobre outras cautelares ou a prisão preventiva <span class=\"art\">art. 343</span>. A perda total ocorre só quando o condenado não se apresenta para cumprir a pena <span class=\"art\">art. 344</span>.</p>\n<p><strong>Competência.</strong> A Justiça Federal julga crimes contra servidor federal ou praticados por ele <mark>em razão da função</mark>. Fato da vida privada (briga por vaga de garagem) é da Justiça Estadual: a incompetência em razão da matéria é <mark>absoluta</mark>.</p>\n<p><strong>Ação penal privada subsidiária.</strong> Só cabe quando há <mark>inércia do MP</mark>, isto é, quando ele não oferece denúncia no prazo legal <span class=\"art\">CF, art. 5º, LIX</span>; <span class=\"art\">CPP, art. 29</span>. Roubo é de ação pública incondicionada.</p>\n<p><strong>Embargos infringentes.</strong> Cabíveis quando a decisão de segunda instância, <mark>desfavorável ao réu</mark>, não for unânime, limitados à matéria do voto vencido; prazo de 10 dias <span class=\"art\">art. 609, parágrafo único</span>.</p>\n<p><strong>Acordo de não persecução penal (ANPP).</strong> Cabe para infração sem violência ou grave ameaça, com <mark>pena mínima inferior a 4 anos</mark>, se o investigado confessar <span class=\"art\">art. 28-A</span>. Não confundir com a suspensão condicional do processo, que exige pena mínima <mark>igual ou inferior a 1 ano</mark> <span class=\"art\">Lei 9.099/95, art. 89</span>.</p>\n<p><strong>Comunhão da prova.</strong> A prova produzida pertence <mark>ao processo</mark>, não à parte que a requereu. Depois de produzida, não pode ser desconsiderada a pedido de quem a arrolou.</p>", "qs": [{"id": "q63", "n": {"1": 63, "2": 64, "3": 65, "4": 66}, "p": "Thaís está respondendo à ação penal pelo crime de roubo e teve decretada a quebra da fiança, em virtude de, deliberadamente, praticar ato destinado à obstrução do andamento do processo. O Juiz decretou, então, a perda da totalidade do valor da fiança. Sobre a hipótese apresentada, você, na condição de advogado(a), deve, em recurso, argumentar que", "o": ["não é possível decretar a quebra da fiança por ato de obstrução ao andamento do processo.", "a consequência legal da quebra da fiança é a perda da metade de seu valor e não a totalidade da fiança.", "a quebra da fiança não é matéria passível de discussão perante o Juiz de primeiro grau, porque somente pode ser decretada por decisão de Plenário de Tribunal.", "a consequência legal da quebra da fiança é a perda de 1/3 do valor, não sendo possível decretar a quebra da fiança por ato de obstrução ao andamento do processo."], "c": 1, "e": "Art. 343 do CPP: a quebra da fiança acarreta a perda de metade do seu valor. Obstruir o processo é causa de quebra (art. 341, II)."}, {"id": "q64", "n": {"1": 64, "2": 65, "3": 66, "4": 67}, "p": "Amanda, servidora pública federal, durante suas férias, agrediu Joana, sua vizinha, com socos, em razão de estacionamento indevido na vaga de garagem reservada a Amanda, no condomínio residencial onde ambas residem. Joana, em consequência da agressão, ficou 50 dias impossibilitada de comparecer ao trabalho. O Ministério Público Federal ofereceu denúncia contra Amanda pelo crime de lesão corporal grave. O Juiz Federal recebeu a denúncia. Na defesa de Amanda, além da matéria de mérito, você, como advogado(a), deve alegar, processualmente,", "o": ["a incompetência relativa da Justiça Federal.", "a exceção da verdade, uma vez que Joana estava estacionando na vaga reservada para Amanda.", "a necessidade de enviar o processo para o Superior Tribunal de Justiça, uma vez que a ré é servidora pública federal.", "a incompetência absoluta da Justiça Federal, uma vez que o fato não tem relação com a função de servidora pública de Amanda."], "c": 3, "e": "A agressão na vida privada não tem relação com o cargo federal. A competência é da Justiça Estadual, e a incompetência da Justiça Federal é absoluta."}, {"id": "q65", "n": {"1": 65, "2": 66, "3": 67, "4": 68}, "p": "Sílvia foi vítima de roubo praticado por Antônio, que subtraiu o relógio dela mediante grave ameaça. Antônio foi preso em flagrante e o relógio devolvido para Sílvia. Após a conclusão do inquérito, no dia da remessa deste para o Ministério Público, Sílvia, na condição de vítima, ofereceu uma queixa-crime. Assinale a opção que indica, corretamente, a alegação que você, como advogado(a) de Antônio, deve apresentar.", "o": ["A falta de interesse de agir, uma vez que o relógio foi devolvido para a vítima.", "A impossibilidade jurídica do pedido, uma vez que caberia ao Ministério Público formular o pedido.", "A falta de justa causa para a ação, em virtude da devolução do bem subtraído ser causa extralegal de extinção de punibilidade.", "A ilegitimidade ativa para a deflagração da demanda, porque o crime de roubo é de ação penal pública incondicionada e não existe inércia do Ministério Público."], "c": 3, "e": "Roubo é crime de ação penal pública incondicionada. A queixa subsidiária só cabe com inércia do MP, que não existiu: o inquérito acabara de ser remetido."}, {"id": "q66", "n": {"1": 66, "2": 67, "3": 68, "4": 63}, "p": "João, funcionário público, após ser condenado à pena de seis anos de reclusão, pelo crime de peculato, interpôs recurso em face da sentença, requerendo a aplicação da pena mínima de dois anos de reclusão. No julgamento da apelação, a sentença foi mantida em seus termos, tendo como vencido o voto do relator, que foi favorável ao pleito defensivo e determinava a aplicação da pena mínima a João. Diante disso, a defesa deve opor", "o": ["revisão criminal.", "agravo em execução.", "embargos infringentes.", "embargos de divergência."], "c": 2, "e": "Art. 609, parágrafo único, do CPP: decisão de segunda instância desfavorável ao réu e não unânime autoriza embargos infringentes, nos limites do voto vencido."}, {"id": "q67", "n": {"1": 67, "2": 68, "3": 63, "4": 64}, "p": "Rubens está sendo investigado pelo delito de tráfico internacional de drogas (Art. 33 c/c Art. 40, inciso I, ambos da Lei nº 11.343/2006). No curso da investigação, Rubens foi citado para responder a uma ação penal pela prática do crime de receptação de animais (Art. 180-A), cuja pena cominada para esse crime é de reclusão de 2 a 5 anos. Rubens não possui outras anotações criminais e o(a) procura, como advogado(a), para que você apresente uma resposta à acusação. Você, em preliminares, deve requerer a remessa dos autos ao Ministério Público para uma proposta de", "o": ["suspensão condicional da pena.", "acordo de não persecução penal.", "acordo de colaboração premiada.", "suspensão condicional do processo."], "c": 1, "e": "Art. 28-A do CPP: receptação de animais tem pena mínima de 2 anos (inferior a 4) e não envolve violência; cabe ANPP. A suspensão condicional do processo exigiria pena mínima de até 1 ano."}, {"id": "q68", "n": {"1": 68, "2": 63, "3": 64, "4": 65}, "p": "O Ministério Público arrolou Júlio como testemunha de acusação em ação penal deflagrada em face de Cesar. Na audiência de instrução e julgamento, Júlio prestou depoimento totalmente favorável à tese defensiva. Por isso, o Ministério Público requereu a dispensa e desconsideração da prova testemunhal, afirmando que, como apenas o Parquet arrolou Júlio, este poderia dispensar a prova quando o seu resultado lhe fosse desfavorável. Na defesa de Cesar, assinale a opção que apresenta o princípio processual penal pertinente a ser alegado, a fim de manter a prova produzida.", "o": ["Princípio da oportunidade.", "Princípio da comunhão da prova.", "Princípio da presunção de inocência.", "Princípio da obrigatoriedade da ação penal pública."], "c": 1, "e": "Pelo princípio da comunhão da prova, a prova pertence ao processo; o MP não pode descartá-la por lhe ser desfavorável."}]}, {"id": "prev", "nome": "Direito Previdenciário", "lei": "Lei 8.213/91", "peso": 2, "texto": "<p><strong>Benefício por incapacidade temporária (antigo auxílio-doença).</strong> Devido ao segurado incapaz para o trabalho por <mark>mais de 15 dias</mark> consecutivos. A carência de 12 contribuições é <mark>dispensada</mark> em caso de <mark>acidente de qualquer natureza</mark>, inclusive fora do trabalho <span class=\"art\">art. 26, II</span>.</p>\n<p><strong>Auxílio-acidente</strong> é outra coisa: indenização paga após a consolidação das lesões que deixem <mark>sequela redutora da capacidade</mark> laboral. Não substitui o benefício de incapacidade durante o afastamento, e não é devido ao contribuinte individual.</p>\n<p><strong>Servidor com regime próprio (RPPS).</strong> Não pode filiar-se ao RGPS como <mark>segurado facultativo</mark> <span class=\"art\">CF, art. 201, §5º</span>. Mas, se exercer <mark>atividade remunerada</mark> abrangida pelo RGPS ao mesmo tempo, será <mark>segurado obrigatório</mark> em relação a ela <span class=\"art\">Lei 8.213/91, art. 12</span>.</p>", "qs": [{"id": "q69", "n": {"1": 69, "2": 70, "3": 69, "4": 70}, "p": "Manuel Luz, profissional autônomo, em situação regular perante a Previdência Social, sofreu um acidente no final de semana, enquanto praticava esportes com os amigos, sem qualquer conexão com a sua atividade remunerada. Em virtude do acidente, Manuel ficará afastado de suas atividades profissionais por, no mínimo, um ano. Sobre a situação hipotética narrada, assinale a afirmativa correta.", "o": ["Manuel poderá obter o auxílio-acidente, o qual não possui relação necessária com a atividade remunerada, desde que a incapacidade ultrapasse 30 dias.", "O benefício de incapacidade temporária poderá ser concedido a Manuel, independentemente de comprovação de carência, que é dispensada nesse caso hipotético.", "Manuel poderá obter aposentadoria por incapacidade permanente, pois o afastamento superior a um ano produz presunção de invalidez, na forma da legislação vigente.", "Manuel não terá direito a qualquer prestação da Previdência Social, pois o acidente não possui qualquer conexão com a sua atividade remunerada, sendo decorrência de responsabilidade exclusiva do segurado."], "c": 1, "e": "Art. 26, II, da Lei 8.213/91: em acidente de qualquer natureza, o benefício por incapacidade temporária independe de carência, mesmo sem relação com o trabalho."}, {"id": "q70", "n": {"1": 70, "2": 69, "3": 70, "4": 69}, "p": "Jorge Almeida, servidor público federal, está vinculado a Regime Próprio de Previdência Social, para o qual realiza suas contribuições normalmente. Apesar da cobertura previdenciária que possui, Jorge procurou você, como advogado(a), para obter orientações quanto a uma possível nova filiação ao Regime Geral de Previdência Social. Sobre a situação hipotética narrada, assinale a afirmativa correta.", "o": ["Jorge, caso manifeste expressamente a vontade, poderá ser segurado facultativo do Regime Geral de Previdência Social.", "Jorge, em hipótese alguma, poderá filiar-se ao Regime Geral de Previdência Social de forma simultânea ao Regime Próprio de Previdência Social da União.", "Jorge poderá filiar-se ao Regime Geral de Previdência Social na condição de empregador doméstico, situação na qual poderá obter todos os benefícios desse regime.", "Jorge, caso desempenhe atividade remunerada lícita, concomitantemente ao seu cargo público federal, poderá ser filiado como segurado obrigatório do Regime Geral de Previdência Social."], "c": 3, "e": "Art. 12 da Lei 8.213/91: o servidor com RPPS que exerce atividade remunerada abrangida pelo RGPS é segurado obrigatório quanto a ela. Ele não pode ser facultativo (art. 201, §5º, da CF)."}]}, {"id": "trab", "nome": "Direito do Trabalho", "lei": "CLT", "peso": 5, "texto": "<p><strong>Banco de horas.</strong> Pode ser pactuado por <mark>acordo individual escrito</mark>, desde que a compensação ocorra no período máximo de <mark>seis meses</mark> <span class=\"art\">art. 59, §5º</span>. Por negociação coletiva, o prazo é de até um ano <span class=\"art\">§2º</span>. Horas não compensadas no prazo são pagas como extras, com adicional <span class=\"art\">§3º</span>.</p>\n<p><strong>Equiparação salarial.</strong> Exige identidade de função, trabalho de igual valor (mesma produtividade e perfeição técnica), mesmo empregador e mesmo estabelecimento, com diferença de tempo de serviço para o empregador <mark>não superior a quatro anos</mark> e na função <mark>não superior a dois anos</mark> <span class=\"art\">art. 461</span>. Só o quadro de carreira <mark>já existente</mark> afasta a equiparação; um quadro futuro não.</p>\n<p><strong>Estabilidade da gestante.</strong> Vai da confirmação da gravidez até cinco meses após o parto <span class=\"art\">ADCT, art. 10, II, b</span>. O <mark>desconhecimento do empregador não afasta</mark> o direito; garante-se reintegração ou, se exaurido o período, indenização <span class=\"art\">Súmula 244 TST</span>.</p>\n<p><strong>Descontos salariais.</strong> São vedados, salvo adiantamentos, lei ou norma coletiva <span class=\"art\">art. 462</span>. Em caso de dano causado pelo empregado, o desconto é lícito <mark>se houver acordo</mark> (dano culposo) ou <mark>na ocorrência de dolo</mark> <span class=\"art\">art. 462, §1º</span>.</p>\n<p><strong>Suspensão disciplinar.</strong> Suspensão por <mark>mais de 30 dias consecutivos</mark> importa rescisão injusta do contrato <span class=\"art\">art. 474</span>.</p>", "qs": [{"id": "q71", "n": {"1": 71, "2": 72, "3": 74, "4": 73}, "p": "Uma sociedade empresária do setor de varejo implementou um sistema de banco de horas para seus empregados, visando à flexibilização da jornada de trabalho. Por meio de acordo individual escrito, os empregados poderiam compensar as horas extras trabalhadas em até seis meses, limitando a compensação a um máximo de duas horas extras diárias. Após alguns meses de funcionamento, os empregados notaram que, em alguns perí
