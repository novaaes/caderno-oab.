<title>Caderno OAB</title>

<style>
/* Layout: app de uma coluna com três telas (Simulados, caderno do simulado, Salvamentos); barra de placar fixa no caderno; tudo com fontes do sistema para funcionar sem internet */
:root{
  --bg:#f3f5f8; --paper:#ffffff; --ink:#1a2233; --muted:#5b6578; --line:#d9dee8; --soft:#eef1f6;
  --pen:#2846a8; --pen-soft:#e6ebfa; --mark:#fff1a8;
  --ok:#1f7a4d; --ok-soft:#e2f3ea; --warn:#9a6a00; --warn-soft:#fbf0d4; --bad:#b0333a; --bad-soft:#f8e3e4;
  --b1:#2846a8; --b2:#0f7a6c; --b3:#a3478f; --b4:#b0561c; --b5:#5a51b8; --b6:#2b7a2b; --b7:#9c3e3e; --b8:#1f6f94;
  --read:Georgia,"Iowan Old Style","Times New Roman",serif;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12161e; --paper:#1a202b; --ink:#e4e8f0; --muted:#9aa3b5; --line:#2c3443; --soft:#222a37;
  --pen:#8ea6ff; --pen-soft:#232c45; --mark:#5a4d12;
  --ok:#5fcf95; --ok-soft:#173225; --warn:#e5b54a; --warn-soft:#352b12; --bad:#f07a80; --bad-soft:#3a1c1f;
  --b1:#8ea6ff; --b2:#4fc9b6; --b3:#e08bd0; --b4:#f0a066; --b5:#a9a2ff; --b6:#7fcf7f; --b7:#f08f8f; --b8:#6cc3eb; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161e; --paper:#1a202b; --ink:#e4e8f0; --muted:#9aa3b5; --line:#2c3443; --soft:#222a37;
  --pen:#8ea6ff; --pen-soft:#232c45; --mark:#5a4d12;
  --ok:#5fcf95; --ok-soft:#173225; --warn:#e5b54a; --warn-soft:#352b12; --bad:#f07a80; --bad-soft:#3a1c1f;
  --b1:#8ea6ff; --b2:#4fc9b6; --b3:#e08bd0; --b4:#f0a066; --b5:#a9a2ff; --b6:#7fcf7f; --b7:#f08f8f; --b8:#6cc3eb; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--paper)}
.wrap{max-width:820px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 72px}
/* barra do app */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--paper);border-bottom:1px solid var(--line)}
.appbar .in{max-width:820px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:10px}
.brand{font-family:var(--read);font-weight:700;font-size:18px;display:flex;align-items:center;gap:8px;margin-right:auto;min-width:0}
.bt{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.bt .txt{white-space:nowrap}
.brand .glyph{width:28px;height:28px;border-radius:8px;background:var(--pen);color:var(--paper);display:grid;place-items:center;font-size:17px;flex:none}
.tabs{display:flex;gap:4px}
.tab{border:0;background:transparent;color:var(--muted);font-weight:600;padding:7px 10px;border-radius:8px;cursor:pointer;font-size:14px}
.tab[aria-current="page"]{background:var(--pen-soft);color:var(--pen)}
.savedot{font-family:var(--ui);font-weight:500;font-size:11.5px;color:var(--muted);white-space:nowrap}
.savedot.on{color:var(--ok)}
/* comum */
h1{font-family:var(--read);font-size:28px;line-height:1.15;margin:20px 0 4px;text-wrap:balance}
.lede{color:var(--muted);margin:0 0 16px;max-width:66ch}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:16px}
.card h2{font-family:var(--read);font-size:19px;margin:0 0 4px}
.card p.sub{margin:0 0 10px;color:var(--muted);font-size:14px}
button{font-family:var(--ui);font-size:14px;cursor:pointer;border-radius:8px}
button:focus-visible,.opt:focus-within,a:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--pen);outline-offset:2px}
.btn{background:var(--pen);color:var(--paper);border:0;padding:10px 16px;font-weight:600}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--pen);border:1px solid var(--pen)}
.btn.danger{background:var(--bad);color:var(--paper)}
.btn.sm{padding:7px 11px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lnk{background:none;border:0;color:var(--pen);padding:0;font-weight:600;font-size:13px;text-decoration:underline;cursor:pointer}
.muted{color:var(--muted)}
.small{font-size:13px}
.notice{border-radius:10px;padding:10px 12px;font-size:14px;background:var(--pen-soft);margin-bottom:16px}
.notice.warn{background:var(--warn-soft)}
.notice.ok{background:var(--ok-soft)}
/* simulados */
.sims{display:flex;flex-direction:column;gap:12px}
.sim{display:flex;flex-direction:column;gap:10px}
.sim .tag{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--pen)}
.sim .tag.proprio{color:var(--b2)}
.sim .tag.imp{color:var(--b3)}
.prog{height:8px;border-radius:4px;background:var(--soft);overflow:hidden;display:flex}
.prog i{display:block;height:100%}
.prog i.ok{background:var(--ok)} .prog i.rv{background:var(--warn)}
.stats{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.stats b{color:var(--ink)}
/* placar */
.score{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--abh,56px));z-index:10;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:12px 0 14px;box-shadow:0 4px 14px rgba(20,30,60,.06)}
.chip{display:flex;flex-direction:column;gap:2px;min-width:0}
.chip b{font-size:20px;font-variant-numeric:tabular-nums;line-height:1}
.chip span{font-size:11.5px;color:var(--muted);line-height:1.2}
.chip.ok b{color:var(--ok)} .chip.luck b{color:var(--warn)} .chip.bad b,.chip.trap b{color:var(--bad)} .chip.tot b{color:var(--pen)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.seg-group{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--paper)}
.seg-group button{border:0;border-radius:0;background:transparent;color:var(--ink);padding:7px 10px;font-size:13px;font-weight:600}
.seg-group button+button{border-left:1px solid var(--line)}
.seg-group button[aria-pressed="true"]{background:var(--pen);color:var(--paper)}
.tg{font-size:12px;color:var(--muted);font-weight:600}
.switch{border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:7px 11px;font-size:13px;font-weight:600}
.switch[aria-pressed="true"]{background:var(--pen);border-color:var(--pen);color:var(--paper)}
.inline-confirm{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--warn-soft);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.inline-confirm input{flex:1 1 180px;min-width:0;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--paper);color:var(--ink);font:inherit}
nav.idx{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
nav.idx a{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:13px}
nav.idx a .pg{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px}
nav.idx a.done{border-color:var(--ok)} nav.idx a.done .pg{color:var(--ok);font-weight:700}
section.tema{background:var(--paper);border:1px solid var(--line);border-radius:14px;margin-bottom:20px;overflow:hidden;scroll-margin-top:150px}
.tema-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:16px 18px 0;flex-wrap:wrap}
.tema-head h2{font-family:var(--read);font-size:21px;margin:0;text-wrap:balance}
.pq{font-size:12px;font-weight:700;color:var(--pen);background:var(--pen-soft);border-radius:999px;padding:3px 10px;white-space:nowrap}
.lei{font-size:12px;color:var(--muted);font-weight:600;padding:2px 18px 0}
.blk-t{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:16px 18px 4px}
.texto{font-family:var(--read);font-size:16.5px;line-height:1.65;padding:0 18px 4px;max-width:70ch}
.texto p{margin:8px 0} .texto ul{margin:8px 0;padding-left:20px} .texto li{margin:5px 0}
mark{background:var(--mark);color:inherit;padding:0 2px;border-radius:2px}
.art{font-family:var(--ui);font-size:12px;font-weight:700;color:var(--pen);white-space:nowrap}
/* mapa mental */
.mm{padding:6px 18px 8px;overflow:hidden}
.mm-root{display:inline-block;font-family:var(--read);font-weight:700;font-size:17px;background:var(--ink);color:var(--paper);border-radius:999px;padding:7px 16px}
.mm-branches{list-style:none;margin:0 0 0 18px;padding:10px 0 0;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:10px}
.mm-br{position:relative;padding-left:20px}
.mm-br::before{content:"";position:absolute;left:0;top:15px;width:16px;border-top:2px solid var(--line)}
.mm-br:last-child::after{content:"";position:absolute;left:-2px;top:16px;bottom:0;width:2px;background:var(--paper)}
.mm-br summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:14.5px;color:var(--c);border:2px solid var(--c);border-radius:999px;padding:4px 12px;background:var(--paper)}
.mm-br summary::-webkit-details-marker{display:none}
.mm-br summary::after{content:"−";opacity:.7}
.mm-br details:not([open]) summary::after{content:"+"}
.mm-leaves{list-style:none;margin:6px 0 2px 14px;padding:0 0 0 14px;border-left:2px dotted var(--c);display:flex;flex-direction:column;gap:5px}
.mm-leaves li{position:relative;font-size:14px;line-height:1.45;padding:4px 0 4px 2px;min-width:0}
.mm-leaves li::before{content:"";position:absolute;left:-14px;top:13px;width:10px;border-top:2px dotted var(--c)}
.c1{--c:var(--b1)} .c2{--c:var(--b2)} .c3{--c:var(--b3)} .c4{--c:var(--b4)} .c5{--c:var(--b5)} .c6{--c:var(--b6)} .c7{--c:var(--b7)} .c8{--c:var(--b8)}
.mm-tools{display:flex;gap:12px;padding:0 18px;flex-wrap:wrap}
.peg{margin:4px 18px;padding:12px 14px;border-radius:10px;background:var(--warn-soft)}
.peg ul{margin:0;padding-left:18px} .peg li{margin:4px 0;font-size:14px}
.gate{padding:14px 18px 18px;border-top:1px dashed var(--line);margin-top:14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.gate small{color:var(--muted)}
.qs{padding:4px 18px 18px;display:flex;flex-direction:column;gap:18px;border-top:1px dashed var(--line);margin-top:14px}
.q{padding-top:14px;display:flex;flex-direction:column;gap:10px;scroll-margin-top:150px}
.q+.q{border-top:1px solid var(--line)}
.q .n{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.q .n .anul{color:var(--warn);margin-left:6px}
.q .prompt{margin:0;font-family:var(--read);font-size:16px;line-height:1.6;max-width:70ch}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:9px 11px;cursor:pointer;background:var(--paper)}
.opt input{margin-top:3px;accent-color:var(--pen);flex:none}
.opt span{min-width:0}
.opt.sel{border-color:var(--pen);background:var(--pen-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.conf{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.conf .lbl{font-size:13px;color:var(--muted);margin-right:2px}
.segb{border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:7px 12px}
.segb[aria-pressed="true"]{border-color:var(--pen);background:var(--pen);color:var(--paper)}
.fb{border-radius:8px;padding:10px 12px;font-size:14px}
.fb.ok{background:var(--ok-soft)} .fb.luck,.fb.anul{background:var(--warn-soft)} .fb.bad,.fb.trap{background:var(--bad-soft)}
.fb strong{display:block;margin-bottom:3px}
body.so-mapas .texto, body.so-mapas .blk-t.lt, body.so-mapas .gate, body.so-mapas .qs{display:none}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;margin:6px 0 12px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{text-align:left;padding:6px;border-bottom:1px solid var(--line)}
.tbl th{font-size:12px;color:var(--muted);font-weight:600}
.tbl .num{text-align:right}
.tblwrap{overflow-x:auto}
.review ul{margin:8px 0 12px;padding-left:20px} .review li{margin:5px 0}
/* salvamentos */
.saves{display:flex;flex-direction:column;gap:8px}
.save{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.save .top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline}
.save .nm{font-weight:700;min-width:0}
.save .when{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.pill{font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;background:var(--soft);color:var(--muted);margin-left:6px}
textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--paper);color:var(--ink);font:13px/1.4 ui-monospace,Menlo,Consolas,monospace}
input[type=file]{font:inherit;font-size:13px;max-width:100%}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-size:14px;z-index:30;max-width:calc(100% - 32px);text-align:center}
.update{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:29;background:var(--paper);border:1px solid var(--pen);border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;box-shadow:0 6px 20px rgba(20,30,60,.15);max-width:560px;margin:0 auto}
@media (max-width:600px){
  .score{grid-template-columns:repeat(5,minmax(0,1fr));padding:8px 10px;gap:6px}
  .chip b{font-size:17px} .chip span{font-size:10.5px}
  h1{font-size:24px}
  .mm{padding-left:12px;padding-right:12px} .mm-branches{margin-left:12px}
  .bt .txt{font-size:16px}
  .tab{padding:7px 8px}
}
@media (prefers-reduced-motion:no-preference){.qs{animation:in .25s ease-out}@keyframes in{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>

</head>

<script>
const BUILTIN=[{"id": "oab47", "titulo": "47º Exame de Ordem", "sub": "Prova real da FGV · aplicada em 06/09/2026", "tipo": "real", "tipos": ["1", "2", "3", "4"], "fonte": "Questões dos cadernos Tipo 1 a 4 do 47º Exame de Ordem Unificado (FGV/CFOAB) e gabarito definitivo. Resumos e comentários são material de estudo.", "disc": [{"id": "etica", "nome": "Ética Profissional", "lei": "Lei 8.906/94 (EAOAB)", "peso": 8, "texto": "<p><strong>Responsabilidade civil.</strong> O titular de sociedade individual de advocacia e os sócios respondem <mark>subsidiária e ilimitadamente</mark> pelos danos causados aos clientes por ação ou omissão no exercício da advocacia, sem prejuízo da responsabilidade disciplinar <span class=\"art\">art. 17</span>.</p>\n<p><strong>Quem pode advogar.</strong> A atividade de advocacia no Brasil é privativa dos <mark>inscritos na OAB</mark> <span class=\"art\">arts. 1º e 3º</span>. Diploma ou inscrição em ordem estrangeira não substitui a inscrição aqui. A parte só postula sem advogado nas exceções legais (como Juizados Especiais em certos valores e habeas corpus).</p>\n<p><strong>Procuração.</strong> O advogado atua provando o mandato, mas, <mark>em caso de urgência</mark>, pode atuar sem procuração, obrigando-se a apresentá-la <mark>em 15 dias, prorrogável por igual período</mark> <span class=\"art\">art. 5º, §1º</span>.</p>\n<p><strong>Sigilo.</strong> É direito do advogado recusar-se a depor como testemunha sobre fato relacionado a quem seja ou foi seu cliente, <mark>mesmo se autorizado ou solicitado</mark> por ele <span class=\"art\">art. 7º, XIX</span>.</p>\n<p><strong>Impedimento de parlamentar.</strong> Membros do Poder Legislativo (que não integrem as Mesas) são <mark>impedidos</mark>, não incompatíveis: não podem advogar contra ou a favor de pessoas jurídicas de direito público, empresas públicas, sociedades de economia mista, fundações públicas, paraestatais e concessionárias ou permissionárias de serviço público, <mark>de qualquer esfera</mark> <span class=\"art\">art. 30, II</span>. Os membros das Mesas são incompatíveis <span class=\"art\">art. 28, I</span>.</p>\n<p><strong>Processo disciplinar.</strong> Tramita <mark>em sigilo até o término</mark>; só as partes, seus defensores e a autoridade judiciária competente têm acesso <span class=\"art\">art. 72, §2º</span>.</p>\n<p><strong>Sanções.</strong> São censura, suspensão, exclusão e multa <span class=\"art\">art. 35</span>. A censura <mark>não pode ser objeto de publicidade</mark> <span class=\"art\">art. 35, parágrafo único</span>. Aposentadoria compulsória é sanção da magistratura, não da advocacia.</p>\n<p><strong>Inscrição suplementar.</strong> Exigida quando há exercício habitual em outro estado, assim entendido o patrocínio de <mark>mais de cinco causas por ano</mark> em cada unidade federativa <span class=\"art\">art. 10, §2º</span>.</p>", "qs": [{"id": "q1", "n": {"1": 1, "2": 7, "3": 5, "4": 8}, "p": "O advogado Fabrício foi contratado pelo Banco Alfa, por meio de sua sociedade individual de advocacia, para representá-lo em todas as ações de responsabilidade civil, no Estado Beta. No exercício da representação, Fabrício, por estar viajando a lazer, perdeu o prazo de contestação em 25 ações ajuizadas contra o banco. Como consequência, foi decretada a revelia e, com a presunção de veracidade dos fatos alegados nas petições iniciais, o Banco Alfa foi condenado a pagar um alto montante em indenizações, sem que fosse analisada a sua culpa. Sobre a responsabilidade pessoal de Fabrício pelos danos causados ao banco, com base no disposto no Estatuto da Advocacia e da OAB, assinale a afirmativa correta.", "o": ["Fabrício responde de forma subsidiária e ilimitada pelos danos causados ao Banco Alfa, sem prejuízo da responsabilidade disciplinar que pode ser apurada em virtude de sua omissão.", "Fabrício responde de forma solidária com a sociedade individual de advocacia pelos danos causados ao Banco Alfa, uma vez que sua responsabilidade é compartilhada com a sociedade.", "Fabrício não pode ser responsabilizado pelos danos causados ao Banco Alfa, pois a sua sociedade individual de advocacia limita a sua responsabilidade pessoal pelas ações no exercício da advocacia.", "A responsabilidade de Fabrício pelos danos causados ao Banco Alfa é limitada, devendo ser assumida apenas pela sociedade individual de advocacia, uma vez que a sociedade detém a personalidade jurídica."], "c": 0, "e": "Art. 17 do EAOAB: o titular da sociedade individual responde subsidiária e ilimitadamente pelos danos causados ao cliente, além da responsabilidade disciplinar."}, {"id": "q2", "n": {"1": 2, "2": 3, "3": 7, "4": 1}, "p": "Johannes, finlandês e advogado em seu país de origem, sofreu um acidente de trânsito durante uma viagem ao Brasil. O causador do incidente, Gustavo, estava dirigindo alcoolizado, o que resultou em danos ao veículo de Johannes e despesas hospitalares. Desejando ajuizar ação para ressarcimento, Johannes entende que, por ser advogado na Finlândia, não precisa estar inscrito na OAB para atuar no caso. A ação não será ajuizada nos Juizados Especiais, tampouco estará sujeita ao rito sumaríssimo. Diante dessa situação hipotética, assinale a afirmativa correta.", "o": ["Johannes poderá atuar como advogado no caso, desde que tenha a inscrição suplementar na Seccional da OAB competente para o local onde a ação será proposta.", "Johannes não pode exercer a advocacia no Brasil sem estar inscrito na Ordem dos Advogados do Brasil, independentemente de sua qualificação como advogado na Finlândia.", "Johannes pode atuar livremente como advogado no processo judicial, por já possuir inscrição válida na Finlândia, desde que comprove a sua habilitação perante o Juízo brasileiro.", "Johannes poderá ajuizar a ação como parte autora sem necessidade de advogado, visto que os danos materiais e hospitalares são direitos disponíveis que dispensam a assistência jurídica em juízo comum."], "c": 1, "e": "Arts. 1º e 3º do EAOAB: a advocacia no Brasil é privativa dos inscritos na OAB. A habilitação na Finlândia não dispensa a inscrição, e a causa não está entre as exceções em que a parte postula sozinha."}, {"id": "q3", "n": {"1": 3, "2": 4, "3": 2, "4": 6}, "p": "Benício, acometido de câncer em processo de metástase em estágio avançado, necessita urgentemente de medicamentos essenciais para o seu tratamento, reiteradamente negados pela Secretaria de Saúde. Diante dessa situação, solicitou a Pedro, seu vizinho e advogado, devidamente inscrito na OAB, que ajuíze uma ação com pedido de tutela de urgência para garantir o fornecimento imediato do tratamento médico prescrito. Contudo, devido ao seu estado precário de saúde, Benício não está, temporariamente, em condições de assinar a procuração que outorga poderes a Pedro para representá-lo. Com base no Estatuto da Advocacia e da OAB e diante da urgência da situação, assinale a afirmativa correta.", "o": ["A ausência de procuração impede qualquer postulação em juízo ou atividade de consultoria e assessoria jurídica, que não dispensam a outorga de mandato.", "Pedro poderá atuar sem a procuração por tempo indeterminado, independentemente da recuperação da saúde de Benício e da manutenção do estado de urgência.", "Pedro não poderá atuar judicialmente sem a apresentação da procuração assinada por Benício, pois a outorga do mandato é imprescindível para a validade de qualquer petição inicial.", "Pedro poderá atuar imediatamente sem a procuração, devendo apresentar o documento no prazo máximo de 15 dias, prorrogável por igual período, conforme previsto no Estatuto da OAB."], "c": 3, "e": "Art. 5º, §1º do EAOAB: em caso de urgência, o advogado pode atuar sem procuração, devendo apresentá-la em 15 dias, prorrogáveis por igual período."}, {"id": "q4", "n": {"1": 4, "2": 8, "3": 6, "4": 5}, "p": "Tiago, advogado regularmente inscrito na OAB, atuou na defesa de Otávio em um processo criminal que investigava a prática do crime de estelionato por este último. Além disso, Tiago também prestava serviços jurídicos para a empresa de Otávio, a qual teria sido utilizada como instrumento para a prática do delito. Durante a fase de especificação de provas, o Ministério Público requereu a oitiva de Tiago como testemunha, alegando que ele possuía informações relevantes sobre os fatos, o que foi deferido pelo Magistrado. Sobre a hipótese apresentada, com base no Estatuto da Advocacia e da OAB, assinale a afirmativa correta.", "o": ["Tiago deve depor como testemunha, desde que seu cliente Otávio autorize formalmente a prestação das informações necessárias.", "Tiago somente poderá recusar-se a depor caso o Tribunal de Ética e Disciplina da OAB autorize previamente tal negativa com base na avaliação de conflito ético.", "Tiago pode recusar-se a depor sobre os fatos relacionados ao caso, independentemente de autorização de Otávio, pois tal depoimento estaria acobertado pelo sigilo profissional.", "Tiago está obrigado a prestar depoimento como testemunha, pois a prestação de serviços para a empresa de Otávio não se confunde com o sigilo profissional mantido em relação à defesa pessoal do acusado."], "c": 2, "e": "Art. 7º, XIX do EAOAB: o advogado pode recusar-se a depor sobre fato relacionado a cliente, ainda que este autorize. Não depende de autorização do cliente nem do TED."}, {"id": "q5", "n": {"1": 5, "2": 6, "3": 8, "4": 7}, "p": "Arnaldo, deputado federal em pleno exercício do mandato parlamentar, que não integra a Mesa Diretora da Câmara dos Deputados, nem como titular nem como substituto, resolveu manter ativa a sua inscrição na Ordem dos Advogados do Brasil, deliberando por cumular as duas funções. A respeito dessa situação, considerando as disposições do Estatuto da Advocacia e da OAB, assinale a afirmativa correta.", "o": ["Arnaldo deve ter a sua inscrição na OAB cancelada, por passar a exercer, em caráter definitivo, atividade incompatível com o exercício da advocacia.", "Arnaldo deveria requerer licença da Ordem, por passar a exercer, em caráter temporário, uma atividade incompatível com o exercício da advocacia.", "Arnaldo não incorrerá em qualquer irregularidade no exercício da advocacia, desde que não postule contra ou a favor das pessoas jurídicas de direito público, empresas públicas, sociedades de economia mista, fundações públicas, entidades paraestatais ou empresas concessionárias ou permissionárias de serviço público, vinculadas a qualquer das esferas de governo (municipal, estadual ou federal).", "Arnaldo somente incorrerá em irregularidade no exercício da advocacia se postular contra ou a favor das pessoas jurídicas de direito público, empresas públicas, sociedades de economia mista, fundações públicas, entidades paraestatais ou empresas concessionárias ou permissionárias de serviço público, vinculadas à União, não existindo vedação de atuação em face de entidades estaduais ou municipais."], "c": 2, "e": "Art. 30, II do EAOAB: parlamentar fora da Mesa está apenas impedido, em relação às pessoas jurídicas de direito público e entidades ligadas ao poder público de qualquer das esferas (municipal, estadual ou federal). A alternativa D erra ao limitar à União."}, {"id": "q6", "n": {"1": 6, "2": 2, "3": 3, "4": 4}, "p": "O advogado João responde a processo disciplinar no Tribunal de Ética e Disciplina do Conselho Seccional da OAB, em razão de denúncia de que teria recebido valores da parte contrária relativos ao objeto do mandato sem a autorização expressa de seu cliente. O relator do processo, o advogado Paulo, entendeu que, em nome do princípio da publicidade e da transparência, o procedimento deveria tramitar de forma pública, permitindo que terceiros interessados tivessem acesso aos autos e acompanhassem os atos do processo. Sobre a decisão de Paulo, com base no Estatuto da Advocacia e da OAB, assinale a afirmativa correta.", "o": ["Está correta, porque o princípio da publicidade deve prevalecer em processos que envolvam a ética profissional, por seu interesse coletivo.", "É válida, desde que homologada pela presidência do Tribunal de Ética e Disciplina da OAB, pois o relator não tem competência isolada para afastar o sigilo processual.", "Pode ser mantida, se o advogado João concordar expressamente com a publicidade e a infração praticada não for infamante, tornando desnecessária a manutenção do sigilo legal.", "Está incorreta, porque o processo disciplinar deve tramitar em sigilo até o seu término, e somente as partes, seus defensores e a autoridade judiciária competente têm acesso às suas informações."], "c": 3, "e": "Art. 72, §2º do EAOAB: o processo disciplinar tramita em sigilo até o seu término, com acesso apenas das partes, defensores e autoridade judiciária competente."}, {"id": "q7", "n": {"1": 7, "2": 5, "3": 1, "4": 3}, "p": "Durante uma conversa no departamento jurídico de uma sociedade empresária de aviação civil, o advogado sênior Antônio debate com José, recém-ingresso nos quadros da OAB, sobre as sanções disciplinares aplicáveis aos advogados. No diálogo, José afirma que, em casos graves, poderia ser aplicada ao advogado a pena de aposentadoria compulsória da função de advogado, especialmente quando se tratar de advogado empregado. Por sua vez, Antônio afirma que o Estatuto da OAB prevê as seguintes sanções disciplinares: censura pública, suspensão, exclusão e multa. Sobre o caso apresentado, com base no Estatuto da Advocacia e da OAB, assinale a afirmativa correta.", "o": ["José está correto, pois a aposentadoria compulsória é sanção disciplinar aplicável a advogados empregados; Antônio também está correto ao indicar a existência das sanções de censura pública, suspensão, exclusão e multa.", "José está incorreto, pois a aposentadoria compulsória não constitui sanção disciplinar aplicável ao advogado; Antônio também está incorreto ao afirmar que a censura é pública, já que a sanção de censura não pode ser objeto de publicidade.", "José está incorreto, pois a aposentadoria compulsória não é sanção disciplinar prevista no Estatuto da OAB, enquanto Antônio está totalmente correto ao afirmar que as sanções disciplinares são censura pública, suspensão, exclusão e multa.", "José está correto ao afirmar que a aposentadoria compulsória pode ser aplicada como sanção disciplinar a advogados empregados, enquanto Antônio erra ao afirmar que a multa está entre as sanções disciplinares previstas no Estatuto da OAB."], "c": 1, "e": "Art. 35 e parágrafo único do EAOAB: as sanções são censura, suspensão, exclusão e multa, e a censura não pode ser objeto de publicidade. Aposentadoria compulsória não existe para advogados. Os dois erraram."}, {"id": "q8", "n": {"1": 8, "2": 1, "3": 4, "4": 2}, "p": "O advogado Rogério possui domicílio profissional em João Pessoa, PB, onde mantém a sede principal de sua atividade advocatícia. Buscando ampliar sua renda, embora não pretenda estabelecer escritório em outras localidades, Rogério passou a atuar eventualmente nas capitais nordestinas próximas. Nesse contexto, assumiu o patrocínio de duas causas em Recife, PE, e quatro causas em Natal, RN, ao longo do mesmo ano. À luz do Estatuto da Advocacia e da OAB, assinale a afirmativa correta.", "o": ["Rogério deverá promover a inscrição suplementar apenas no Conselho Seccional do Rio Grande do Norte, pois a intervenção judicial que exceder três causas por ano caracteriza habitualidade.", "Rogério não precisa promover a inscrição suplementar nem em Pernambuco nem no Rio Grande do Norte, pois a atuação em até cinco causas por ano em cada unidade federativa não caracteriza exercício habitual da profissão.", "Rogério deverá promover a inscrição suplementar apenas no Conselho Seccional de Pernambuco, pois a atuação em dois processos nessa unidade federativa já caracteriza exercício habitual da advocacia naquele território.", "Rogério deverá promover a inscrição suplementar tanto no Conselho Seccional de Pernambuco quanto no do Rio Grande do Norte, pois qualquer atuação profissional fora do território da inscrição principal exige a inscrição suplementar."], "c": 1, "e": "Art. 10, §2º do EAOAB: habitualidade é a intervenção em mais de cinco causas por ano em outra unidade federativa. Com duas causas em PE e quatro no RN, não há habitualidade em nenhum dos dois estados."}]}, {"id": "filo", "nome": "Filosofia do Direito", "lei": "Jusnaturalismo, positivismo e Rousseau", "peso": 2, "texto": "<p><strong>Jusnaturalismo.</strong> Sustenta que há <mark>direitos anteriores e superiores</mark> ao direito posto, derivados da natureza humana ou da razão. Uma lei que os contraria pode ser contestada como injusta, mesmo que aprovada pelo procedimento correto.</p>\n<p><strong>Positivismo jurídico clássico.</strong> <mark>Separa direito e moral</mark>: a validade da norma decorre de ter sido produzida pela autoridade e pelo procedimento previstos no ordenamento, não de seu conteúdo moral.</p>\n<p><strong>Rousseau e a vontade geral.</strong> A vontade geral não é a soma das vontades particulares (a \"vontade de todos\") nem a vontade da maioria. Ela visa ao <mark>interesse comum</mark>. Por isso, a lei, como expressão da vontade geral, deve ser <mark>geral e abstrata</mark>: deve vir de todos e aplicar-se a todos, e não se dirigir a pessoas determinadas ou a interesses setoriais.</p>", "qs": [{"id": "q9", "n": {"1": 9, "2": 9, "3": 10, "4": 10}, "p": "Em um determinado país, o Poder Legislativo aprovou uma lei que restringiu severamente a liberdade de expressão nas redes sociais, proibindo críticas aos governantes sob pena de sanções administrativas e penais. Um grupo de cidadãos ingressa com ação judicial alegando que, embora tenha sido regularmente aprovada conforme o devido processo legislativo, a lei em questão viola direitos fundamentais inerentes à pessoa humana, que deveriam prevalecer independentemente da norma vigente. Com base nas correntes do jusnaturalismo e do positivismo jurídico, assinale a afirmativa correta.", "o": ["O jusnaturalismo afirma que toda lei regularmente aprovada deve ser obedecida, independentemente de seu conteúdo moral.", "O positivismo jurídico e o jusnaturalismo concordam que a validade da norma depende exclusivamente do procedimento legislativo adotado.", "O positivismo jurídico sustenta que a validade da lei depende de sua conformidade com os princípios morais universais, razão pela qual a norma deve ser invalidada.", "O jusnaturalismo sustenta que existem direitos anteriores e superiores ao direito positivo, que podem fundamentar a contestação de leis injustas, enquanto o positivismo jurídico, em sua forma clássica, separa a validade da lei de seu conteúdo moral."], "c": 3, "e": "O jusnaturalismo admite direitos superiores ao direito positivo, que fundamentam a contestação de leis injustas. O positivismo clássico separa validade e conteúdo moral. As demais alternativas invertem as correntes."}, {"id": "q10", "n": {"1": 10, "2": 10, "3": 9, "4": 9}, "p": "Leia o trecho a seguir. “A vontade geral é mais que simplesmente a vontade de todos (somatória dos interesses particulares), pois aquela visa à realização do interesse comum e público, e esta visa aos interesses particulares. Mais que isso, deve-se esclarecer que a vontade geral não está lastreada na ideia de unanimidade; ela não é geral por ser unânime, por não haver discordância, mas porque nela estarão contadas todas as ideias, todas as contribuições.” (ROUSSEAU, Jean-Jacques. O Contrato Social. Rio de Janeiro: Nova Fronteira, 2011) Com base na Filosofia do Direito de Jean-Jacques Rousseau, assinale a afirmativa correta.", "o": ["A vontade geral, embora distinta da soma das vontades individuais, pode legitimar leis de conteúdo particularizado, desde que estas promovam utilidade social imediata.", "A vontade geral, enquanto expressão do consenso majoritário, legitima a prevalência de interesses predominantes na sociedade, ainda que estes não correspondam ao bem comum.", "A vontade geral, por visar ao interesse comum, impõe a generalidade e a abstração das leis, sendo incompatível com a produção normativa voltada aos destinatários determinados ou interesses setoriais.", "A vontade geral coincide com a vontade da maioria, desde que formalmente expressa por meio do procedimento legislativo, sendo irrelevante a distinção entre interesse comum e interesses particulares."], "c": 2, "e": "Para Rousseau, a vontade geral visa ao interesse comum, o que exige leis gerais e abstratas, incompatíveis com normas voltadas a destinatários determinados ou interesses setoriais."}]}, {"id": "const", "nome": "Direito Constitucional", "lei": "CF/88", "peso": 6, "texto": "<p><strong>Iniciativa sobre organização judiciária.</strong> Compete <mark>privativamente aos tribunais</mark> propor ao Legislativo a criação de novas varas judiciárias <span class=\"art\">art. 96, I, d</span>. Projeto do Governador sobre o tema tem vício formal de iniciativa.</p>\n<p><strong>Intervenção do Estado no Município.</strong> O Estado pode intervir quando o Município <mark>não aplicar o mínimo exigido</mark> da receita na manutenção e desenvolvimento do ensino e nas ações de saúde <span class=\"art\">art. 35, III</span>. Nessa hipótese, o Governador decreta de ofício (intervenção espontânea), sem necessidade de provimento judicial. A requisição do TJ só é exigida no inciso IV (princípios da Constituição Estadual, execução de lei, ordem ou decisão).</p>\n<p><strong>Recepção.</strong> Lei anterior à CF/88 é recepcionada se for <mark>materialmente compatível</mark> com a nova Constituição. A compatibilidade formal é aferida em relação à Constituição da época em que a lei foi editada; mudança de forma exigida (por exemplo, lei ordinária onde hoje se exige lei complementar) não impede a recepção.</p>\n<p><strong>Limites da medida provisória.</strong> É vedada MP sobre <mark>direito eleitoral</mark>, partidos e direitos políticos, entre outras matérias <span class=\"art\">art. 62, §1º, I, a</span>. Novas inelegibilidades, aliás, exigem lei complementar <span class=\"art\">art. 14, §9º</span>.</p>\n<p><strong>Desapropriação.</strong> Legislar sobre desapropriação é competência <mark>privativa da União</mark> <span class=\"art\">art. 22, II</span>, e a indenização deve ser <mark>prévia, justa e em dinheiro</mark> <span class=\"art\">art. 5º, XXIV</span>.</p>\n<p><strong>Extradição.</strong> Brasileiro nato nunca é extraditado. O naturalizado pode ser em caso de <mark>crime comum praticado antes da naturalização</mark> ou de comprovado envolvimento em tráfico de drogas <span class=\"art\">art. 5º, LI</span>.</p>", "qs": [{"id": "q11", "n": {"1": 11, "2": 14, "3": 16, "4": 12}, "p": "O Estado Alfa apresentou um aumento significativo no número de processos judiciais em determinada comarca, o que gerou uma sobrecarga de serviço na única Vara Judiciária existente, com reflexos negativos para os advogados que ali atuavam. Diante dessa situação, o Governador do Estado encaminhou à Assembleia Legislativa um projeto de lei propondo a criação de três novas Varas Judiciárias na referida comarca, sob o argumento de que a ampliação da estrutura do Poder Judiciário é essencial para garantir o acesso à Justiça. O projeto foi aprovado pela Assembleia Legislativa e sancionado pelo Governador, tornando-se lei estadual. Um legitimado à deflagração do controle concentrado de constitucionalidade consultou você, como advogado(a), a respeito da conformidade constitucional desse diploma normativo. Em relação à referida lei estadual, assinale a opção que expressa a resposta correta a ser dada.", "o": ["Atende aos pressupostos constitucionais, pois o aumento da demanda processual justifica a criação de novas Varas Judiciárias, medida que pode ser proposta pelo chefe do Poder Executivo Estadual.", "É válida, desde que o Tribunal de Justiça do Estado Alfa tenha manifestado concordância prévia com o projeto de lei, conditio sine qua non para o seguimento do processo legislativo no âmbito da Assembleia Legislativa de Alfa.", "Não observa a disciplina constitucional aplicável ao tema, pois a iniciativa para a criação das novas Varas Judiciárias, nas circunstâncias apresentadas, compete privativamente ao Tribunal de Justiça do Estado Alfa, não ao Governador.", "É dissonante do sistema constitucional brasileiro, pois a criação de novas Varas Judiciárias deve ser promovida por iniciativa de parlamentares ou do próprio Poder Judiciário, cabendo ao Poder Legislativo a análise da respectiva proposição."], "c": 2, "e": "Art. 96, I, d, da CF: a iniciativa de lei para criar novas varas é privativa do Tribunal de Justiça. Houve vício de iniciativa do Governador."}, {"id": "q12", "n": {"1": 12, "2": 13, "3": 15, "4": 11}, "p": "A Controladoria-Geral do Estado Beta constatou que o Prefeito do Município Alfa se recusou reiteradamente a aplicar recursos do FUNDEB na manutenção e no desenvolvimento do ensino, desviando-os para outras finalidades, em desacordo com as exigências legais. O Tribunal de Contas Estadual, por sua vez, emitiu parecer reforçando o descumprimento do percentual mínimo constitucionalmente exigido para gastos em educação. Após relatório detalhado, o Governador do Estado Beta decretou a intervenção no Município, determinando a adoção de providências em relação aos atos administrativos irregulares e nomeando um interventor provisório para o setor educacional. O Prefeito do Município Alfa consultou você, como Procurador(a)- Geral desse ente federativo, em relação à compatibilidade da intervenção decretada com a Constituição da República. Quanto à constitucionalidade da medida adotada, considerando o sistema jurídico-constitucional brasileiro, assinale a afirmativa correta.", "o": ["A medida é válida, pois o texto constitucional autoriza a decretação espontânea da intervenção pelo Governador de Beta, sem necessidade de autorização judicial ou ação prévia.", "A intervenção estadual somente seria possível se, após o ajuizamento de ação civil pública por órgão legitimado, o Poder Judiciário confirmasse o desvio de finalidade na aplicação dos recursos.", "A intervenção é constitucional, desde que previamente autorizada pelo Tribunal de Justiça do Estado Beta, pois interfere na autonomia política do ente municipal (Município Alfa) e exige controle jurisdicional.", "Trata-se de hipótese de inconstitucionalidade formal, uma vez que qualquer intervenção estadual deve ser previamente submetida ao crivo do Poder Legislativo estadual para assegurar o princípio da separação de Poderes."], "c": 0, "e": "Art. 35, III, da CF: a não aplicação do mínimo constitucional em educação autoriza a intervenção estadual decretada diretamente pelo Governador, sem prévia ação ou autorização judicial."}, {"id": "q13", "n": {"1": 13, "2": 12, "3": 11, "4": 15}, "p": "Uma sociedade empresária, que atua em setor regulado, procurou seu escritório para esclarecer se normas constantes de determinada lei federal editada em 1985 (Lei nº X/1985), ainda aplicadas por órgãos administrativos, permanecem válidas após a promulgação da Constituição da República de 1988. A sociedade questiona quais critérios devem ser observados para se afirmar que a referida lei foi recepcionada pela nova ordem constitucional. Sobre a recepção das normas da referida lei pré-constitucional, segundo o sistema jurídico-constitucional brasileiro vigente, assinale a afirmativa correta.", "o": ["Decorre exclusivamente da compatibilidade formal (inclusive procedimental) das mencionadas normas com a Constituição da República de 1988.", "Depende de sua compatibilidade simultânea, tanto formal (inclusive procedimental) quanto material, com as normas da Constituição da República de 1988.", "É necessária e automática, já que a compatibilidade formal (inclusive procedimental) e a material somente devem ser aferidas em relação à Constituição anterior.", "Deve ser analisada na perspectiva da compatibilidade material, mas não da compatibilidade formal (inclusive procedimental), com a Constituição da República de 1988."], "c": 3, "e": "Na recepção, analisa-se apenas a compatibilidade material com a nova Constituição. A forma é avaliada à luz da Constituição vigente quando a lei foi feita."}, {"id": "q14", "n": {"1": 14, "2": 16, "3": 12, "4": 13}, "p": "O Presidente da República editou medida provisória estabelecendo novas hipóteses de inelegibilidade aplicáveis a candidatos que tenham exercido funções públicas estratégicas nos dois anos anteriores a cada eleição. Parlamentares questionam a validade do ato, alegando vício formal na escolha do instrumento normativo. Na qualidade de advogado(a) consultado sobre o tema, segundo o sistema constitucional brasileiro, assinale a afirmativa correta.", "o": ["A validade da providência dependerá exclusivamente do momento da edição do diploma normativo, considerando o calendário eleitoral, sendo irrelevante a natureza do instrumento utilizado.", "O ato normativo editado é compatível com a Constituição da República, desde que observados os pressupostos de relevância e urgência, assegurada a sua apreciação pelo Congresso Nacional.", "O instrumento adotado revela-se formalmente inadequado, pois a Constituição impede a utilização dessa espécie normativa para disciplinar certas matérias, entre as quais aquela indicada na narrativa.", "O diploma mencionado não poderá subsistir no ordenamento jurídico, ainda que seja posteriormente aprovado pelo Poder Legislativo, pois as hipóteses de inelegibilidade estão previstas de maneira exauriente na ordem constitucional."], "c": 2, "e": "Art. 62, §1º, I, a, da CF: é vedada medida provisória sobre direito eleitoral e direitos políticos. O vício é formal, pelo instrumento escolhido."}, {"id": "q15", "n": {"1": 15, "2": 11, "3": 14, "4": 16}, "p": "O Município Alfa editou a Lei nº X, instituindo o Programa Municipal de Proteção dos Direitos Humanos e Promoção da Segurança Urbana. Entre as medidas previstas, foi estabelecido que poderiam ser declarados de utilidade pública, para fins de desapropriação, os imóveis urbanos nos quais fossem praticados atos ilícitos com violência contra a pessoa, acrescentando que a indenização ao proprietário somente seria paga após o trânsito em julgado da respectiva ação judicial. Após ter o seu imóvel declarado de utilidade pública com base na Lei nº X, um proprietário procurou você, como advogado(a), para avaliar a sua validade em face da Constituição da República. Assinale a opção que expressa, corretamente, a orientação jurídica dada.", "o": ["A disciplina legal não poderá subsistir, pois a desapropriação exige indenização prévia, embora a matéria possa ser disciplinada pelo Município em razão do interesse predominantemente local na promoção da segurança urbana.", "A validade da disciplina legal dependerá da demonstração, no caso concreto, de que o imóvel era utilizado de forma reiterada para a prática dos ilícitos mencionados na lei municipal, justificando a adoção da medida expropriatória.", "A Lei nº X não se harmoniza com a Constituição da República, pois a matéria tratada insere-se na competência legislativa privativa da União, e o regime indenizatório previsto é incompatível com as garantias constitucionais da desapropriação.", "A Lei nº X está em harmonia com a Constituição da República, pois a proteção dos direitos humanos e o enfrentamento da violência urbana autorizam um tratamento jurídico diferenciado para os imóveis utilizados na prática dos ilícitos descritos no enunciado."], "c": 2, "e": "Art. 22, II, da CF: desapropriação é matéria de competência legislativa privativa da União; além disso, a indenização deve ser prévia (art. 5º, XXIV), e não após o trânsito em julgado."}, {"id": "q16", "n": {"1": 16, "2": 15, "3": 13, "4": 14}, "p": "Antônio Silva, anos após adquirir a nacionalidade brasileira por naturalização, teve sua extradição requerida por Estado estrangeiro, em razão da suposta prática de crime comum cometido antes da conclusão do processo de naturalização. Ao ser cientificado do pedido, procurou você, como advogado(a), sustentando que, por ostentar a condição de brasileiro, não poderia ser entregue ao Estado requerente. Assinale a opção que expressa, corretamente, a orientação jurídica dada.", "o": ["O pedido poderá ser admitido, pois a Constituição da República autoriza a extradição do brasileiro naturalizado na situação concreta apresentada.", "O pedido não poderá ser acolhido, pois a aquisição da nacionalidade brasileira impede a extradição por fatos praticados em momento anterior à naturalização.", "A extradição somente poderá ser admitida se ficar demonstrado que o fato imputado corresponde ao tráfico ilícito de substâncias entorpecentes ou drogas afins.", "A extradição dependerá da demonstração da gravidade da infração penal atribuída ao naturalizado, sendo irrelevante o momento em que ocorreu a sua naturalização."], "c": 0, "e": "Art. 5º, LI, da CF: o naturalizado pode ser extraditado por crime comum praticado antes da naturalização."}]}, {"id": "dh", "nome": "Direitos Humanos", "lei": "Tratados e Tribunal Penal Internacional", "peso": 2, "texto": "<p><strong>Tratados com status de emenda.</strong> Pelo <span class=\"art\">art. 5º, §3º</span> (EC 45/2004), tratados de direitos humanos aprovados em <mark>dois turnos, em cada Casa, por 3/5</mark> dos votos equivalem a emendas constitucionais. Até hoje seguiram esse rito a Convenção sobre os Direitos das Pessoas com Deficiência (e seu Protocolo), o <mark>Tratado de Marraqueche</mark> (acesso a obras por pessoas cegas) e a Convenção Interamericana contra o Racismo. O Pacto de São José e a Convenção de Belém do Pará têm status <mark>supralegal</mark>, pois foram aprovados antes ou fora desse rito. A Declaração Universal não é tratado.</p>\n<p><strong>Tribunal Penal Internacional (Estatuto de Roma).</strong></p>\n<ul>\n<li>Competência <mark>apenas para crimes cometidos após a entrada em vigor</mark> do Estatuto (irretroatividade).</li>\n<li>Julga <mark>pessoas físicas</mark>, ocupantes ou não de cargo público; o cargo oficial não gera imunidade.</li>\n<li>Atua de forma <strong>complementar</strong> às jurisdições nacionais.</li>\n<li>Pode ordenar prisão preventiva, e o Procurador pode abrir inquérito <mark>de ofício</mark> (com autorização do Juízo de Instrução).</li>\n</ul>", "qs": [{"id": "q17", "n": {"1": 17, "2": 18, "3": 17, "4": 18}, "p": "Com a edição da Emenda Constitucional nº 45/2004, foi inserido o § 3º ao Art. 5º da CRFB/88. O referido dispositivo possibilita que, no processo de incorporação dos Tratados e Convenções internacionais sobre Direitos Humanos, seja observada a exigência de apreciação em dois turnos, por cada Casa do Congresso Nacional, com aprovação por três quintos dos votos dos respectivos membros, o que lhes confere equivalência às emendas constitucionais. Assinale a opção que indica, corretamente, o Tratado ou a Convenção Internacional sobre Direitos Humanos que tenha seguido o referido procedimento e, por isso, seja equivalente às emendas constitucionais, nos termos do Art. 5º, § 3º, da CRFB/88.", "o": ["A Declaração Universal dos Direitos Humanos.", "A Convenção Americana sobre Direitos Humanos (Pacto de São José da Costa Rica).", "A Convenção Interamericana para Prevenir, Punir e Erradicar a Violência contra a Mulher (Convenção de Belém do Pará).", "O Tratado de Marraqueche para Facilitar o Acesso a Obras Publicadas às Pessoas Cegas, às com Deficiência Visual ou com outras dificuldades para ter acesso ao texto impresso."], "c": 3, "e": "O Tratado de Marraqueche foi aprovado pelo rito do art. 5º, §3º, e tem equivalência de emenda constitucional. O Pacto de São José e a Convenção de Belém do Pará são supralegais; a Declaração Universal não é tratado."}, {"id": "q18", "n": {"1": 18, "2": 17, "3": 18, "4": 17}, "p": "Ao abordar a criação e a entrada em vigor do Estatuto de Roma de 1998, a doutrina observa que: “Em decorrência das inúmeras violações de direitos humanos ocorridas a partir das primeiras décadas do século XX — principalmente com as duas grandes guerras mundiais —, a ideia de um jus puniendi em plano global começou a integrar a ordem do dia da agenda internacional dos Estados rumo à instituição de uma moderna e dinâmica Justiça Penal Internacional.” MAZZUOLI, Valério de Oliveira. Curso de Direitos Humanos. 10ª ed. Rio de Janeiro: Método, 2024, p. 132. Buscando endereçar essa preocupação, a partir da edição do referido tratado, foi instituído o Tribunal Penal Internacional. Acerca desse Tribunal, assinale a afirmativa correta.", "o": ["O Tribunal Penal Internacional somente possui competência relativamente aos crimes cometidos após a entrada em vigor do Estatuto de Roma.", "Nos termos do seu Estatuto, o Tribunal Penal Internacional não possui competência para determinar a prisão preventiva de eventual pessoa natural por ele investigada.", "O procurador do Tribunal, a quem cabe as atribuições de promotoria, não pode agir de ofício, por sua própria iniciativa, instaurando inquérito com base em informações a que tenha tido acesso de forma espontânea, sobre a prática de crimes da competência do Tribunal.", "O Tribunal Penal Internacional é competente para julgar individualmente autoridades públicas que ocupem ou tenham ocupado cargo de elevado grau de comando, com vistas a promover a sua responsabilização penal nos casos em que os próprios Estados não logrem êxito em promovê-la. O Tribunal, porém, não é competente para julgar indivíduos que não ocupem ou não tenham ocupado cargos públicos, sem qualquer tipo de participação na estrutura burocrática oficial do Estado-nação."], "c": 0, "e": "O TPI só tem competência sobre crimes cometidos após a entrada em vigor do Estatuto de Roma. Ele pode decretar prisão, o Procurador pode agir de ofício e qualquer pessoa física pode ser julgada."}]}, {"id": "eleit", "nome": "Direito Eleitoral", "lei": "LC 64/90 e Lei 9.504/97", "peso": 2, "texto": "<p><strong>Impugnação de registro de candidatura (AIRC).</strong> Podem impugnar, em <mark>5 dias</mark> da publicação do pedido, <mark>qualquer candidato</mark>, partido, federação, coligação ou o Ministério Público <span class=\"art\">LC 64/90, art. 3º</span>. O eleitor comum não tem legitimidade (pode apenas noticiar a inelegibilidade ao juiz).</p>\n<p>Inelegibilidades <strong>infraconstitucionais preexistentes</strong> precluem se não forem alegadas na impugnação. As constitucionais e as supervenientes podem ser arguidas depois, no recurso contra a expedição do diploma.</p>\n<p><strong>Captação ilícita de sufrágio.</strong> Ocorre quando o candidato doa, oferece, promete ou entrega vantagem ao eleitor para obter o voto <span class=\"art\">Lei 9.504/97, art. 41-A</span>.</p>\n<ul>\n<li>Não exige <mark>pedido explícito de voto</mark>; basta a evidência do dolo de obtê-lo.</li>\n<li>Não exige que o eleitor aceite, nem potencialidade para alterar o resultado: um só eleitor basta.</li>\n<li>A representação pode ser ajuizada <mark>até a data da diplomação</mark> <span class=\"art\">art. 41-A, §3º</span>.</li>\n</ul>", "qs": [{"id": "q19", "n": {"1": 19, "2": 20, "3": 20, "4": 19}, "p": "O partido político Delta requereu o registro de candidatura de João para concorrer ao cargo eletivo de Governador do Estado Beta. Maria, por sua vez, filiada ao partido político Sigma, que concorreria ao mesmo cargo eletivo, recebeu provas de que João incorria em uma causa de inelegibilidade de natureza infraconstitucional. Ao levar esse fato ao conhecimento do diretório de Sigma, Maria foi informada, ainda no prazo de impugnação do registro, de que o partido político não adotaria qualquer medida em relação à candidatura de João. Por essa razão, Maria contratou você, como advogado(a), para analisar o que ela poderia fazer nessa situação. Com relação à hipótese apresentada, assinale a opção que apresenta a orientação jurídica correta.", "o": ["No registro de candidatura, são avaliadas as condições de elegibilidade, não as causas de inelegibilidade, como a que recai sobre João, o que deve ser feito após o deferimento do registro.", "Os legitimados para impugnar o registro de João são a federação, a coligação, o partido político e o Ministério Público, sendo vedado suscitar uma causa de inelegibilidade posteriormente.", "A inelegibilidade na qual João incorre, de natureza infraconstitucional, pode ser invocada no prazo de impugnação do registro, tendo Maria, apenas por ser candidata, legitimidade para fazê-lo.", "Maria, como qualquer do povo, tem legitimidade para impugnar o registro de candidatura de João, único momento em que podem ser suscitadas as inelegibilidades, constitucionais ou infraconstitucionais."], "c": 2, "e": "Art. 3º da LC 64/90: qualquer candidato tem legitimidade para impugnar o registro, e a inelegibilidade infraconstitucional preexistente deve ser alegada nesse prazo, sob pena de preclusão."}, {"id": "q20", "n": {"1": 20, "2": 19, "3": 19, "4": 20}, "p": "Uma emissora de televisão divulgou ampla reportagem a respeito da conduta de João na eleição do ano Y, candidato com registro deferido para concorrer ao cargo de Deputado Estadual pelo partido político Sigma, que fora filmado enquanto conversava com Pedro, eleitor com domicílio eleitoral no mesmo Estado de João. Nessa conversa, João afirmou que, caso Pedro lhe confiasse o voto na eleição a ser realizada em outubro do referido ano, teria os recursos necessários para pintar a casa dele. Ao tomar conhecimento do teor da reportagem, o presidente do diretório estadual do partido político Beta o consultou como advogado(a) em relação à caracterização, ou não, da captação ilícita de sufrágio vedada pela Lei nº 9.504/1997, de modo a ensejar a cassação do registro de João. Quanto à orientação jurídica a ser dada, assinale a afirmativa correta.", "o": ["Não houve pedido explícito de voto, logo o dolo de João não está caracterizado.", "É cabível o ajuizamento de representação por captação ilícita de sufrágio, desde que isso seja feito até a data da diplomação.", "Desde que seja demonstrado que Pedro aceitou a oferta de João, está caracterizada a captação ilícita de sufrágio, que observará a mesma sistemática afeta à investigação judicial eleitoral.", "Como a solicitação de João foi direcionada a um único eleitor, a conduta não apresenta potencialidade para comprometer a normalidade da eleição, logo não está configurada a captação ilícita de sufrágio."], "c": 1, "e": "Art. 41-A, §3º da Lei 9.504/97: a representação por captação ilícita de sufrágio pode ser ajuizada até a data da diplomação. Não se exige pedido explícito, aceitação do eleitor nem potencialidade lesiva."}]}, {"id": "inter", "nome": "Direito Internacional", "lei": "Tratados e LINDB", "peso": 2, "texto": "<p><strong>Internalização de tratados no Brasil.</strong> O Presidente celebra; o Congresso aprova por <mark>decreto legislativo</mark> <span class=\"art\">CF, art. 49, I</span>, com a análise começando pela Câmara dos Deputados; o Presidente ratifica no plano internacional; e, no plano interno, o processo se encerra com o <mark>decreto presidencial de promulgação</mark> publicado no Diário Oficial. Não há quórum especial de lei complementar para tratados tributários.</p>\n<p><strong>LINDB e conflito de leis no espaço.</strong></p>\n<ul>\n<li>Regime de bens: lei do país do <mark>domicílio dos nubentes</mark>; se diversos, a do <mark>primeiro domicílio conjugal</mark> <span class=\"art\">art. 7º, §4º</span>.</li>\n<li>Sucessão: lei do país de <mark>domicílio do falecido</mark>, não da nacionalidade <span class=\"art\">art. 10</span>.</li>\n<li>Prova de fatos ocorridos no estrangeiro: rege-se pela <mark>lei do lugar</mark> onde ocorreram <span class=\"art\">art. 13</span>.</li>\n<li>Imóveis situados no Brasil: competência <mark>exclusiva</mark> da autoridade brasileira, seja qual for a nacionalidade do proprietário <span class=\"art\">art. 12, §1º</span>.</li>\n</ul>", "qs": [{"id": "q21", "n": {"1": 21, "2": 22, "3": 22, "4": 21}, "p": "O processo de internalização de um tratado internacional varia de acordo com o ordenamento constitucional de cada país. No Brasil trata-se de processo multifásico, com a participação tanto do Poder Executivo, quanto do Poder Legislativo. Assinale a afirmativa correta sobre o processo de internalização de tratados internacionais no Brasil.", "o": ["No plano doméstico, o processo de internalização se encerra com a publicação de um decreto presidencial que promulgue o tratado internacional em questão.", "O Senado Federal, como Casa responsável por aprovar as indicações de embaixadores, é também onde se inicia a análise de tratados internacionais assinados pelo Presidente da República.", "Os tratados internacionais que tratam de matéria tributária precisam ser aprovados no Congresso Nacional com quórum de lei complementar.", "No caso de tratados de Direitos Humanos submetidos ao processo de ratificação previsto no Art. 5º, § 3º, da Constituição Federal, dotados de status de emenda constitucional, cabe ao Presidente do Congresso Nacional promulgar e publicar o decreto correspondente."], "c": 0, "e": "No plano doméstico, a internalização termina com o decreto presidencial que promulga o tratado. A apreciação começa na Câmara, não há quórum de lei complementar para tratados tributários e quem promulga é o Presidente da República."}, {"id": "q22", "n": {"1": 22, "2": 21, "3": 21, "4": 22}, "p": "A Lei de Introdução às Normas do Direito Brasileiro é fundamental para o entendimento e a aplicação do Direito Internacional Privado no Brasil. Entre as suas normas estão aquelas que regulam os conflitos de lei no espaço. Sendo assim, com base no direito positivo brasileiro, assinale a afirmativa correta.", "o": ["A prova de fatos ocorridos no estrangeiro, em processo que tramita no Brasil, se rege sempre pela lei brasileira, não importa onde ocorram.", "No inventário judicial, o Juiz brasileiro deve obedecer à lei de nacionalidade do defunto, sendo desimportante o local de sua residência.", "O regime de bens, legal ou convencional, obedece à lei do país em que os nubentes tiverem domicílio, e, se este for diverso, à do primeiro domicílio conjugal.", "A autoridade judiciária brasileira é competente para conhecer as ações relativas a imóveis situados no Brasil, salvo se um dos proprietários for estrangeiro."], "c": 2, "e": "Art. 7º, §4º da LINDB: o regime de bens segue a lei do domicílio dos nubentes ou, se diverso, a do primeiro domicílio conjugal."}]}, {"id": "fin", "nome": "Direito Financeiro", "lei": "LRF e duodécimos", "peso": 2, "texto": "<p><strong>Empresa estatal dependente x não dependente.</strong> A LRF só alcança as empresas estatais <mark>dependentes</mark>, isto é, as que recebem recursos do ente controlador para pagar pessoal, custeio ou capital <span class=\"art\">LC 101/2000, art. 2º, III</span>. A estatal <mark>não dependente</mark> não entra no cálculo dos limites de despesa total com pessoal.</p>\n<p><strong>Duodécimos e saldo ao fim do ano.</strong> Os recursos orçamentários dos Poderes e órgãos autônomos são entregues até o dia 20 de cada mês, em duodécimos <span class=\"art\">CF, art. 168</span>. O saldo financeiro não utilizado ao fim do exercício deve ser <mark>restituído ao caixa único do Tesouro</mark> do ente federativo ou <mark>deduzido das primeiras parcelas duodecimais</mark> do exercício seguinte <span class=\"art\">art. 168, §2º</span>. Saldo remanescente não configura, por si, má gestão.</p>", "qs": [{"id": "q23", "n": {"1": 23, "2": 24, "3": 23, "4": 24}, "p": "O Banco XYZ S.A., sociedade de economia mista federal (estatal não dependente) e que não faz uso de recursos públicos para pagamento de pessoal, recebeu uma equipe de fiscalização do Tribunal de Contas da União (TCU), que desejava saber, entre outras questões, o valor das remunerações pagas aos diretores do banco, para fins de cálculo do limite de despesas totais com pessoal previstas na Lei Complementar nº 101/2000 (Lei de Responsabilidade Fiscal - LRF). Constatando que os diretores recebiam acima do teto remuneratório constitucional (a saber, o subsídio dos Ministros do Supremo Tribunal Federal - STF), o TCU determinou que as remunerações dos diretores fossem limitadas ao teto constitucional, deixando de computar o excesso remuneratório acima do teto para a apuração da despesa total com pessoal prevista na LRF. Sobre a hipótese apresentada, assinale a afirmativa correta.", "o": ["O Banco XYZ S.A., por se tratar de uma empresa estatal não dependente, não se submete aos limites de despesa total com pessoal previstos na LRF.", "Os dirigentes do referido banco, nos termos da LRF, podem ser pessoalmente responsabilizados pelo excesso remuneratório acima do teto efetivamente recebido.", "O TCU deveria ter computado o excesso remuneratório acima do teto efetivamente pago aos dirigentes do Banco XYZ S.A. para a apuração da despesa total com pessoal prevista na LRF.", "A LRF veda, expressamente, o pagamento de remuneração a dirigentes de instituições financeiras estatais não dependentes que suplantem o teto remuneratório constitucional."], "c": 0, "e": "A LRF aplica-se às estatais dependentes. Como o Banco XYZ é estatal não dependente, não se submete aos limites de despesa total com pessoal da lei."}, {"id": "q24", "n": {"1": 24, "2": 23, "3": 24, "4": 23}, "p": "Determinado Tribunal Regional do Trabalho (TRT), ao fim de um determinado exercício financeiro, constatou que, em 31 de dezembro, ainda havia saldo financeiro orçamentário em seu caixa que não chegou a ser utilizado. Diante desse cenário, assinale a afirmativa correta.", "o": ["Caso o TRT retenha tal saldo financeiro, tais valores não poderão ser deduzidos das primeiras parcelas duodecimais do exercício seguinte.", "Por estar vinculado ao Supremo Tribunal Federal (STF) como órgão de cúpula do Poder Judiciário, esse TRT deverá restituir esse saldo ao caixa único do STF.", "O TRT deverá restituir esse saldo ao caixa único do Tesouro da União ou esse valor de saldo será deduzido das primeiras parcelas duodecimais do exercício seguinte.", "A existência de saldo financeiro desse TRT ao final do ano configura má gestão do erário, devendo aquele que lhe deu causa ser punido criminal e administrativamente."], "c": 2, "e": "Art. 168, §2º, da CF: o saldo financeiro dos duodécimos não utilizado deve ser restituído ao caixa único do Tesouro ou deduzido das primeiras parcelas do exercício seguinte."}]}, {"id": "trib", "nome": "Direito Tributário", "lei": "CF e CTN", "peso": 5, "texto": "<p><strong>ITCMD.</strong> Na doação de <mark>bem imóvel</mark>, o imposto cabe ao Estado da <mark>situação do bem</mark> <span class=\"art\">CF, art. 155, §1º, I</span>. Para bens móveis, cabe ao Estado do domicílio do doador.</p>\n<p><strong>ITBI na integralização de capital.</strong> O ITBI <mark>não incide</mark> sobre a transmissão de imóveis incorporados ao patrimônio de pessoa jurídica para realização de capital, salvo se a atividade preponderante for compra, venda ou locação de imóveis <span class=\"art\">CF, art. 156, §2º, I</span>. Não é doação e não gera IOF.</p>\n<p><strong>Isenção heterônoma.</strong> A União <mark>não pode conceder isenção de tributos</mark> de Estados, DF ou Municípios <span class=\"art\">CF, art. 151, III</span>, mesmo em calamidade. A exceção é a de tratados internacionais firmados pela República.</p>\n<p><strong>Capacidade tributária ativa.</strong> A competência para <em>instituir</em> tributo é indelegável, mas as funções de <mark>arrecadar, fiscalizar e executar</mark> leis e atos podem ser delegadas a outra pessoa jurídica de direito público <span class=\"art\">CTN, art. 7º</span>, com as garantias e privilégios processuais.</p>\n<p><strong>Certidões.</strong> A certidão <strong>negativa</strong> exige ausência de débitos. Quando há créditos <mark>não vencidos</mark>, em curso de cobrança executiva garantida ou com <mark>exigibilidade suspensa</mark>, expede-se certidão <mark>positiva com efeitos de negativa</mark> <span class=\"art\">CTN, art. 206</span>, que vale para licitações.</p>", "qs": [{"id": "q25", "n": {"1": 25, "2": 26, "3": 27, "4": 28}, "p": "José, residente e domiciliado em Belo Horizonte, MG, pretende doar para Mário, seu único filho maior, residente e domiciliado em Vitória, ES, um imóvel de sua propriedade, situado no Município de Salvador, capital do Estado da Bahia. Sobre a hipótese apresentada, assinale a opção que indica o ente federado ao qual é devido o Imposto sobre a Transmissão Causa Mortis e Doação (ITCMD) incidente nessa transmissão por doação.", "o": ["O Estado do Espírito Santo, em que o donatário Mário é residente e domiciliado.", "O Estado da Bahia, por competir ao Estado da situação do bem imóvel a ser doado.", "O Estado de Minas Gerais, por competir ao Estado em que José, o doador, é residente e domiciliado.", "O Município de Salvador, por ser um tributo de competência do Município onde se localiza o imóvel."], "c": 1, "e": "Art. 155, §1º, I, da CF: na doação de imóvel, o ITCMD compete ao Estado da situação do bem, no caso a Bahia."}, {"id": "q26", "n": {"1": 26, "2": 27, "3": 28, "4": 29}, "p": "Marcelo foi convidado a integrar os quadros sociais da sociedade empresária XYZ S.A., uma sociedade anônima brasileira de capital fechado, que atua no ramo de comércio de roupas e tem como atuais sócios, Eduardo e Marcos. O capital social foi aumentado, gerando novas ações que serão subscritas por Marcelo, para que assuma a condição de sócio. A título de pagamento para a subscrição de tais ações, Marcelo transferiu um imóvel de sua propriedade em integralização de capital, em troca recebendo uma determinada quantidade de ações da sociedade empresária. Ciente de que o valor de mercado do imóvel corresponde exatamente ao valor das ações subscritas, sobre a tributação dessa operação, assinale a afirmativa correta.", "o": ["Incidirá sobre a aquisição das ações o imposto sobre operações de crédito, câmbio e seguro, ou relativas a títulos ou valores mobiliários (IOF).", "A transferência de propriedade do imóvel de Marcelo para a sociedade empresária, para fins de integralização de capital social, não é uma operação tributável.", "A integralização de capital social por meio de um bem imóvel equipara-se a uma doação e deverá incidir o Imposto sobre Transmissão Causa Mortis e Doações de Bens e Direitos (ITCMD).", "O Imposto sobre a Transmissão de Bens Imóveis (ITBI), incidente na transferência de propriedade do imóvel entre Marcelo e a sociedade empresária XYZ S.A., em troca das novas ações, é devido ao município do domicílio de Marcelo."], "c": 1, "e": "Art. 156, §2º, I, da CF: não incide ITBI na integralização de capital com imóvel, salvo atividade preponderantemente imobiliária, que não é o caso de comércio de roupas."}, {"id": "q27", "n": {"1": 27, "2": 28, "3": 29, "4": 25}, "p": "Em razão de grave calamidade pública causada por fortes enchentes no território do Município Alfa no final de 2024, a União transferiu a tal Município, devidamente autorizada por lei específica, vultosos recursos para combater os efeitos da calamidade natural. De modo a também aliviar a pressão tributária sobre os cidadãos dessa municipalidade, lei ordinária federal, publicada em 29/12/2024, previu também a isenção de Imposto sobre a Propriedade Predial e Territorial Urbana (IPTU) nesse Município, durante todo o ano de 2025. Sabendo-se que o fato gerador do IPTU, nesse Município, ocorre em 1º de janeiro de cada ano, assinale a afirmativa correta.", "o": ["Tal isenção, ainda que concedida por razões humanitárias, viola a autonomia tributária municipal, por ter sido concedida pela União.", "Por configurar lei de isenção mais benéfica ao contribuinte, seu efeito de impedir a cobrança do IPTU poderá ser produzido imediatamente.", "Tal lei, embora constitucional, não poderá produzir seus efeitos em 1º de janeiro de 2025, sob pena de violação à anterioridade tributária nonagesimal.", "Tratando-se de estado de calamidade pública, existe autorização constitucional para que o Congresso Nacional, com sanção do Presidente da República, conceda esse tipo de isenção."], "c": 0, "e": "Art. 151, III, da CF: é vedado à União instituir isenção de tributo municipal (isenção heterônoma). A calamidade não excepciona a regra."}, {"id": "q28", "n": {"1": 28, "2": 29, "3": 25, "4": 26}, "p": "O Estado Beta promulgou uma lei estadual ordinária que autoriza os seus Municípios a firmarem um convênio para que o próprio Estado Beta exerça as funções de arrecadar e fiscalizar o IPTU em todo o território municipal. A lei estadual também prevê que, nos termos do convênio, seja possível delegar ao Estado Beta a função de cobrança extrajudicial e judicial do IPTU. O Município Alfa aderiu à previsão legislativa por meio de convênio com o Estado Beta, e este passou a notificar os contribuintes e lavrar autos de infração para a cobrança do IPTU no território do Município Alfa. Quando ocorria inadimplemento, o Estado Beta, por meio de sua Procuradoria, promovia a competente Ação de Execução Fiscal. Alguns contribuintes autuados questionam a legalidade da fiscalização e da cobrança feita pelo Estado Beta, alegando que a competência tributária municipal é indelegável. Diante desse cenário, assinale a afirmativa correta.", "o": ["Poderia ser delegada ao Estado Beta a atribuição de fiscalização desse tributo municipal, mas não a de sua cobrança judicial por meio da Procuradoria do Estado Beta.", "A lei ordinária estadual poderia deferir ao Estado Beta, via convênio, a atribuição de fiscalização do IPTU municipal, bem como a de cobrança extrajudicial ou judicial do tributo.", "A fiscalização e cobrança de tal tributo não é legal por ausência de previsão em lei complementar de caráter nacional, que autorize a delegação, não sendo suficiente a mera lei ordinária estadual.", "A fiscalização realizada pelo Estado Beta é ilegal, pois a competência tributária para instituir e fiscalizar tal tributo é exclusiva do Município Alfa, não podendo ser delegada a qualquer outro ente federativo."], "c": 1, "e": "Art. 7º do CTN: a capacidade tributária ativa (arrecadar, fiscalizar, executar) pode ser delegada a outra pessoa jurídica de direito público, inclusive a cobrança judicial."}, {"id": "q29", "n": {"1": 29, "2": 25, "3": 26, "4": 27}, "p": "A sociedade empresária Equipamentos Ltda. precisa participar de uma licitação pública e, para isso, deve apresentar certidão de regularidade fiscal municipal. Ao solicitar o documento na Prefeitura, o contador da sociedade empresária foi comunicado que existe um débito de IPTU do exercício de 2026 ainda não vencido (vencimento em 30 dias) e outro débito de taxa municipal, que está com a exigibilidade suspensa por força de liminar em mandado de segurança. O servidor público da Prefeitura informou que, por existirem débitos tributários em aberto, só pode emitir uma certidão positiva, o que impedirá a sociedade empresária de participar da licitação. Diante desse cenário, assinale a afirmativa correta.", "o": ["A certidão negativa a ser emitida deverá conter apenas os débitos não vencidos, excluindo-se os débitos com exigibilidade suspensa, que devem constar como positivos.", "A Prefeitura está correta ao emitir uma certidão positiva, pois se exige a efetiva quitação de todos os tributos para a expedição de certidão negativa ou positiva com efeitos de negativa.", "A sociedade empresária poderá obter certidão negativa apenas em relação ao débito com exigibilidade suspensa, mas o débito de IPTU não vencido impede a emissão de certidão negativa.", "A sociedade empresária não faz jus a uma certidão negativa, pois existem débitos tributários relacionados a ela, mas poderá obter uma certidão positiva com efeitos de negativa."], "c": 3, "e": "Art. 206 do CTN: débito não vencido e débito com exigibilidade suspensa não permitem certidão negativa, mas autorizam a positiva com efeitos de negativa."}]}, {"id": "adm", "nome": "Direito Administrativo", "lei": "Atos, processo, desapropriação, licitações e concessões", "peso": 5, "texto": "<p><strong>Omissão administrativa.</strong> Diante do silêncio da Administração:</p>\n<ul>\n<li>Em ato <strong>vinculado</strong>, preenchidos os requisitos, o Judiciário pode <mark>reconhecer o direito ao próprio ato</mark>, sem ofender a separação de Poderes.</li>\n<li>Em ato <strong>discricionário</strong>, o Judiciário só pode <mark>determinar que a Administração decida</mark>, sem substituir o mérito administrativo.</li>\n</ul>\n<p><strong>Delegação no processo administrativo federal.</strong> A delegação pode ser feita a órgão ou agente, ainda que não subordinado. Mas <mark>não podem ser delegados</mark> a edição de atos normativos, <mark>a decisão de recursos administrativos</mark> e as matérias de competência exclusiva <span class=\"art\">Lei 9.784/99, art. 13</span>.</p>\n<p><strong>Benfeitorias após a declaração de utilidade pública.</strong> Serão indenizadas as <mark>necessárias</mark>; as <mark>úteis, só se autorizadas</mark> pelo expropriante; as voluptuárias, não <span class=\"art\">DL 3.365/41, art. 26, §1º</span>.</p>\n<p><strong>Contratação de artista.</strong> É hipótese de <mark>inexigibilidade</mark> a contratação de profissional do setor artístico consagrado pela crítica ou pela opinião pública, diretamente ou por empresário exclusivo <span class=\"art\">Lei 14.133/21, art. 74, II</span>. O valor do cachê é irrelevante.</p>\n<p><strong>Encampação.</strong> É a retomada do serviço pelo poder concedente durante a concessão, por <mark>interesse público</mark>, mediante <mark>lei autorizativa específica</mark> e <mark>prévio pagamento de indenização</mark> <span class=\"art\">Lei 8.987/95, art. 37</span>. Não confundir com caducidade, que decorre de inadimplemento da concessionária.</p>", "qs": [{"id": "q30", "n": {"1": 30, "2": 31, "3": 32, "4": 33}, "p": "A sociedade empresária Esperança formulou dois pedidos perante a Administração Pública. Um deles corresponde ao deferimento de um ato administrativo simples vinculado, para o qual preenche os respectivos requisitos previstos em lei. O outro diz respeito a um ato administrativo simples discricionário, em relação ao qual houve a apresentação da documentação pertinente, para fins de apreciação. Ocorre que a Administração Pública está inerte em relação aos aludidos pleitos há mais de dois anos, razão pela qual você, como advogado(a), foi contratado(a) para adotar as medidas pertinentes em juízo, com o objetivo de defender os interesses da mencionada pessoa jurídica. Assinale a opção que indica a conduta que você, corretamente, deve adotar.", "o": ["As ações ajuizadas devem, em ambos os casos, pleitear apenas o reconhecimento da omissão administrativa, com a determinação para que haja o pronunciamento da autoridade competente, considerando que em nenhuma das hipóteses o Judiciário poderá reconhecer o direito subjetivo ao ato pretendido sem violar o princípio da separação de Poderes.", "Somente deve ser ajuizada ação com o objetivo de obter reconhecimento da omissão administrativa, com a determinação para que haja o pronunciamento da autoridade competente em relação ao ato vinculado, na medida em que os atos discricionários não podem ser submetidos ao controle jurisdicional, em razão do princípio da separação de Poderes.", "Deve ser ajuizada ação para obter o reconhecimento da omissão administrativa, com a determinação para que haja o pronunciamento da autoridade competente, no que concerne ao ato discricionário, e para o reconhecimento do direito subjetivo à obtenção do ato vinculado, providência, nesse último caso, que não viola o princípio da separação de Poderes.", "Nas duas situações, deve ser ajuizada ação para obter o deferimento do ato, pois o preenchimento dos requisitos previstos em lei para o ato vinculado e a apresentação da documentação pertinente para o ato discricionário ensejam o direito subjetivo à obtenção de ambas as providências pelo Judiciário, sem que haja a violação ao princípio da separação de Poderes."], "c": 2, "e": "No ato vinculado, o Judiciário pode reconhecer o direito subjetivo ao ato; no discricionário, apenas determinar
